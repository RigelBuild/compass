# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
# The generated TypeScript client for compass.v1. System tasks: bun + biome
# from the devenv/proto toolchain on PATH. typecheck/test compile the checked-in
# generated client (src/gen); compass-proto:drift gates its freshness.
layer: 'library'
language: 'typescript'
tags: ['bun', 'oss', 'ci-group.bun']
dependsOn: ['compass-proto']

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['src/**/*', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock']
  test:
    inputs: ['src/**/*', 'package.json', '/bun.lock']
  ci:
    deps: ['typecheck', 'test']
    options:
      cache: false
