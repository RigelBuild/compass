# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
# The generated TypeScript client for compass.v1. System tasks: bun + biome
# from the devenv/proto toolchain on PATH. typecheck/test need the generated
# client to exist (proto:gen).
layer: 'library'
language: 'typescript'
dependsOn: ['proto']

tasks:
  install:
    command: 'bun install --frozen-lockfile'
    inputs: ['package.json', '/bun.lock']
    options:
      internal: true
      cache: false
      # Serialize with the other workspace bun install (apps/ui) — concurrent
      # `bun install` on the same workspace race on node_modules.
      mutex: 'bun-install'
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install', 'proto:gen']
    inputs: ['src/**/*', 'tsconfig.json', 'package.json', '/bun.lock']
  test:
    command: 'bun test'
    deps: ['install', 'proto:gen']
    inputs: ['src/**/*', 'package.json', '/bun.lock']
  ci:
    deps: ['typecheck', 'test']
    options:
      cache: false
