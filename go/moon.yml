# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
# The Compass backend Go module (go/). This lane keeps the generated compass.v1
# Go stubs compiling + drift-free AND runs the full Go gate battery
# (docs/designs/platform/go-toolchain-default.md T10 +
# go-idioms-and-libraries.md L1/L2): gofmt + go vet + golangci-lint (with the
# gochecksumtype/exhaustive exhaustiveness gate on), a CGO -race test lane, go
# build, the supply-chain fence (govulncheck + go-licenses), and nilaway
# nil-flow analysis (gating, zero baseline — see the nilaway task below).
#
# Tagged `oss` for the import boundary (may only depend on other oss/ projects),
# NOT `bun` — it is a Go module. go/gofmt/golangci-lint/govulncheck/go-licenses/
# nilaway all come from the devenv/nix dev shell (and CI's nix toolchain step)
# on PATH.
layer: 'library'
language: 'go'
tags: ['oss', 'ci-group.go']

workspace:
  inheritedTasks:
    # Go module, not a bun package: skip the global install + biome lint/format
    # that tag-bun.yml applies to every project (it has no inheritedBy scope).
    exclude: ['install', 'lint', 'format']

# gen/drift for the compass.v1 schema live on compass-proto (it owns the single
# buf pipeline that fans out to both language lanes — TS and Go). Expose
# them here as thin aliases so `moon run compass-go:gen` / `:drift` resolve and
# so a change under go/gen/ schedules the drift gate through this project too.
dependsOn:
  - 'compass-proto'

tasks:
  gen:
    # Regenerate all client lanes (delegates to the owning proto project).
    deps: ['compass-proto:gen']
    options:
      runInCI: false
  drift:
    # Fail if the checked-in Go stubs are stale vs the schema (delegates to the
    # proto project's drift gate, which diffs the Go tree too).
    deps: ['compass-proto:drift']

  fmt:
    # gofmt --check over the module: lists any files that differ from canonical
    # form and fails (never rewrites) if any do. Mirrors the Rust fmt task's
    # --check posture (compass-proto/moon.yml). The generated gen/ tree is
    # included deliberately — protoc-gen-go output is already gofmt-canonical, so
    # it never trips this, and the drift gate owns its correctness regardless.
    script: 'out=$(gofmt -l .); if [ -n "$out" ]; then echo "gofmt needs to run on:"; echo "$out"; exit 1; fi'
    options:
      runFromWorkspaceRoot: false
    inputs: &go_sources
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      # Fixture files (JSON under **/testdata/**) are NOT matched by '**/*.go',
      # so a fixture-only diff (a golden -update regeneration commit) would
      # schedule nothing on the affected-PR path. Adding the glob here keeps the
      # Go battery running when only fixtures change — an inputs-glob edit in the
      # project's own moon file, not a banned CI-workflow project enumeration.
      - '**/testdata/**'
      # go.work / go.work.sum are not present today, but a workspace file
      # rewrites which modules the go commands see, so it must invalidate this
      # lane the moment one lands — otherwise a go.work-only change would read as
      # affecting nothing and the affected PR gate would skip the Go battery.
      # Both placements are covered: the project-relative pair for a go/-local
      # workspace, and the `/`-prefixed workspace-root pair for the conventional
      # repo-root go.work — which is where it must live to unify go/ with a
      # second module, and which go's upward search from go/ actually honors.
      - 'go.work'
      - 'go.work.sum'
      - '/go.work'
      - '/go.work.sum'

  vet:
    # go vet: the compiler-adjacent correctness pass (printf, struct tags,
    # unreachable code). Fast, and distinct from golangci-lint's staticcheck set.
    command: 'go vet ./...'
    options:
      runFromWorkspaceRoot: false
    inputs: *go_sources

  lint:
    # golangci-lint over the module against .golangci.yml (F1 enable-all +
    # reasoned disable-list, with the load-bearing gochecksumtype/exhaustive
    # exhaustiveness gate on). The gate (L1/L2). `--config` is explicit so the
    # run can't silently fall back to a discovered or absent config.
    command: 'golangci-lint run --config .golangci.yml ./...'
    env:
      # Give each workspace its own golangci-lint cache. The default shared
      # ~/.cache/golangci-lint is a single-writer resource: when several agents
      # lint concurrently from separate jj workspaces on one host, they either
      # hit its lock or cross-contaminate — a peer's already-torn-down worktree
      # path surfaces as phantom findings (e.g. nolint directives read as
      # unsuppressed) in an unrelated clean diff, reddening this gate. A task
      # env applies wherever moon runs the task — including the ephemeral
      # jj push-gate worktree, which re-derives its shell env and would drop a
      # plain shell export — so scoping the cache to $projectRoot (the go/ dir)
      # makes the cache path unique per worktree and the contamination
      # structurally impossible. gitignored (go/.golangci-cache).
      GOLANGCI_LINT_CACHE: '$projectRoot/.golangci-cache'
    options:
      runFromWorkspaceRoot: false
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      # golangci-lint honors GOWORK, so a workspace file changes what it
      # analyzes — same coverage as go_sources (this task can't use the anchor
      # because it adds .golangci.yml). Both placements, per the fmt note above.
      - 'go.work'
      - 'go.work.sum'
      - '/go.work'
      - '/go.work.sum'

  nilaway:
    # nilaway: cross-function nil-flow analysis — the closest Go gets to Rust's
    # no-null guarantee (F2). GATING: the baseline is zero, so a new nil flow a
    # PR's diff introduces fails `compass-go:ci` here (this task is a `ci` dep).
    # The prescribed response to a finding is a guard at the deref, never a
    # suppression: nilaway ignores `//nolint` (GC2) and its only opt-out is
    # file-granular, so a real finding is fixed by failing toward the existing
    # error path with a wire-contract message (GC3), and a believed false
    # positive with no guardable shape escalates to Matt — never a file opt-out
    # or a scope-narrowing of this command (GC1). See
    # docs/designs/repo/compass-nilaway-gating/design.md.
    # `-include-pkgs` scopes it to first-party code, not deps/stdlib; the two
    # exclusions pair with .golangci.yml so both tools agree on what is out of
    # scope. `-exclude-errors-in-files` drops the checked-in protoc/connect
    # output (AGENTS.md forbids hand-editing `go/gen`; buf's `clean: true` wipes
    # both trees on regeneration). Its patterns are unanchored string prefixes
    # resolved against the task CWD — hence `runFromWorkspaceRoot: false`, and
    # hence the cut at the `compass/v1` package root: the narrowest spelling that
    # still covers the whole generated tree, since a shorter one could also
    # swallow first-party code such as a future `generator/` package. It is
    # version-pinned, so a `compass/v2` tree must be added here or its findings
    # return — the one sanctioned exclusion edit. `-test=false` covers
    # golangci's `path: _test\.go` class but is coarser — golangci relaxes named
    # linters on tests, while nilaway has no per-linter dial, so this also drops
    # flows whose source is a test caller even when the deref is in shipped code.
    # There is no per-site alternative: run standalone rather than under
    # golangci-lint, nilaway ignores `//nolint`, and its docstring opt-out
    # silences a whole file.
    script: 'nilaway -include-pkgs=github.com/RigelBuild/compass/go -test=false -exclude-errors-in-files="gen/compass/v1/,internal/gen/compass/v1/" ./...'
    options:
      runFromWorkspaceRoot: false
    inputs: *go_sources

  build:
    # Compile the whole module: proves the generated stubs and the ported
    # backend packages build. `runFromWorkspaceRoot: false` runs in the project
    # dir so `go build` resolves go.mod; `./...` is every package.
    command: 'go build ./...'
    options:
      runFromWorkspaceRoot: false
    inputs: *go_sources

  test:
    # Run the module's unit + transport tests under the race detector. The race
    # detector requires cgo (CGO_ENABLED=1), so this lane opts back in — Global
    # Constraint 5's release-build CGO_ENABLED=0 governs the shipped binary, not
    # the test lane (go-toolchain-default.md T10, :1074-1076).
    command: 'go test -race ./...'
    env:
      CGO_ENABLED: '1'
    options:
      runFromWorkspaceRoot: false
    inputs: *go_sources

  test-microvm:
    # The KVM-gated microVM boot suite (RIG-2591, record §T4). It compiles only
    # under `-tags microvm`, so the untagged `test` lane above never builds it;
    # this task realises the guest image + VMM stack from nix and execs
    # `go test -tags microvm ./internal/runtime/microvm/...` with the env
    # microvmtest.Require reads. The realisation + exec logic lives in a bun
    # script (rule://scripts-ts-over-bash + the no-bash-gate CI task forbid this
    # much logic in a shell `script:`); the microvm-boot-test project carries its
    # unit tests.
    #
    # deps: compass-guest-image:build orders the guest-image realise first and
    # scopes this task to the SAME affected-detection, so the nix builds the
    # script runs are store cache hits rather than cold builds.
    #
    # runInCI:false — the CI KVM leg runs the tagged suite its own way
    # (ci.yml's "microVM suites" step); this lane is the dev-box entry point and
    # needs KVM + a local nix build. cache:false — nix owns the build caching and
    # the subject is a live KVM boot, never a hashable input.
    command: 'bun run tools/microvm-boot-test/run.ts'
    deps: ['compass-guest-image:build']
    options:
      runFromWorkspaceRoot: true
      cache: false
      runInCI: false

  vuln:
    # govulncheck: known-vulnerability scan over the module's actual call graph
    # (reports only vulns in code paths the module reaches). It queries the Go
    # vuln DB (vuln.go.dev), so it is a network gate.
    command: 'govulncheck ./...'
    options:
      runFromWorkspaceRoot: false
      # Consults the live vuln DB, so its result isn't a pure function of the
      # inputs — never cache a security scan.
      cache: false
    inputs: *go_sources

  licenses:
    # go-licenses: the dependency-license fence — fails if any dependency's
    # license is outside the permissive allowlist (Apache-2.0 incl. the
    # LLVM-exception, MIT, the BSD family, ISC, Unicode-3.0, Zlib, MPL-2.0,
    # CC0-1.0). The first-party module packages carry no LICENSE file (the
    # license lives at the repo root), so --ignore excludes the module's own
    # import path — the fence governs third-party deps, which is its job.
    command: 'go-licenses check ./... --allowed_licenses=Apache-2.0,Apache-2.0-WITH-LLVM-exception,MIT,BSD-3-Clause,BSD-2-Clause,ISC,Unicode-3.0,Zlib,MPL-2.0,CC0-1.0 --ignore github.com/RigelBuild/compass/go'
    options:
      runFromWorkspaceRoot: false
      cache: false
    inputs: *go_sources

  sqlc-gen:
    # Regenerate the typed Go in internal/store/db from the .sql query files,
    # compiled against internal/store/migrations. The checked-in output is the
    # source of truth; sqlc-drift (below) gates that it stays in sync. sqlc is
    # on PATH from the devenv packages literal (devenv.nix). Local convenience
    # task, not a gate — runInCI:false so a bare `moon run :ci` never rewrites
    # the tree; drift is what CI enforces.
    command: 'sqlc generate'
    options:
      runFromWorkspaceRoot: false
      runInCI: false
    inputs: &sqlc_sources
      - 'sqlc.yaml'
      - 'internal/store/queries/**/*.sql'
      - 'internal/store/migrations/**/*.sql'
      - 'internal/store/db/**/*.go'

  sqlc-drift:
    # Fail if the checked-in internal/store/db tree is stale vs the query +
    # schema sources: snapshot the committed tree, regenerate in place, and fail
    # on any byte diff (a query edit committed without regeneration). Unlike
    # `drift` above — which delegates to the compass-proto schema pipeline and is
    # scheduled through the gen tree, so it is deliberately kept OUT of `ci` —
    # sqlc-drift is fully local (no cross-project delegation, no DB), so it joins
    # `ci` directly. `git diff --no-index` compares raw file trees (reads no
    # index/worktree state, and git is always on PATH — unlike `diff`), so it
    # runs identically in CI and in a secondary jj workspace; a `git status`
    # check would false-green where the workspace is not a git checkout. sqlc has
    # no output-redirect flag, so the regenerate is in place and idempotent (a
    # no-drift run leaves the byte-identical tree).
    script: 'tmp=$(mktemp -d); trap ''rm -rf "$tmp"'' EXIT; cp -R internal/store/db "$tmp/db-committed"; sqlc generate; if ! git diff --no-index --quiet "$tmp/db-committed" internal/store/db; then echo "sqlc drift: internal/store/db is stale — run \`moon run compass-go:sqlc-gen\` and commit:"; git diff --no-index "$tmp/db-committed" internal/store/db; exit 1; fi'
    options:
      runFromWorkspaceRoot: false
    inputs: *sqlc_sources

  credential-keys-drift:
    # Fail if the checked-in credential denylist is stale vs the INSTALLED SDK
    # settings schema: snapshot the committed file, regenerate, and fail on any
    # byte diff. This exists because the generator's input
    # (packages/compass-agent/node_modules/@oh-my-pi/pi-coding-agent) is
    # gitignored, so an SDK bump moves the source of truth without touching any
    # tracked file — the in-repo change-detector test compares credentialKeys
    # against a hand-maintained want list, and BOTH sides stay unchanged at a
    # bump, so it cannot catch it. Renovate bumps the caret pin
    # (`^18.0.11`) unattended, and a missed regeneration means the store door
    # silently stops rejecting a newly credential-marked path. Modeled on
    # sqlc-drift above and in `ci` for the same reason: fully local, no DB, no
    # cross-project delegation. `git diff --no-index` compares raw files (reads
    # no index/worktree state, and git is always on PATH), so it behaves
    # identically in CI and in a secondary jj workspace. The generator writes in
    # place and is idempotent, so a no-drift run leaves the byte-identical file.
    #
    # Requires a completed `bun install` — the generator fails loudly, naming the
    # absolute schema path, when the dependency is not installed.
    script: 'tmp=$(mktemp -d); trap ''rm -rf "$tmp"'' EXIT; cp internal/store/credential_keys_gen.go "$tmp/credential_keys_gen.go"; go generate ./internal/store/...; if ! git diff --no-index --quiet "$tmp/credential_keys_gen.go" internal/store/credential_keys_gen.go; then echo "credential-keys drift: internal/store/credential_keys_gen.go is stale vs the installed SDK schema — run \`go generate ./...\` from go/internal/store and commit. A path APPEARING is an SDK bump to adopt; a path DISAPPEARING means the door stopped rejecting a credential it used to, and is a policy regression to investigate before accepting:"; git diff --no-index "$tmp/credential_keys_gen.go" internal/store/credential_keys_gen.go; exit 1; fi'
    options:
      runFromWorkspaceRoot: false
    inputs:
      - 'internal/store/gen_credential_keys.go'
      - 'internal/store/credential_keys_gen.go'
      - 'internal/store/agent_config.go'
      # The schema itself is gitignored and cannot be an input, so key on the
      # lockfile: the pinned SDK version is visible there, so a bump reschedules
      # this task.
      - '/bun.lock'

  sqlc-vet:
    # `sqlc vet` with the sqlc/db-prepare rule PREPAREs every generated query
    # against a live, schema-loaded Postgres — the strongest check sqlc offers
    # (operator/typecast validity, column existence, index-referenced-by-hint)
    # beyond what static analysis sees. It needs a real database, so unlike
    # sqlc-drift (pure-local, no DB, in `ci` deps) this task is NOT in the moon
    # `ci` battery: the moon job realizes no service (ci.yml:27-28). It is invoked
    # instead by the env-bearing `pgtest` CI job — which already runs the
    # postgres:16-alpine service and exports COMPASS_TEST_DATABASE_DSN — via
    # `moon run compass-go:sqlc-vet`, the same peel-into-a-service-job pattern as
    # pgtest/microvm/forge/gtk4. The task provisions its own throwaway DB:
    #   1. DSN-gated skip. On a dev box with no Postgres the task echoes a notice
    #      and exits 0 — the same posture as the pgtest suites' DSN-gated skip
    #      (COMPASS_TEST_DATABASE_DSN drives the real-Postgres lane; absent it,
    #      skip rather than red). Either COMPASS_TEST_DATABASE_DSN (the CI service
    #      DSN) or SQLC_DATABASE_URL satisfies the gate; the task derives its own
    #      per-run URL, so the pgtest job needs no extra env beyond the DSN it
    #      already exports.
    #   2. Throwaway DB. With a DSN present it creates a uniquely-named
    #      (sqlcvet_$$) database on that server, applies
    #      internal/store/migrations/*.sql in order via psql, points
    #      SQLC_DATABASE_URL at it, runs the vet, and drops the database on exit
    #      (trap, mirroring sqlc-drift's cleanup trap). The throwaway isolates
    #      db-prepare from whatever else shares the service DB and leaves no
    #      residue. `set -e` + psql ON_ERROR_STOP make any create/migrate/vet
    #      failure fail the task.
    # go/cmd/compass-postgres (the private-postgres wrapper) is deliberately NOT
    # reused: that is the stack supervisor's process-managed instance, whereas the
    # CI postgres service is simpler and already provisioned — vet only needs a
    # bare server to PREPARE against, not a managed lifecycle. psql is on PATH
    # from the devenv `postgresql` package.
    script: |
      set -e
      dsn="${COMPASS_TEST_DATABASE_DSN:-${SQLC_DATABASE_URL:-}}"
      if [ -z "$dsn" ]; then
        echo "sqlc-vet: no COMPASS_TEST_DATABASE_DSN/SQLC_DATABASE_URL — skipping db-prepare vet (dev box without the CI Postgres service)"
        exit 0
      fi
      db="sqlcvet_$$"
      trap 'psql "$dsn" -c "DROP DATABASE IF EXISTS $db" >/dev/null 2>&1 || true' EXIT
      psql "$dsn" -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE $db"
      vet_url=$(printf '%s' "$dsn" | sed -E "s#/[^/?]+(\?|\$)#/${db}\1#")
      for f in internal/store/migrations/*.sql; do
        psql "$vet_url" -v ON_ERROR_STOP=1 -q -f "$f"
      done
      SQLC_DATABASE_URL="$vet_url" sqlc vet
    options:
      runFromWorkspaceRoot: false
    inputs: *sqlc_sources

  ci:
    # module is affected: format, vet, lint (incl. exhaustiveness), -race test,
    # build, the supply-chain fence, and the two drift gates. `drift` is NOT a
    # dep here — it belongs to the schema pipeline (compass-proto) and is
    # scheduled through the gen tree, matching compass-proto/moon.yml's own
    # `ci` composition. `sqlc-drift` and `credential-keys-drift` ARE deps: both
    # are fully local (no cross-project delegation, no DB), so they belong in ci
    # directly. `sqlc-vet`
    # is deliberately NOT a dep: it needs a live Postgres, which the moon battery
    # has no business realizing (ci.yml has no service on the moon job); it is
    # invoked instead by the env-bearing `pgtest` CI job, the same way pgtest/
    # microvm/forge/gtk4 are peeled into their own service-carrying peer jobs.
    deps: ['fmt', 'vet', 'lint', 'nilaway', 'test', 'build', 'vuln', 'licenses', 'sqlc-drift', 'credential-keys-drift']
    options:
      cache: false
