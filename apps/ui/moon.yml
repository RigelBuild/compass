# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
# The Compass web UI (SolidJS + Vite). System tasks: bun/vite/biome from the
# devenv toolchain on PATH. It consumes the checked-in generated client
# (@compass/client -> compass.v1); compass-proto:drift gates its freshness.
workspace:
  inheritedTasks:
    exclude: ['test']

layer: 'application'
language: 'typescript'
tags: ['bun', 'oss', 'ci-group.bun']
dependsOn: ['compass-client']

tasks:
  dev:
    command: 'bunx vite'
    preset: 'server'
    deps: ['install']
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['src/**/*', 'tsconfig.json', '/tsconfig.base.json', 'package.json', 'vite.config.ts', '/bun.lock', '/packages/compass-client/src/**/*', '/packages/compass-client/package.json']
  build:
    command: 'bunx vite build'
    deps: ['install']
    inputs: ['src/**/*', 'index.html', 'tsconfig.json', '/tsconfig.base.json', 'package.json', 'vite.config.ts', '/bun.lock', '/packages/compass-client/src/**/*', '/packages/compass-client/package.json']
    outputs: ['dist']
  test:
    # `--conditions browser` resolves solid-js to its client build (dist/solid.js),
    # matching what vite bundles for the app. Bun's default `node` condition pulls
    # the SSR build (dist/server.js), where createMemo is inert (computes once, no
    # tracking) — so store memos would falsely read stale. The UI is browser-only.
    #
    # No `--pass-with-no-tests`: bun exits 1 when a run matches no test file, and
    # that is the behaviour this task wants. With the flag, a `src/**` restructure
    # or a rename that stops matching reports success having run nothing — and the
    # output carries no `pass` line at all, so a count check reads absent rather
    # than zero. Green-on-543 and green-on-0 become the same result. Nothing here
    # needs the flag: this project has test files, and its two sibling bun
    # projects run a bare `bun test`.
    # Scoped to `src/` so bun's test runner globs only the unit suites there
    # (all 33 live under src/) and never the Playwright e2e harness at
    # e2e/visual-smoke.spec.ts — bun matches `*.spec.ts` by default, and loading
    # a @playwright/test spec under `bun test` throws "test.describe() … not
    # expected here". The e2e harness runs via the `test:visual` script
    # (playwright test), never here.
    command: 'bun test --conditions browser src/'
    deps: ['install']
    # `bun test` includes the previewable-build gate (src/preview-build.test.ts),
    # which runs a real `vite build` — so its result depends on index.html and
    # vite.config.ts too, matching the `build`/`typecheck` inputs. Without these a
    # vite.config-only change would leave `test` unaffected and serve the gate a
    # cached-green, precisely on the config change the gate exists to catch.
    inputs: ['src/**/*', 'index.html', 'tsconfig.json', '/tsconfig.base.json', 'package.json', 'vite.config.ts', '/bun.lock', '/packages/compass-client/src/**/*', '/packages/compass-client/package.json']
  stylelint:
    # D7 guard (RIG-2034 T6): bans raw hex, --rigel-* refs, literal
    # durations/easings, and the retired legacy var vocabulary outside
    # design/tokens.css. Error severity is stylelint's default — any violation
    # exits non-zero and fails this task (and, via ci deps, the CI gate).
    command: 'bunx stylelint "src/**/*.css"'
    deps: ['install']
    inputs: ['src/**/*.css', '.stylelintrc.cjs', 'package.json', '/bun.lock']
  dev-smoke:
    # The dev-boot smoke gate: boots the real fixture-mode dev server and reads
    # the SERVED module graph (see e2e/dev-boot.spec.ts) — the one thing no
    # build/unit task does, since they exercise the production build path where
    # this defect class cannot appear. The two settings below are both
    # mandatory and do different jobs:
    #  - explicit `inputs` drive PR-path affected-detection. A project task with
    #    no `inputs` key defaults to project-relative `**/*`, which EXCLUDES the
    #    workspace-root `/bun.lock` — so a lockfile-only dependency-bump PR (the
    #    shape most likely to rot vite.config.ts's optimizeDeps pins, and with it
    #    dev boot) would be missed. This is `build`'s list plus this spec and the
    #    Playwright config, the two files whose edits must re-schedule the gate.
    #  - `cache: false` forces a real run whenever the task is scheduled: the
    #    subject is the served module graph resolved out of node_modules at run
    #    time, not a moon-hashable input, so a cached green would survive exactly
    #    the rot this gate exists to red on. Precedent: `ci` itself (below).
    command: 'bunx playwright test e2e/dev-boot.spec.ts'
    deps: ['install']
    inputs: ['src/**/*', 'index.html', 'tsconfig.json', '/tsconfig.base.json', 'package.json', 'vite.config.ts', 'e2e/dev-boot.spec.ts', 'playwright.config.ts', '/bun.lock', '/packages/compass-client/src/**/*', '/packages/compass-client/package.json']
    options:
      cache: false
  ci:
    deps: ['typecheck', 'build', 'test', 'stylelint', 'dev-smoke']
    options:
      cache: false
