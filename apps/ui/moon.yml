# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
# The Compass web UI (SolidJS + Vite). System tasks: bun/vite/biome from the
# devenv/proto toolchain on PATH. It consumes the checked-in generated client
# (@compass/client -> compass.v1); compass-proto:drift gates its freshness.
layer: 'application'
language: 'typescript'
tags: ['bun', 'oss']
dependsOn: ['compass-client']

tasks:
  dev:
    command: 'bunx vite'
    preset: 'server'
    deps: ['install']
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['src/**/*', 'tsconfig.json', 'package.json', 'vite.config.ts', '/bun.lock', '/packages/compass-client/src/**/*', '/packages/compass-client/package.json']
  build:
    command: 'bunx vite build'
    deps: ['install']
    inputs: ['src/**/*', 'index.html', 'tsconfig.json', 'package.json', 'vite.config.ts', '/bun.lock', '/packages/compass-client/src/**/*', '/packages/compass-client/package.json']
    outputs: ['dist']
  test:
    # `--conditions browser` resolves solid-js to its client build (dist/solid.js),
    # matching what vite bundles for the app. Bun's default `node` condition pulls
    # the SSR build (dist/server.js), where createMemo is inert (computes once, no
    # tracking) — so store memos would falsely read stale. The UI is browser-only.
    command: 'bun test --conditions browser --pass-with-no-tests'
    deps: ['install']
    inputs: ['src/**/*', 'tsconfig.json', 'package.json', '/bun.lock', '/packages/compass-client/src/**/*', '/packages/compass-client/package.json']
  ci:
    deps: ['typecheck', 'build', 'test']
    options:
      cache: false
