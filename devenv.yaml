# devenv inputs. Rolling nixpkgs is devenv's recommended channel for dev
# shells (newer than a release channel, curated for devenv). The toolchain is
# nixpkgs derivations (buf, the codegen plugins, the Go gate battery, the
# linters) plus the language runtimes — bun/node/moon vendored as nix
# derivations from tools/toolchain/versions/*.nix and go from the go-overlay
# input below. It also carries the RigelBuild/nix2container fork's patched
# skopeo, so the agent-image publish lane resolves `skopeo` from this shell.
# There is no container image built here and no secrets provider to source.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # go-overlay builds the exact go pin (tools/toolchain/versions/go.nix) for the
  # dev shell. The single Go-toolchain source, selected by version in devenv.nix
  # and — via the same input at this pinned rev — by the parity gate
  # (tools/toolchain/gate-tools.nix), so both resolve the identical derivation.
  go-overlay:
    url: github:purpleclay/go-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  # The RigelBuild/nix2container fork's patched skopeo (skopeo-nix2container),
  # installed into this dev shell so the agent-image publish lane invokes a
  # plain `skopeo` that understands the `nix:` transport (reads a nix2container
  # image spec directly). Pinned by rev in devenv.lock — one source of truth for
  # the rev — and the same shared canonical fork the agent image's own devenv
  # builds through. Its nixpkgs follows this shell's, so the closure has one
  # nixpkgs.
  nix2container:
    url: github:RigelBuild/nix2container
    inputs:
      nixpkgs:
        follows: nixpkgs
  # hk — jj/git hook runner (jdx/hk), the pre-push gate driver. `enterShell`
  # calls `hk install` to wire the git hooks; the binary itself comes from this
  # input (pinned v1.48.0, matching the personal flake's hk pin) rather than a
  # box-level install, so this shell owns its own hk and can't drift from the
  # `hk.pkl` schema at the repo root. Its nixpkgs follows this shell's.
  hk:
    url: github:jdx/hk/v1.48.0
    inputs:
      nixpkgs:
        follows: nixpkgs
  # The shared canonical RigelBuild/devenv fork, pinned by rev in devenv.lock.
  # Root previously resolved `devenv` implicitly from the installed CLI's bundled
  # modules (upstream cachix/devenv); this makes the source explicit and unifies
  # it with the agent-image module set (agent-image/devenv.yaml:45-49), which
  # already pins this fork. The fork keeps upstream's values as DEFAULTS, so a
  # consumer setting none of the fork's added options — as this root shell does —
  # resolves a byte-identical dev environment; the fork is a strict superset.
  # renovate.yml's devenv-CLI-on-PATH step reads this lock's devenv node with no
  # edit, so the CLI that writes root relocks tracks whatever source this names.
  devenv:
    url: github:RigelBuild/devenv
    inputs:
      nixpkgs:
        follows: nixpkgs
  # secretspec-nixpkgs: a SECOND nixpkgs, pinned by rev in devenv.lock, solely
  # for the `secretspec` CLI the Go secrets write path spawns by name. The
  # `age://` provider it needs to write encrypted-at-rest secrets only exists
  # from 0.15 on (it is a default-on cargo feature), and the rolling channel
  # this shell's own nixpkgs is locked to still resolves 0.14.0 — a build with
  # no `age` backend compiled in at all, which fails a write with `Provider
  # backend 'age' not found` rather than degrading. This input tracks the
  # channel that carries a version matching the Go SDK pin (go/go.mod's
  # secretspec module), so the read path (SDK) and the write path (CLI) move
  # together instead of skewing across an independent seam. It deliberately
  # does NOT `follows: nixpkgs` — following would defeat the entire purpose by
  # collapsing it back onto the rev that lacks the provider. Consumed as a
  # dotted attr in devenv.nix, OUTSIDE the parsed `with pkgs` packages literal,
  # because the toolchain-parity gate resolves every bare attr in that literal
  # (the same reason skopeo-nix2container sits outside it).
  secretspec-nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
