# squawk — Postgres migration-safety linter for go/internal/store/migrations/.
# Gate config for tools/sql-migration-gate/moon.yml.
#
# WHY THESE EXCLUSIONS: every migration runs inside one transaction under the
# runner's advisory lock (see the migration runner). squawk's default rule set
# is calibrated for a large LIVE table, where a full-table rewrite or a
# non-CONCURRENT index build stalls traffic for its duration. Most migrations
# here create empty tables; the ones that touch populated tables (e.g.
# channel_groups) touch small ones, where the lock is brief. Revisit this list
# when a migration first alters or indexes a large populated table. The gate
# stays RED on genuinely unsafe NEW DDL (e.g. adding a NOT NULL column with no
# default), which these exclusions do not silence.

pg_version = "16.0"

# The runner applies each migration inside one transaction (Begin / Exec(sql) /
# Commit — go/internal/store/store.go:230-245), so lint statements with in-txn
# semantics to match reality. Caveat: squawk cannot flag a runtime-fatal
# CREATE INDEX CONCURRENTLY inside a txn from this flag (it only fires on an
# explicit BEGIN;) — that failure is instead caught at apply time by the
# runner's own transaction wrapper.
assume_in_transaction = true

excluded_rules = [
  # A non-CONCURRENT index blocks writes while it builds. Indexes here land on
  # new empty tables or on small populated ones, so the block is brief; and
  # CONCURRENTLY is illegal inside the runner's transaction anyway.
  "require-concurrent-index-creation",
  # lock_timeout / statement_timeout guard a slow blocking op against stalling
  # live traffic. Ours are short ops on empty or small tables; a migration that
  # can queue behind long transactions sets its own lock_timeout.
  "require-timeout-settings",
  # IF NOT EXISTS makes a migration re-runnable after a partial failure. This
  # migration is transactional (all-or-nothing) and version-gated by the runner,
  # so a partial-apply re-run cannot happen; bare CREATE keeps the schema DDL
  # readable.
  "prefer-robust-stmts",
  # SMALLINT/INT width choices here are deliberate domain modeling (small enum
  # roles, bounded counters), not oversights risking an int overflow on an
  # ever-growing id column.
  "prefer-bigint-over-smallint",
  "prefer-bigint-over-int",
  # PKs here are TEXT application-generated ids by design, not integer sequences,
  # so the GENERATED-ALWAYS-AS-IDENTITY-over-serial advice does not apply.
  "prefer-identity",
]
