[package]
name = "compass-proto"
version.workspace = true
edition.workspace = true
# Permissive carve-out from the workspace AGPL default so third-party UIs, the
# native (GPUI) client, and enterprise builds can link the wire protocol
# without taking AGPL (the libgit2/libpq pattern: protocol permissive,
# implementation copyleft).
license = "MIT OR Apache-2.0"
description = "The compass.v1 contract — generated gRPC clients/server stubs + local transport. The sole, owned door to the Compass daemon."

[lib]
name = "compass_proto"
path = "src/lib.rs"

[dependencies]
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
