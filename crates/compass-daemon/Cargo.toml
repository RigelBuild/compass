[package]
name = "compass-daemon"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
description = "The Compass daemon: the long-lived backend that owns privileged operations and serves the compass.v1 contract over a local transport."
# Application binary, not a published library.
publish = false

[[bin]]
name = "compassd"
path = "src/main.rs"

[dependencies]
compass-proto.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
