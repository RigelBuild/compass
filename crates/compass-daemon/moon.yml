# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
# The Compass daemon binary. System tasks via cargo on PATH; clippy gates the
# scaffold (tests arrive with the transport server).
layer: 'application'
language: 'rust'
dependsOn: ['compass-proto']

tasks:
  clippy:
    command: 'cargo clippy -p compass-daemon --all-targets -- -D warnings'
    deps: ['compass-proto:gen']
    inputs: ['src/**/*', 'Cargo.toml', '/Cargo.lock']
    options:
      cache: false
  ci:
    deps: ['clippy']
    options:
      cache: false
