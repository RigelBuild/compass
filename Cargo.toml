[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Implementation crates are AGPL-3.0-only; the compass-proto contract crate
# carves out permissive (MIT OR Apache-2.0) in its own manifest.
license = "AGPL-3.0-only"

[workspace.dependencies]
# gRPC (tonic 0.14 split: runtime `tonic` + `tonic-prost` codec; `prost`
# messages). Matches the protoc-gen-tonic output (tonic_prost::ProstCodec).
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
# Direct deps for the Unix-domain-socket connector (added with the daemon
# transport in SEA-1025): tower's service_fn adapter + hyper-util's TokioIo.
tower = "0.5"
hyper-util = "0.1"

# Async runtime.
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"

# Utilities.
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Workspace crates.
compass-proto = { path = "crates/compass-proto", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
