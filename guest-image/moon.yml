# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# The microVM guest image: kernel, erofs rootfs, and initrd. The rootfs userland
# is the compass-agent OCI image pinned in agent-oci.lock, plus a boot layer.
# A moon project so a stale lock or broken layer assembly fails on the PR that
# caused it, not post-merge in the publish lane.
layer: 'application'
language: 'nix'
tags: ['ci-group.nix']

workspace:
  inheritedTasks:
    # Not a bun package, so the tag-bun `install` must never run here; `lint`
    # and `format` are whole-repo tasks on the root project, never inherited.
    # Mirrors the sibling nix projects agent-image/moon.yml:26-31 and
    # app-bundle/moon.yml:16-20.
    exclude: ['install', 'lint', 'format']

tasks:
  build:
    # A bare nix file, not a flake, so attrs are named on the command line. Its
    # substituters are set in ci.yml's install-nix-action config. cache:false:
    # nix caches store paths, so moon must not false-green a skipped build.
    command: 'nix build -f default.nix compass-guest-kernel compass-guest-rootfs compass-guest-initrd --no-link --print-out-paths'
    options:
      cache: false
      runInCI: true
    # The agent userland comes from the pinned OCI image, so the agent-side
    # input is `agent-oci.lock` alone, covered by `**/*` below; the rest is the
    # boot layer's closure. A glob that misses one silently skips a build that
    # should have run. A leading `/` is workspace-root-relative.
    inputs:
      - '**/*'
      # The microVM boot leg (ci.yml `microvm` job) realizes this VMM-env
      # (cloud-hypervisor/virtiofsd/passt) to boot the guest image this project
      # builds. Tracking it here keeps the moon graph — not a hand-kept path
      # list — the source of the leg's true build closure, so a change to only
      # the VMM-env still marks this project affected and the boot test runs.
      - '/tools/toolchain/microvm-vmm-env.nix'
      # guestd is the rootfs /sbin/init, so the backend module is a build
      # input: a guestd or go.mod/go.sum change must reschedule this build. The
      # module manifests are called out explicitly (a vendorHash move forces a
      # rebuild) alongside the guestd command + its internal package tree.
      - '/go/go.mod'
      - '/go/go.sum'
      - '/go/cmd/compass-guestd/**'
      - '/go/internal/guestd/**'
      - '/go/internal/gen/**'
      - '/devenv.lock'
      - '/devenv.yaml'

  test:
    # The layer-assembly fixtures: synthetic layers built in the sandbox, so no
    # registry fetch and seconds rather than a full rootfs build.
    command: 'nix build -f default.nix compass-guest-assembly-tests --no-link'
    options:
      cache: false
      runInCI: true
    inputs:
      - 'assemble-layers.sh'
      - 'assembly-tests.nix'
      - 'default.nix'
      - '/devenv.lock'

  ci:
    deps: ['build', 'test']
    options:
      cache: false
      runInCI: true
