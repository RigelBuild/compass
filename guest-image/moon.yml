# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# compass-guest-image (guest-image/): the microVM guest image — a
# direct-boot kernel and a root filesystem contents closure the V2a
# cloud-hypervisor runtime consumes. A standalone nix build, not a bun package,
# the same standalone-not-a-moon-project posture agent-image/ established, plus a
# thin moon project so the build rides the gate.
#
# WHY THIS IS A MOON PROJECT. Registering it in .moon/workspace.yml is what puts
# the guest-image build in the affected-gated pre-merge gate: on a PR
# `moon ci :ci` runs this project's `ci` only when the PR affects the rootfs
# closure (the `inputs` below), and every push to main runs it unconditionally
# (ci.yml's affected-PR / full-main split). Without it a guest-image break — a
# toolchain-closure drift, a broken rootfs assembly — would surface only
# post-merge (in E4's cache-population lane or V2a's boot bring-up), not on the
# PR that caused it. The same pre-merge-build-gate move agent-image/ made
# (agent-image/moon.yml:10-20). The kernel is substituted free from
# cache.nixos.org (never built); the rootfs is the closure this gate proves
# realises.
layer: 'application'
language: 'nix'

workspace:
  inheritedTasks:
    # Not a bun package, so the tag-bun `install` must never run here; `lint`
    # and `format` are whole-repo tasks on the root project, never inherited.
    # Mirrors the sibling nix projects agent-image/moon.yml:26-31 and
    # app-bundle/moon.yml:16-20.
    exclude: ['install', 'lint', 'format']

tasks:
  build:
    # Realise both guest-image attrs. cloud-hypervisor direct-boots the kernel
    # (substituted free from cache.nixos.org), and the rootfs is the contents
    # closure V2a packs into its chosen image format. A plain `nix build -f` of
    # the standalone default.nix (the same shape app-bundle/build.sh uses,
    # app-bundle/build.sh:30-35) — this is a bare nix file, not a flake, so
    # there is no `#attr` flake-ref form. Runs from guest-image/ (moon's default
    # project-dir cwd). The substituters the build fetches from are named in
    # ci.yml's install-nix-action config, the reviewed trust surface for this
    # gate.
    #
    # cache:false — nix owns its store-path caching; moon must not false-green a
    # build it did not re-run (the same posture agent-image/moon.yml:46-48 and
    # app-bundle/moon.yml:33-35 take).
    command: 'nix build -f default.nix compass-guest-kernel compass-guest-rootfs compass-guest-initrd --no-link --print-out-paths'
    options:
      cache: false
      runInCI: true
    # The rootfs build closure. The rootfs imports agent-image/toolchain.nix +
    # entrypoint.nix (fed ROOT's pkgs), which resolve the vendored bun through
    # tools/toolchain/toolchain-tools.nix + versions/**, bundle the compass-agent
    # (packages/compass-agent/** + package.json + bun.lock), and pin the whole
    # closure to the root devenv.lock — so each of those is a first-class input:
    # a change to any reschedules this build under per-PR affected detection. A
    # glob that misses one silently skips a build that should have run and leaves
    # the E4 cache stale (the same closure-approximation risk the record calls
    # out, § E3). A leading `/` is workspace-root-relative (the convention
    # agent-image/moon.yml:58-63 uses); the bare glob is this project's own tree.
    inputs:
      - '**/*'
      - '/agent-image/toolchain.nix'
      - '/agent-image/entrypoint.nix'
      - '/tools/toolchain/toolchain-tools.nix'
      - '/tools/toolchain/versions/**'
      # The microVM boot leg (ci.yml `microvm` job) realizes this VMM-env
      # (cloud-hypervisor/virtiofsd/passt) to boot the guest image this project
      # builds. Tracking it here keeps the moon graph — not a hand-kept path
      # list — the source of the leg's true build closure, so a change to only
      # the VMM-env still marks this project affected and the boot test runs.
      - '/tools/toolchain/microvm-vmm-env.nix'
      - '/packages/compass-agent/**'
      # T1 packages the T2 guestd binary (buildGoModule of go/cmd/compass-guestd)
      # as the rootfs /sbin/init, so the backend module is now a build input: a
      # guestd or go.mod/go.sum change must reschedule this build. The module
      # manifests are called out explicitly (a vendorHash move forces a rebuild)
      # alongside the guestd command + its internal package tree.
      - '/go/go.mod'
      - '/go/go.sum'
      - '/go/cmd/compass-guestd/**'
      - '/go/internal/guestd/**'
      - '/go/internal/gen/**'
      - '/package.json'
      - '/bun.lock'
      - '/devenv.lock'
      - '/devenv.yaml'

  ci:
    deps: ['build']
    options:
      cache: false
      runInCI: true
