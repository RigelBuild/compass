# cargo-deny: the license + supply-chain fence for the Rust workspace.
#
# Compass is AGPL-3.0-only, with the compass-proto contract crate carved out
# permissive (MIT OR Apache-2.0) so third-party UIs / native clients can link
# the wire protocol without taking AGPL (the libgit2/libpq pattern). Both are
# in the allow list below alongside the common permissive deps.

[graph]
all-features = true

[licenses]
# SPDX ids for third-party deps: permissive only. Our own AGPL implementation
# crates are granted per-crate via `exceptions` below, so a copyleft *dependency*
# stays blocked — protecting the permissive compass-proto carve-out.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
# Our own crates may be AGPL; third-party AGPL deps are not. Add each new
# first-party AGPL crate here by name.
exceptions = [{ name = "compass-daemon", allow = ["AGPL-3.0-only"] }]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace crates are pulled by `path` (no registry version), which
# cargo-deny otherwise flags as a wildcard. This exempts those, not real `*`s.
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
