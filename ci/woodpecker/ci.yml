# The compass CI pipeline: run the full moon CI graph inside the compass-ci
# image, so a remote run is byte-identical to a local `moon run :ci`.
#
# This is the static bootstrap pipeline. The per-task affected fan-out (one
# Woodpecker workflow per affected moon task, each body `moon run <proj>:<task>`)
# is produced by the shared pipeline generator once compass is wired into the
# Woodpecker control plane; see the CI-activation tracking issue.
#
# Routes to a Linux agent via the `type: linux` runner label.
labels:
  type: linux
when:
  - event: [push, pull_request]
steps:
  - name: ci
    image: ghcr.io/sealedsecurity/compass-ci:latest
    commands:
      # The bun workspace deps (biome, tsc, vite, protoc-gen-es) install at job
      # time, not in the image; put their bin dir on PATH so buf resolves the
      # protoc-gen-es plugin during codegen.
      - bun install --frozen-lockfile
      - export PATH="$PWD/node_modules/.bin:$PATH"
      - moon run :ci
