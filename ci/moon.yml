# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Repo-wide CI gates that span the whole workspace rather than one package:
# workspace rustfmt, the cargo-deny license/supply-chain fence, and biome across
# all JS/TS/JSON. (This project also houses the Woodpecker pipeline + CI image.)
layer: 'tool'
language: 'bash'

tasks:
  fmt:
    command: 'cargo fmt --check'
    options:
      runFromWorkspaceRoot: true
    inputs:
      - '/crates/**/*.rs'
      - '/rustfmt.toml'
  deny:
    command: 'cargo deny check'
    options:
      runFromWorkspaceRoot: true
    inputs:
      - '/deny.toml'
      - '/Cargo.toml'
      - '/crates/*/Cargo.toml'
      - '/Cargo.lock'
  biome:
    command: 'bunx biome check .'
    options:
      runFromWorkspaceRoot: true
    inputs:
      - '/**/*.ts'
      - '/**/*.tsx'
      - '/**/*.js'
      - '/**/*.jsx'
      - '/**/*.mjs'
      - '/**/*.cjs'
      - '/**/*.json'
      - '/biome.json'
  nixfmt:
    command: 'nixfmt --check devenv.nix ci/ci-toolchain.nix'
    options:
      runFromWorkspaceRoot: true
    inputs:
      - '/**/*.nix'
  shellcheck:
    command: 'shellcheck --external-sources ci/publish-ci-image.sh'
    options:
      runFromWorkspaceRoot: true
    inputs:
      - '/**/*.sh'
  shfmt:
    command: 'shfmt -d -i 0 -s ci/publish-ci-image.sh'
    options:
      runFromWorkspaceRoot: true
    inputs:
      - '/**/*.sh'
  taplo:
    command: 'taplo fmt --check'
    env:
      RUST_LOG: 'error'
    options:
      runFromWorkspaceRoot: true
    inputs:
      - '/**/*.toml'
  actionlint:
    # Compass has no GitHub Actions yet (CI is Woodpecker); actionlint errors
    # when no workflows exist, so run it only once they do. Wired now so it
    # gates any future .github/workflows/ automatically.
    script: 'if ls .github/workflows/*.yml >/dev/null 2>&1 || ls .github/workflows/*.yaml >/dev/null 2>&1; then actionlint; fi'
    options:
      runFromWorkspaceRoot: true
    inputs:
      - '/.github/workflows/*.yml'
      - '/.github/workflows/*.yaml'
  ci:
    deps:
      - 'fmt'
      - 'deny'
      - 'biome'
      - 'nixfmt'
      - 'shellcheck'
      - 'shfmt'
      - 'taplo'
      - 'actionlint'
    options:
      cache: false
