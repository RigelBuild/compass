# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
# The compass.v1 contract schema. It owns the schema (compass/v1/*.proto) and
# the single buf codegen pipeline - one schema, per-language clients fanned out
# and checked in: connect-es TS in compass-client and protoc-gen-go/connect-go
# Go in the go module, both drift-gated. buf and all its plugins (protoc-gen-es,
# protoc-gen-go, protoc-gen-connect-go) come from the devenv toolchain on PATH,
# resolved from immutable nix store paths, so codegen depends on no
# package-install state.
#
# Language-neutral (no crate, no language toolchain of its own): tagged `oss`
# for the import boundary. The Rust backend that once co-owned this schema was
# deleted at the Go cutover (docs/designs/platform/go-toolchain-default.md); the
# schema outlives it as the sole source of truth the Go and TS clients generate
# from.
layer: 'library'
language: 'bash'
tags: ['oss', 'ci-group.go']

workspace:
  inheritedTasks:
    # Not a bun package: skip the global install + biome lint/format that
    # tag-bun.yml applies to every project (it has no inheritedBy scope).
    exclude: ['install', 'lint', 'format']

tasks:
  lint:
    command: 'buf lint .'
    options:
      runFromWorkspaceRoot: true
    inputs:
      - 'compass/**/*.proto'
      - '/buf.yaml'
  gen:
    # In-place regen for developers after a schema edit (outputs declared so
    # moon caches on the proto). THREE lanes: the public lane (buf.gen.yaml —
    # protoc-gen-es → compass-client, protoc-gen-go/connect-go → go/gen, with the
    # internal protos excluded), plus two internal-only lanes for the surfaces
    # spoken only between our binaries (buf.gen.agent-ts.yaml → the agent's
    # packages/compass-agent/src/gen, and buf.gen.internal-go.yaml → go/internal/gen
    # for BOTH agent.proto and runner.proto — one lane because they share that
    # output tree and buf's clean:true wipes it per invocation). Every plugin
    # comes from the same place as buf itself: protoc-gen-es and protoc-gen-go/
    # protoc-gen-connect-go are all on the devenv PATH, resolved from immutable
    # store paths. Codegen therefore depends on no package-install state, and no
    # concurrent writer can tear a plugin mid-exec. The task runs from the
    # workspace root, which is the compass root, so the templates' relative outs
    # land in-tree.
    # The TS internal lane needs --include-imports
    # (protoc-gen-es has no import-path mapping, so it regenerates the imported
    # payload types byte-identically); the Go internal lane must NOT (its M-mappings
    # redirect the imported types to the public go/gen package instead of
    # regenerating them). The checked-in clients are what consumers compile; drift
    # guarantees freshness.
    script: 'command -v protoc-gen-es >/dev/null 2>&1 || { echo "protoc-gen-es is not on PATH: enter the devenv shell (direnv allow), or your devenv predates the baked plugin. Building without nix? It is not a bun devDep - install it yourself at the version devenv.nix bakes (see README Quickstart)"; exit 1; }; buf generate && buf generate --template buf.gen.agent-ts.yaml --include-imports && buf generate --template buf.gen.internal-go.yaml'
    options:
      runFromWorkspaceRoot: true
    inputs:
      - 'compass/**/*.proto'
      - '/buf.yaml'
      - '/buf.gen.yaml'
      - '/buf.gen.agent-ts.yaml'
      - '/buf.gen.internal-go.yaml'
      - '/devenv.lock'
    outputs:
      - '/packages/compass-client/src/gen'
      - '/go/gen'
      - '/packages/compass-agent/src/gen'
      - '/go/internal/gen'
  drift:
    # Regenerate every lane into a throwaway dir and compare against the checked-in
    # trees — fails if the schema changed without committing the regenerated output.
    # FOUR trees: the two public (compass-client/src/gen, go/gen) plus the two
    # internal-only (packages/compass-agent/src/gen, go/internal/gen). Each lane
    # regenerates with the SAME flags as `gen` (the TS internal lane keeps
    # --include-imports; the Go internal lane omits it), just redirected under $tmp
    # via -o. go/internal/gen holds BOTH agent.proto and runner.proto from the one
    # buf.gen.internal-go.yaml invocation, so a single `git diff --no-index` on that
    # tree covers both. A brand-new internal OUTPUT TREE (not a new proto in an
    # existing tree) would add one more `buf generate -o` + one more `git diff
    # --no-index … || rc=1` pair here + its own inputs glob below. `git diff
    # --no-index` compares raw file trees (reads no index/worktree state, and git is
    # always on PATH — unlike `diff`), so it runs identically in CI and in a
    # secondary jj workspace.
    #
    # The preflight matches gen's: both tasks invoke the plugin, and a shell
    # without the baked plugin makes buf report `exec: executable file not
    # found`, which reads as a codegen fault rather than a missing tool. The
    # check is a no-op whenever the plugin is present.
    script: 'command -v protoc-gen-es >/dev/null 2>&1 || { echo "protoc-gen-es is not on PATH: enter the devenv shell (direnv allow), or your devenv predates the baked plugin. Building without nix? It is not a bun devDep - install it yourself at the version devenv.nix bakes (see README Quickstart)"; exit 1; }; tmp=$(mktemp -d) && if ! buf generate -o "$tmp" || ! buf generate --template buf.gen.agent-ts.yaml --include-imports -o "$tmp" || ! buf generate --template buf.gen.internal-go.yaml -o "$tmp"; then rm -rf "$tmp"; exit 1; fi; rc=0; git diff --no-index "$tmp/packages/compass-client/src/gen" packages/compass-client/src/gen || rc=1; git diff --no-index "$tmp/go/gen" go/gen || rc=1; git diff --no-index "$tmp/packages/compass-agent/src/gen" packages/compass-agent/src/gen || rc=1; git diff --no-index "$tmp/go/internal/gen" go/internal/gen || rc=1; rm -rf "$tmp"; exit $rc'
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - 'compass/**/*.proto'
      - '/buf.yaml'
      - '/buf.gen.yaml'
      - '/buf.gen.agent-ts.yaml'
      - '/buf.gen.internal-go.yaml'
      - '/packages/compass-client/src/gen/**/*'
      - '/go/gen/**/*'
      - '/packages/compass-agent/src/gen/**/*'
      - '/go/internal/gen/**/*'
      - '/devenv.lock'
  gen-fence:
    # SEA-1267 enforcement, and distinct from drift: drift only catches a schema
    # edit that wasn't regenerated. It CANNOT catch a forgotten `exclude_paths`
    # entry — once an internal symbol leaks into a public tree and is committed,
    # regen reproduces it and drift passes green. This check is the real fence:
    # assert no internal-only symbol appears in either PUBLIC gen tree
    # (compass-client/src/gen, go/gen). The internal envelopes live only in the
    # internal trees (packages/compass-agent/src/gen, go/internal/gen). Extend the
    # symbol list as internal messages are added. Current internal surfaces:
    # agent.proto (AgentFrame/AgentControl/SessionFrame + the AgentControl
    # payload messages + the ReplayCompleteAck/ControlAck AgentFrame ack
    # variants + the SEA-1570 TranscriptEntry frame payload) + runner.proto
    # (RunnerService/RunnerError + the SEA-1570 ResumeBody carrier + the SEA-1568
    # FetchAgentConfig* RPC messages and the ConfigVersion signal) +
    # agent_gateway.proto
    # (AgentGateway + the CommsCall* envelopes it defines: CommsCallRequest/
    # CommsCallResult/CommsCallError; the LifecycleCall* / SpawnPeer* /
    # DespawnPeer* envelopes it defines for the spawn/despawn family; plus the C1
    # wire messages PublishFrame*/PostConversationFrame*/ControlSubscribe*).
    # RelayLifecycleCall* (like RelayCommsCall*) is a runner.proto internal
    # envelope. `compassv1internal`
    # catches any Go-package leak regardless of message name.
    # forge.proto (SEA-1731 A1): the ForgeCall* carrier family + RelayForgeCall*
    # (the ForgeCallRequest/Result/Error envelopes, agent_gateway.proto, and the
    # runner.proto relay pair), the seven forge op requests + ListIssuesResponse +
    # Subscribe/UnsubscribeForge*, and the forge.proto leaf itself
    # (ForgeNotification*/ForgeArtifactKind/CommentRef). NOT fenced: the canonical
    # compass.proto symbols the result arms retype to — Issue, PullRequest,
    # ChecksSummary, Check, AgentAttribution, ForgeRef — are PUBLIC and MUST
    # generate into the public trees, so no forge pattern prefixes them (ForgeCall/
    # ForgeNotification share only the "Forge" stem with the public ForgeRef/
    # ForgeProvider, no full-pattern match).
    # agent_gateway.proto + runner.proto (compass-agent-primary-lifecycle T2):
    # the BoardCall* carrier family + RelayBoardCall* (the BoardCallRequest/
    # Result/Error envelopes in agent_gateway.proto and the runner.proto relay
    # pair) plus the SetIssueState* op request/response. All internal-only,
    # generated only into the internal lanes. NOT fenced: the canonical
    # compass.proto symbols SetIssueStateRequest/Response reference — Issue,
    # IssueState — are PUBLIC (no Board/RelayBoard/SetIssueState pattern prefixes
    # them; Issue/IssueState do not start with "SetIssueState").
    # guest_control.proto (RIG-2588 T3): GuestControl + Health* — the host<->guest
    # microVM control plane, generated only into the internal Go lane. GuestControl
    # (matching GuestControlService/Handler/Client) is the distinctive family stem;
    # Health* is deliberately NOT anchored here (too generic to fence on).
    #
    # Each of the whole-type symbols is word-bounded (\b…\b) so the fence matches
    # a WHOLE internal identifier, never a substring of a larger public one. This
    # is load-bearing for the public AgentSessionFrame (compass.proto, a frozen
    # contract): it contains "SessionFrame" as a substring, so an unanchored
    # grep false-fires the moment it generates into a public tree
    # (SEA-1267/OQ-2.4). Word boundaries also future-proof the others (a public
    # "AgentControlFoo" would not trip "AgentControl"). AgentGateway and CommsCall
    # stay UNANCHORED (prefix-matched) on purpose: the generated identifiers are
    # families — AgentGatewayService and CommsCallRequest/CommsCallResult/
    # CommsCallError — so anchoring their tails would match none of the real
    # symbols. Internal symbols only ever leak as whole identifiers (a generated
    # type name or a `compassv1internal.` package ref), never as a substring, so
    # this mix still catches every real leak.
    script: 'if grep -rlE "\bAgentFrame\b|\bAgentControl\b|\bSessionFrame\b|\bReplayCompleteAck\b|\bControlAck\b|\bDeliveryAck\b|\bTranscriptEntry\b|\bPromptControl\b|\bReplayComplete\b|\bSteerControl\b|\bDeliverControl\b|\bDispatchControl\b|\bResumeBody\b|\bTranscriptReplay\b|\bConfigControl\b|\bConfigVersion\b|\bRunnerService\b|\bRunnerError\b|GuestControl|AgentGateway|CommsCall|LifecycleCall|SpawnPeer|DespawnPeer|RelayLifecycleCall|FetchAgentConfig|PublishFrame|PostConversationFrame|ControlSubscribe|BoardCall|SetIssueState|ForgeCall|ForgeNotification|\bForgeArtifactKind\b|SubscribeForge|UnsubscribeForge|\bCommentRef\b|\bCreateIssueRequest\b|\bCommentOnIssueRequest\b|\bGetIssueRequest\b|\bListIssuesRequest\b|\bListIssuesResponse\b|\bCreatePullRequestRequest\b|\bCommentOnPullRequestRequest\b|\bGetPullRequestRequest\b|\bcompassv1internal\b" packages/compass-client/src/gen go/gen; then echo "SEA-1267 FENCE VIOLATION: internal-only symbol found in a PUBLIC gen tree above — an internal proto leaked past buf.gen.yaml exclude_paths"; exit 1; fi; echo "gen-fence ok: no internal symbols in public gen"'
    options:
      runFromWorkspaceRoot: true
      cache: false
    inputs:
      - '/packages/compass-client/src/gen/**/*'
      - '/go/gen/**/*'
  # buf breaking gate removed pre-dogfood (SEA-1922); RE-ADD AT GA / first pinned client (tracked: SEA-1951).
  ci:
    deps: ['lint', 'drift', 'gen-fence']
    options:
      cache: false
