// The compass.v1 first-party-agent stdio envelopes (design: architecture-lineage).
//
// INTERNAL-ONLY surface. Unlike compass.proto / comms.proto — the public,
// generated-client door between a UI and the Server — these messages are the
// framing on the agent's in-container stdio channel, spoken only between the
// first-party agent and the Runner that drives it (ExecStreaming). They are
// generated into the agent + Runner alone, never onto the public client
// surface, so the `@compass/client` server-door fence stays intact (the agent
// is not a server-door client). The gen fan-out that enforces this is a
// separate path-filtered lane; the public buf.gen.yaml never takes this file
// as input.
//
// Additive and buf-breaking-safe: a new file in the owned `compass.v1` package,
// not a change to the public messages. `buf lint`/`buf breaking` still cover it
// (they glob `compass/**/*.proto`).
//
// Ratified additive contract change (design: architecture-lineage, "Ratified additive
// contract changes"; freeze gate July 2026).

syntax = "proto3";

package compass.v1;

import "compass/v1/comms.proto";
import "compass/v1/compass.proto";
// ForgeNotification (the forge_notification AgentControl variant) lives in the
// forge.proto leaf, not agent_gateway.proto: agent_gateway.proto imports THIS
// file, so referencing a type it defined would be a circular import (Matt-ruled,
// 2026-08-05). forge.proto imports only compass.proto, so this edge is acyclic.
import "compass/v1/forge.proto";

// The agent's stdout envelope: one discriminated frame per newline-delimited
// protojson line. The agent emits two payload classes, routed to two surfaces
// with two owners (design: architecture-lineage, spine-inversion). The durable
// CONVERSATION (an agent `text` reply or an `ask`) is Compass-owned and typed —
// it commits to comms Message/MessageBlock rows + SubscribeComms. The
// execution-trace SESSION data (thought chunks, tool calls, todos, edits) is
// OMP-native and OPAQUE — relayed verbatim to the dedicated session-tail stream
// and rendered by OMP's own renderer, never re-typed by Compass. The Runner
// classifies each line by the set `oneof` field and write-throughs each variant
// to the surface that owns it (conversation → comms rows + SubscribeComms;
// session → the session-tail stream, plus the extracted AgentSessionState →
// SubscribeEvents for the board). An unset or unrecognized field IS the
// "unknown frame" the Runner logs and counts — never silently dropped.
message AgentFrame {
  oneof frame {
    // Fields 1 (conversation_posted) and 2 (conversation_updated) are REMOVED,
    // not reserved (F9): the streaming conversation write-through is gone — a
    // streamed turn no longer commits comms rows (T7). The durable conversation
    // frame now rides only the transcript lane (transcript_entry, field 7 →
    // PostConversationFrame/CommitConversationFrame), and the session trace
    // rides `session` below. Pre-dogfood, zero stored payloads, so no reserve.
    // Session: an opaque OMP-native execution-trace event and/or a board
    // lifecycle transition → the session-tail stream (+ the extracted state →
    // SubscribeEvents). Replaces the former typed status/plan/tool_call
    // variants: under the first-party OMP agent the trace is not re-typed by
    // Compass — OMP's own renderer inflates it.
    SessionFrame session = 3;
    // Agent -> Runner control-plane acks, riding the loss-tolerable Publish
    // spine beside the conversation/session frames (the established frame-spine
    // ack convention, design: architecture-lineage DeliveryAck; consolidation OQ-4(i) +
    // amended OQ-6). Both are consumed by the Runner's control lane (the
    // telemetry-ingest path routes them off Publish to it), never written
    // through to a comms/session surface.
    //   replay_complete_ack — the agent's replay-barrier ack: on receipt the
    //     Runner releases the live ops held behind the restart replay barrier.
    ReplayCompleteAck replay_complete_ack = 4;
    //   control_ack — the agent's selective apply-ack: a contiguous cursor
    //     (highest contiguously-APPLIED control_seq) plus a bounded set of seqs
    //     applied out of order above it. The Runner retires retained ops up to
    //     the cursor and drops the individually-acked ones.
    ControlAck control_ack = 5;
    //   delivery_ack — the agent's per-message delivery receipt for a
    //     DeliverControl relayed down the session (RIG-1569). The success
    //     receipt for a delivery rides this frame, not the Runner result
    //     stream (RT-3); the Server advances the delivery cursor on it.
    DeliveryAck delivery_ack = 6;
    //   transcript_entry — one committed SDK session entry, teed upstream on
    //     the DURABLE conversation-frame lane (PostConversationFrame →
    //     CommitConversationFrame), not the loss-tolerable Publish spine
    //     (RIG-1570). The Server persists it; the agent's local copy is
    //     container-ephemeral. Reconstructed into a session-JSONL body on
    //     resume (T4/T5).
    TranscriptEntry transcript_entry = 7;
    //   forge_notification_ack — the agent's per-notification receipt for a
    //     ForgeNotification pushed down the session (W3; forge sibling of
    //     delivery_ack). Emitted at turn-end flush (T6), applied by a hub ack
    //     arm beside deliverAck (T7): on receipt the Server advances the
    //     subscription's delivered_revision to the acked revision.
    ForgeNotificationAck forge_notification_ack = 8;
  }
}

// The `transcript_entry` variant's payload: one committed SDK session entry,
// teed upstream by the agent's session-storage backend as a durable frame
// (RIG-1570). `append` → a delta entry (checkpoint = false); `writeFull` (an
// SDK compaction/title rewrite) → a checkpoint entry (checkpoint = true, the
// full body as one payload). INTERNAL-only, like the rest of this file.
message TranscriptEntry {
  // One SDK session entry, verbatim in the SDK's own session-JSONL encoding
  // (the exact bytes the tee backend committed locally). Opaque to the proto
  // layer by design — the entry union embeds provider-specific payloads no
  // compass.v1 message represents, and the only consumers are the Server store
  // and the SDK's own session loader (via the Server-reconstructed resume
  // file).
  string entry_json = 1;
  // Full-snapshot-vs-delta discriminator: true = this entry is a complete
  // full-body snapshot (an SDK compaction/title rewrite via the backend's
  // writeFull) that SUPERSEDES every prior stored entry for the session; the
  // Server's supersession keys on this (T4). False = a plain delta append.
  bool checkpoint = 2;
  // Agent-stamped, monotonic from 1 PER CONTAINER LIFETIME (the agent has no
  // durable memory across restarts). The Server gap-checks this per-lifetime
  // sequence and REBASES it onto the session's stored maximum at lifetime
  // bind, so the persisted entry_seq is monotonic per SESSION and
  // (session_id, entry_seq) keys the store across resumes (T4). The
  // idempotency key on the durable envelope dedups retries.
  uint64 entry_seq = 3;
}

// The `session` variant's payload: a typed OMP-native session event plus the
// board's lifecycle state (design: architecture-lineage, retyping the former
// opaque `bytes event`). A frame carries one or
// both:
//   - `typed_event` — one typed SessionEvent (compass.proto): the execution
//     trace (assistant text/thinking chunks, tool calls + updates, plan,
//     notice). Unset for a pure lifecycle transition that carries no trace
//     event.
//   - `state` — the agent-session lifecycle state this frame transitions to;
//     the Runner extracts it into an AgentSessionStatus (stamping the
//     session_id it owns) → SubscribeEvents for the board.
//     AGENT_SESSION_STATE_UNSPECIFIED means "no transition — trace only".
//
// The former field 1 (`bytes event`) is gone: the trace is typed now, never a
// dual opaque+typed wire.
message SessionFrame {
  AgentSessionState state = 1;
  SessionEvent typed_event = 2;
}

// The agent's inbound control envelope — the other half of this §T5 contract,
// pushed to the agent over AgentGateway.Control (agent_gateway.proto). One
// AgentControl per control op. The variant NAMES and TYPES are the ratified
// v0.6 oneof (design: architecture-lineage); the transport-consolidation
// record (docs/designs/agent/compass-agent-transport-consolidation) gives it
// its first WIRE definition, replacing the never-built stdin decoder.
//
// Payload FIELDS: only the variants representable with existing compass.v1
// scalars carry fields here (PromptControl.input, DeliverControl.message,
// SteerControl.message). The TranscriptReplay /
// ConfigControl payloads stay empty shells — their fields carry an inbound SDK
// `AgentMessage` (a four-way union with an opaque provider payload) and a tool
// set (whose SDK representation includes a non-serializable `execute` handle),
// neither of which any existing compass.v1 message represents. That payload-
// shape decision is parked (RIG-1310); the shells keep the oneof complete on
// the wire and are populated by a stacked PR once the shapes settle
// (DeliverControl and the channel-borne SteerControl were so populated by
// RIG-1569, each carrying a comms Message). Defining the empty shells now is
// additive and buf-breaking-safe (field additions to a proto3 message).
message AgentControl {
  // Runner-assigned, monotonic per session: the retention/redelivery cursor
  // (consolidation amended OQ-6). An ENVELOPE field, not a payload field, so it
  // does not touch the parked payload decision. High field number leaves the
  // low numbers to the oneof variants.
  uint64 control_seq = 8;
  oneof control {
    PromptControl prompt = 1;
    SteerControl steer = 2;
    DeliverControl deliver = 3;
    ConfigControl config = 5;
    TranscriptReplay replay = 6;
    ReplayComplete replay_complete = 7;
    // forge_notification (tag 9; tag 8 is the control_seq envelope field): a forge
    // change on a subscribed artifact, pushed to the agent (DL-053/DL-054). Its
    // type lives in the forge.proto leaf to avoid the agent_gateway.proto import
    // cycle (see the import comment).
    ForgeNotification forge_notification = 9;
  }
}

// Representable payloads (existing compass.v1 scalars only).
message PromptControl {
  // The live user prompt text.
  string input = 1;
}
// A bare barrier signal: replay is complete, live ops may now flow. No payload.
message ReplayComplete {}

// SteerControl carries a comms Message: a channel `@`-mention routed into the
// agent's live session as a steer (RIG-1569), sourced from a channel
// PostMessage, wrapped in an AgentControl and relayed via the runner control
// seam (DispatchControl) — the same path DeliverControl rides, carrying the
// same single first-party Message (DL-073; no seq, the id is in the Message).
// The generic SDK-AgentMessage steer (Runner-originated, outside any channel)
// stays parked under RIG-1310.
message SteerControl {
  // The mention message to steer into the session.
  Message message = 1;
  // The steering author's handle, denormalized onto the steer op so the agent
  // emits the SessionInjection observation's from_handle without a roster
  // lookup on the injection path (RIG-2486 T1) — mirrors DeliverControl's
  // topic_name denorm rationale below. The comms Message carries only
  // `author_account_id` (an id, not a handle), so the handle is denormalized
  // here; the Server resolves it once when wrapping the AgentControl.
  string from_handle = 2;
  // The W3C `traceparent` of the Server's active span when it wrapped this
  // control, denormalized so the agent joins its turn to the message's
  // server-side trace (creation → routing → delivery → turn → tool calls, one
  // connected trace). W3C format `00-<32hex trace-id>-<16hex span-id>-<2hex
  // flags>`; EMPTY when the Server had no active span (trace machinery never
  // blocks or fails a delivery). Server-side stamping per
  // docs/designs/observability/compass-agent-message-trace-continuity/design.md.
  string traceparent = 3;
  // The names of the steer message's topic and channel, denormalized onto the
  // steer op so the agent renders the mention's source — and can reply naming
  // both — without a lookup per steer (mirrors from_handle above and
  // DeliverControl's topic_name/channel_name; peer-DM record DL-292). The ids
  // are carried transitively by the Message; only the names are denormalized
  // here. A name-resolve miss degrades exactly as from_handle does — it never
  // blocks a steer — so each is EMPTY on a resolve miss.
  string topic_name = 4;
  string channel_name = 5;
}

// Empty shells — payload fields parked (RIG-1310). Present so the AgentControl
// oneof is complete on the wire; populated by a stacked PR.
//   TranscriptReplay carries an inbound SDK AgentMessage;
//   ConfigControl carries a tool set.
message TranscriptReplay {}
message ConfigControl {}

// DeliverControl carries a comms Message to deliver into the agent's live
// session (RIG-1569): the Server wraps it in an AgentControl and relays it via
// the runner control seam (DispatchControl); the Runner writes it down the
// per-container socket. Populated from the RIG-1310 parked shell.
message DeliverControl {
  // The message to deliver into the session.
  Message message = 1;
  // The name of the message's topic, denormalized onto the deliver op so the
  // agent's turn-end coalescing queue can group held deliveries per topic
  // ("3 messages in 'retry policy'") without a topic lookup per delivery
  // (compass-zulip-threading-model design.md D3/T3). The topic *id* is already
  // carried transitively by `message.topic_id`; only the name is denormalized
  // here.
  string topic_name = 2;
  // The delivering author's handle, denormalized onto the deliver op so the
  // agent emits the SessionInjection observation's from_handle without a roster
  // lookup on the injection path (RIG-2486 T1) — same rationale as topic_name
  // above. The comms Message carries only `author_account_id` (an id, not a
  // handle), so the handle is denormalized here; the Server resolves it once
  // when wrapping the AgentControl.
  string from_handle = 3;
  // The W3C `traceparent` of the Server's active span when it wrapped this
  // control, denormalized so the agent joins its turn to the message's
  // server-side trace (creation → routing → delivery → turn → tool calls, one
  // connected trace). W3C format `00-<32hex trace-id>-<16hex span-id>-<2hex
  // flags>`; EMPTY when the Server had no active span (trace machinery never
  // blocks or fails a delivery). Server-side stamping per
  // docs/designs/observability/compass-agent-message-trace-continuity/design.md.
  string traceparent = 4;
  // The name of the message's channel, denormalized onto the deliver op so the
  // agent renders the delivery's source channel — and can reply naming it —
  // without a channel lookup per delivery (mirrors the topic_name denorm
  // rationale above; peer-DM record DL-292). The channel *id* is already
  // carried transitively by `message.channel_id`; only the name is
  // denormalized here. A name-resolve miss degrades exactly as from_handle
  // does — it never blocks a delivery — so this is EMPTY on a resolve miss.
  string channel_name = 5;
}

// DeliveryAck — the agent's per-message delivery receipt (RIG-1569), an
// AgentFrame oneof variant riding the Publish spine. Correlates to the
// delivered message by id; on receipt the Server advances the delivery cursor
// (the success receipt for a delivery, per RT-3 — not a Runner result).
message DeliveryAck {
  // The delivered comms Message's id.
  string message_id = 1;
}

// ForgeNotificationAck — the agent's per-notification delivery receipt (W3), an
// AgentFrame oneof variant riding the Publish spine beside DeliveryAck. Where
// DeliveryAck correlates a comms delivery by message_id, this correlates a forge
// notification by subscription_id and carries the notified `revision` (the
// advance target): on receipt the Server advances that subscription's
// delivered_revision (T7 hub ack arm; store AdvanceForgeDeliveredRevision).
message ForgeNotificationAck {
  string subscription_id = 1;
  string revision = 2;  // the notified revision; the advance target
}

// Two agent -> Runner control-plane ACK frames, added as AgentFrame oneof
// variants above (riding the loss-tolerable Publish spine beside DeliveryAck,
// the established frame-spine ack convention — consolidation OQ-4(i) + amended
// OQ-6). Additive to the frozen oneof; buf-breaking-safe.
message ReplayCompleteAck {}
message ControlAck {
  // Highest contiguously-applied control_seq: the Runner retires retained ops
  // up to and including this cursor.
  uint64 acked_seq = 1;
  // Seqs applied out of order ABOVE the contiguous cursor: the Runner drops
  // these individually-acked ops from retention. Bounded (a small window).
  repeated uint64 applied_above = 2;
}
