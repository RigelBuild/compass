// The compass.v1 surface the LLM gateway reads its provider credentials from
// (design docs/designs/server/compass-server-llm-gateway/design.md §T2).
//
// INTERNAL-ONLY surface, spoken between the Server and the gateway tier. The
// gateway authenticates as a service subject, never an account. It is generated
// into the internal Go lane and the gateway's TS lane only, never onto the public
// @compass/client surface.
//
// The Server holds every credential sealed at rest and returns plaintext only
// here. Pool membership and tenant isolation are decided Server-side; the
// gateway never names a tenant.

syntax = "proto3";

package compass.v1;

// service GatewayCredentials — the gateway's credential source. A suffix-less
// name follows the AgentGateway precedent: a door for one internal tier, not a
// public *Service.
service GatewayCredentials {
  // ListPool returns the active credentials an agent's requests may use, own
  // credentials before shared ones. An unknown agent is NOT_FOUND.
  rpc ListPool(ListPoolRequest) returns (ListPoolResponse);

  // UpdateOAuth writes back a refreshed OAuth token iff the row is still at
  // expected_version. A lost race is ABORTED; a disabled or missing row is
  // NOT_FOUND.
  rpc UpdateOAuth(UpdateOAuthRequest) returns (UpdateOAuthResponse);

  // Disable retires a credential iff the row is still at expected_version, so a
  // failed refresh never disables a token a peer just rotated. A lost race is
  // ABORTED; an already disabled or missing row is NOT_FOUND.
  rpc Disable(DisableRequest) returns (DisableResponse);
}

// Where a credential comes from in a pool. OWN is the caller's owner's own
// credential; SHARED is the tenant's fallback key.
enum CredentialScope {
  CREDENTIAL_SCOPE_UNSPECIFIED = 0;
  CREDENTIAL_SCOPE_OWN = 1;
  CREDENTIAL_SCOPE_SHARED = 2;
}

// An OAuth grant. Field names follow the gateway's OAuthCredentials.
message OAuthToken {
  string access = 1;
  string refresh = 2;
  int64 expires_unix_ms = 3;
  string enterprise_url = 4;
  string project_id = 5;
  string email = 6;
  string account_id = 7;
  string api_endpoint = 8;
  string org_id = 9;
  string org_name = 10;
  int64 authorized_at_unix_ms = 11;
}

// One credential row.
message GatewayCredential {
  string id = 1;
  string provider = 2;
  CredentialScope scope = 3;
  // The CAS token for UpdateOAuth and Disable; bumped on every write.
  int64 version = 4;
  oneof value {
    string api_key = 5;
    OAuthToken oauth = 6;
  }
}

message ListPoolRequest {
  // The agent whose request the gateway is serving.
  string agent_account_id = 1;
  // Restricts the pool to one provider; empty returns every provider.
  string provider = 2;
}

message ListPoolResponse {
  // Own credentials first, then shared, each in creation order.
  repeated GatewayCredential credentials = 1;
}

message UpdateOAuthRequest {
  string id = 1;
  OAuthToken token = 2;
  int64 expected_version = 3;
}

message UpdateOAuthResponse {
  int64 version = 1;
}

message DisableRequest {
  string id = 1;
  // Why the gateway gave up on the credential, shown to its owner.
  string cause = 2;
  int64 expected_version = 3;
}

message DisableResponse {}
