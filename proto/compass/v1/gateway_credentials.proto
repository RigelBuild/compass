// Plaintext credentials cross only this internal service. The gateway never
// names a tenant; the Server resolves it from agent_account_id.
// Mounted only behind a SubjectService bearer with an llm-gateway allowlist.
// Internal Go lane only; see docs/designs/server/compass-server-llm-gateway/design.md §T2.

syntax = "proto3";

package compass.v1;

// service GatewayCredentials — the gateway's credential source. A suffix-less
// name follows the AgentGateway precedent: a door for one internal tier, not a
// public *Service.
service GatewayCredentials {
  // ListCredentialPool returns credentials per provider: the caller's own
  // credentials, or shared credentials only when the caller has none.
  // An unknown agent is NOT_FOUND.
  rpc ListCredentialPool(ListCredentialPoolRequest) returns (ListCredentialPoolResponse);

  // Replaces the whole OAuth token. A missing or disabled row is NOT_FOUND
  // before version comparison; 0 is INVALID_ARGUMENT and a lost race is ABORTED.
  rpc UpdateCredentialOAuth(UpdateCredentialOAuthRequest) returns (UpdateCredentialOAuthResponse);

  // A missing or disabled row is NOT_FOUND before version comparison; 0 is
  // INVALID_ARGUMENT and a lost version race is ABORTED.
  rpc DisableCredential(DisableCredentialRequest) returns (DisableCredentialResponse);
}

// Where a credential comes from in a pool.
enum GatewayCredentialScope {
  GATEWAY_CREDENTIAL_SCOPE_UNSPECIFIED = 0;
  GATEWAY_CREDENTIAL_SCOPE_OWN = 1;
  GATEWAY_CREDENTIAL_SCOPE_SHARED = 2;
}

// An OAuth grant. Field names follow the gateway's OAuthCredentials.
message GatewayOAuthToken {
  string access = 1 [debug_redact = true];
  string refresh = 2 [debug_redact = true];
  int64 expires_unix_ms = 3;
  string enterprise_url = 4;
  string project_id = 5;
  string email = 6;
  string account_id = 7;
  string api_endpoint = 8;
  string org_id = 9;
  string org_name = 10;
  int64 authorized_at_unix_ms = 11;
}

message GatewayCredential {
  // Opaque and globally unique; writes use it without naming a tenant.
  string id = 1;
  string provider = 2;
  GatewayCredentialScope scope = 3;
  // Versions start at 1 and increase on each write; expected_version 0 is INVALID_ARGUMENT.
  // Missing or disabled rows are NOT_FOUND before version comparison; a lost race is ABORTED.
  int64 version = 4;
  oneof value {
    // Stored by deliberate enrollment, so the gateway treats it as a login key.
    string api_key = 5 [debug_redact = true];
    GatewayOAuthToken oauth = 6;
  }
}

message ListCredentialPoolRequest {
  // The agent whose request the gateway is serving; empty is INVALID_ARGUMENT.
  string agent_account_id = 1;
  // Restricts the pool to one provider; empty returns every provider.
  string provider = 2;
}

message ListCredentialPoolResponse {
  repeated GatewayCredential credentials = 1;
}

message UpdateCredentialOAuthRequest {
  // Empty id or expected_version 0 is INVALID_ARGUMENT. Missing or disabled is
  // NOT_FOUND before CAS; a lost race is ABORTED; non-OAuth is FAILED_PRECONDITION.
  string id = 1;
  GatewayOAuthToken token = 2;
  // Must be nonzero; zero is INVALID_ARGUMENT.
  int64 expected_version = 3;
}

message UpdateCredentialOAuthResponse {
  int64 version = 1;
}

message DisableCredentialRequest {
  // Empty id or expected_version 0 is INVALID_ARGUMENT. Missing or disabled is
  // NOT_FOUND before CAS; a lost version race is ABORTED.
  string id = 1;
  // Why the gateway gave up on the credential, shown to its owner.
  string cause = 2;
  // Must be nonzero; zero is INVALID_ARGUMENT.
  int64 expected_version = 3;
}

message DisableCredentialResponse {}
