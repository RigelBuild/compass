// Internal-only: credentials cross only this service, behind the llm-gateway SubjectService bearer.
// The Server resolves agent, owner, and tenant; handlers never log req.Msg.
// debug_redact is metadata only in protobuf-go.

syntax = "proto3";

package compass.v1;

// service GatewayCredentials — the gateway's credential source. A suffix-less
// name follows the AgentGateway precedent: a door for one internal tier, not a
// public *Service.
service GatewayCredentials {
  // INVALID_ARGUMENT for empty agent_token; UNAUTHENTICATED for invalid tokens.
  // Returns enabled credentials; empty provider selects all, own credentials first.
  // INTERNAL if credential lookup is unavailable.
  rpc ListCredentialPool(ListCredentialPoolRequest) returns (ListCredentialPoolResponse);

  // INVALID_ARGUMENT for invalid fields; UNAUTHENTICATED for invalid agent_token.
  // NOT_FOUND masks missing, disabled or out-of-pool IDs; omitted OAuth fields stay unchanged.
  // FAILED_PRECONDITION if not OAuth; ABORTED on version conflict; INTERNAL if unavailable.
  rpc UpdateCredentialOAuth(UpdateCredentialOAuthRequest) returns (UpdateCredentialOAuthResponse);

  // INVALID_ARGUMENT for invalid fields; UNAUTHENTICATED for invalid agent_token.
  // NOT_FOUND masks missing, disabled or out-of-pool IDs; cause records why it was disabled.
  // ABORTED on version conflict; INTERNAL if unavailable.
  rpc DisableCredential(DisableCredentialRequest) returns (DisableCredentialResponse);
}

// Where a credential comes from in a pool.
enum GatewayCredentialScope {
  GATEWAY_CREDENTIAL_SCOPE_UNSPECIFIED = 0;
  GATEWAY_CREDENTIAL_SCOPE_OWN = 1;
  GATEWAY_CREDENTIAL_SCOPE_SHARED = 2;
}

// An OAuth grant. Field names follow the gateway's OAuthCredentials.
message GatewayOAuthToken {
  string access = 1 [debug_redact = true];
  string refresh = 2 [debug_redact = true];
  int64 expires_unix_ms = 3;
  string enterprise_url = 4;
  string project_id = 5;
  string email = 6;
  string account_id = 7;
  string api_endpoint = 8;
  string org_id = 9;
  string org_name = 10;
  int64 authorized_at_unix_ms = 11;
  // Account residency; selects the API host for region-partitioned providers.
  string region = 12;
  // Inference scope: "global", "eu", or "us"; empty when the provider has none.
  string inference_region = 13;
  string active_organization_id = 14;
}

message GatewayCredential {
  // Opaque and globally unique; a write must also name the agent whose pool holds it.
  string id = 1;
  string provider = 2;
  GatewayCredentialScope scope = 3;
  // Versions start at 1 and increase on each write; expected_version 0 is INVALID_ARGUMENT.
  // Missing, disabled, or out-of-pool rows are NOT_FOUND before version comparison;
  // a lost race is ABORTED.
  int64 version = 4;
  oneof value {
    // Stored by deliberate enrollment, so the gateway treats it as a login key.
    string api_key = 5 [debug_redact = true];
    GatewayOAuthToken oauth = 6;
  }
}

message ListCredentialPoolRequest {
  reserved 1;
  reserved "agent_account_id";
  // Restricts the pool to one provider; empty returns every provider.
  string provider = 2;
  // The token for the agent whose request the gateway is serving.
  string agent_token = 3 [debug_redact = true];
}

message ListCredentialPoolResponse {
  repeated GatewayCredential credentials = 1;
}

message UpdateCredentialOAuthRequest {
  // INVALID_ARGUMENT for invalid fields; omitted OAuth fields keep their current values.
  // NOT_FOUND masks missing, disabled or out-of-pool IDs; clear_fields clears metadata.
  string id = 1;
  GatewayOAuthToken token = 2;
  // Must be nonzero; zero is INVALID_ARGUMENT.
  int64 expected_version = 3;
  reserved 4;
  reserved "agent_account_id";
  // GatewayOAuthToken metadata fields to zero (an empty field keeps its value); a clear
  // wins over a sent value. access, refresh, expires_unix_ms or unknown: INVALID_ARGUMENT.
  repeated string clear_fields = 5;
  // The token for the agent whose request the gateway is serving.
  string agent_token = 6 [debug_redact = true];
}

message UpdateCredentialOAuthResponse {
  int64 version = 1;
}

message DisableCredentialRequest {
  // INVALID_ARGUMENT for missing fields; cause records why this credential was disabled.
  // NOT_FOUND masks missing, disabled or out-of-pool IDs.
  string id = 1;
  string cause = 2;
  // Must be nonzero; zero is INVALID_ARGUMENT.
  int64 expected_version = 3;
  reserved 4;
  reserved "agent_account_id";
  // The token for the agent whose request the gateway is serving.
  string agent_token = 5 [debug_redact = true];
}

message DisableCredentialResponse {}
