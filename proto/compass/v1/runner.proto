// The compass.v1 Server<->Runner seam (design compass-0.6 §T4,
// design.md:1279-1369; wire shape frozen by the platform record
// docs/designs/platform/go-toolchain-default.md:925-943).
//
// INTERNAL-ONLY surface. Like agent.proto (the in-container agent stdio
// envelopes) and unlike compass.proto / comms.proto (the public generated-client
// door between a UI and the Server), RunnerService is an internal control
// protocol spoken only between the Server and the Runner binaries. It is
// generated ONLY into the internal Go consumers (internal/server handler +
// internal/runner client), never the module-root exported `gen/` nor the public
// TS client, so the `@compass/client` server-door fence stays intact
// (go-toolchain-default.md:330-338, :1303-1307). The gen fan-out that enforces
// this is a separate path-filtered lane; the public buf.gen.yaml never takes
// this file as input.
//
// Additive and buf-breaking-safe: a new file in the owned `compass.v1` package,
// not a change to the public messages. `buf lint`/`buf breaking` still cover it
// (they glob `compass/**/*.proto`).
//
// Frozen, not re-decided here: the three-RPC shape and directions are fixed by
// the platform record (go-toolchain-default.md:931-937). Because the Runner
// dials OUT to the Server, the Server has no inbound route to call the Runner:
// command delivery cannot be a unary Server->Runner RPC, so it rides the
// Server's *response* half of a Runner-opened bidi stream. Cutting the concrete
// message fields to realize that frozen shape is conformance.

syntax = "proto3";

package compass.v1;

import "compass/v1/agent_gateway.proto";
import "compass/v1/agent.proto";
import "compass/v1/compass.proto";
import "compass/v1/forge.proto";

// The internal control seam between the Server and one Runner. Five RPCs, all
// initiated by the Runner (it dials out; the Server has no inbound route to the
// Runner):
//   - Enroll        unary handshake at connect (auth + registry entry).
//   - Sessions      bidi: the Server pushes session commands, the Runner
//                   returns results, correlated by request id.
//   - PublishEvents client-stream: the Runner relays agent events upward,
//                   Runner-sequenced for gap detection.
//   - RelayCommsCall       unary: execute one agent-initiated comms call under
//                          the account the session resolves to.
//   - RelayLifecycleCall   unary: relay one agent-initiated lifecycle call
//                          (spawn/despawn a peer) under the account the session
//                          resolves to.
//   - CommitConversationFrame unary: commit one durable conversation frame and
//                          return its sink coordinates (message_id, seq).
service RunnerService {
  // Enroll (unary, Runner->Server, at connect): the authenticated registration
  // handshake. A valid Runner-subject token (OQ7: store.Subject{Kind:
  // SubjectRunner}) that reaches the handler is enrolled; an account-subject
  // token is rejected here with CodeUnauthenticated (the RunnerService side of
  // the two mandatory cross-door rejection tests, go-toolchain-default.md:
  // 1417-1419). Duplicate enrollment re-attaches the same Runner rather than
  // registering a second (single-Runner MVP, OQ6 go-toolchain-default.md:1392).
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Sessions (bidi, Runner-opened): the session-command relay. Because the
  // Runner is the gRPC client, its REQUEST stream carries command *results*
  // upward and the Server's RESPONSE stream pushes session *commands* downward
  // — the inversion is inherent to the dial-out model
  // (go-toolchain-default.md:929-934), not a naming accident. Every command and
  // its result carry a shared `request_id` (OQ6): a command retried after a
  // timeout reuses its id so the Runner dedupes it to the original result — no
  // duplicate container, no spurious ALREADY_RUNNING (go-toolchain-default.md:
  // 1388-1389).
  rpc Sessions(stream SessionsRequest) returns (stream SessionsResponse);

  // PublishEvents (client-stream, Runner->Server): the Runner relays each agent
  // stdout frame upward. The stream is Runner-sequenced (seq assigned at the
  // Runner, not at Server publish) so in-transit loss is detectable as a gap
  // and the Client bus's gap-free guarantee holds (OQ6, go-toolchain-default.md:
  // 1389-1392). This is the sole path Runner events take into the Server; the
  // RunnerHub.Deliver seam behind it is where a future brokered transport would
  // substitute, nothing else (design.md:1347-1352).
  rpc PublishEvents(stream PublishEventsRequest) returns (PublishEventsResponse);

  // RelayCommsCall (unary, Runner->Server): execute one agent-initiated comms
  // call under the agent account the session resolves to. The Runner is a pure
  // forwarder — it sends the session_id it structurally owns (which per-container
  // socket the AgentGateway call arrived on, 1:1 with the session) and the
  // CommsCallRequest, and asserts NO account. The SERVER resolves
  // session_id -> agent account from its own Provision-originated hub binding and
  // attributes the call in-process under comms.WithActor, fail-closed: an
  // unknown/stopped session is CodeNotFound, never a stale account or the
  // bootstrap-admin fallback (transport design Decision #3 / OQ-2, comms-tools
  // design T2). A fourth RPC, additive to the frozen dial-out shape (the Runner
  // still initiates; the Server gains no inbound route): merging the comms-tools
  // record ratifies it (comms-tools OQ-1). The request oneof (CommsCallRequest,
  // agent_gateway.proto) cannot express RespondToAsk — the no-answer-ask
  // constraint is structural, not a runtime check.
  rpc RelayCommsCall(RelayCommsCallRequest) returns (RelayCommsCallResponse);

  // RelayLifecycleCall (unary, Runner->Server): relay one agent-initiated
  // lifecycle call (spawn/despawn a peer) under the agent account the session
  // resolves to. Same pure-forwarder shape as RelayCommsCall: the Runner sends
  // the session_id it structurally owns (the per-container AgentGateway socket
  // the call arrived on, 1:1 with the session) and the LifecycleCallRequest, and
  // asserts NO account. The Server resolves session_id -> agent account from its
  // own Provision-originated hub binding, then resolves that agent's owner to
  // scope spawn (owner-inherited) and despawn (same-owner) authority,
  // fail-closed: an unknown/stopped session is CodeNotFound, never a stale
  // account or the bootstrap admin. Additive to the frozen dial-out shape (the
  // Runner still initiates; the Server gains no inbound route); merging the
  // spawn/despawn record ratifies it.
  rpc RelayLifecycleCall(RelayLifecycleCallRequest) returns (RelayLifecycleCallResponse);

  // RelayForgeCall (unary, Runner->Server): relay one agent-initiated forge call
  // (create/comment/read an issue or PR, subscribe/unsubscribe an artifact) under
  // the agent account the session resolves to. Same pure-forwarder shape as
  // RelayCommsCall: the Runner sends the session_id it structurally owns (the
  // per-container AgentGateway socket the call arrived on, 1:1 with the session)
  // and the ForgeCallRequest, and asserts NO account. The Server resolves
  // session_id -> agent account from its own Provision-originated hub binding,
  // stamps the owner header (DL-050) and makes the forge call with its own
  // credential (DL-052), fail-closed: an unknown/stopped session is CodeNotFound,
  // never a stale account or the bootstrap admin. Read ops are answered from the
  // projection/store, not a live forge proxy (DL-069 amendment OQ-A). Additive to
  // the frozen dial-out shape (the Runner still initiates; the Server gains no
  // inbound route); merging the ownership-layer record ratifies it.
  rpc RelayForgeCall(RelayForgeCallRequest) returns (RelayForgeCallResponse);

  // CommitConversationFrame (unary, Runner->Server): durably commit one
  // agent-authored conversation frame and return the commit outcome. This is
  // the DURABLE counterpart to PublishEvents: conversation_posted /
  // conversation_updated frames leave the loss-tolerant Publish spine entirely
  // and commit here, request/response, so the agent's PostConversationFrame is
  // acked on a real store commit rather than a spine forward-accept (#24 OQ-3).
  //
  // The Runner is a pure forwarder, exactly as in RelayCommsCall: it sends the
  // session_id it structurally owns (the per-container AgentGateway socket the
  // frame arrived on, 1:1 with the session) and asserts NO account. The Server
  // resolves session_id -> agent account from its own Provision-originated hub
  // binding and commits under that actor, fail-closed — an unknown/stopped
  // session is CodeNotFound, never a stale account or the bootstrap admin.
  //
  // idempotency_key is the SAME agent-minted envelope key carried on
  // AgentGateway.PostConversationFrame (agent_gateway.proto:113-119): the Server
  // commits at-most-once per key against the store's (author, client_request_id)
  // unique constraint, so a retry after a lost ack dedups to the original row
  // and returns committed=true with the ORIGINAL message_id/seq — never a
  // duplicate. A new field would fork the Runner's advisory dedup from the real
  // commit boundary, so we reuse it (Matt-ratified).
  //
  // Additive to the frozen dial-out shape (the Runner still initiates; the
  // Server gains no inbound route), same justification as RelayCommsCall.
  rpc CommitConversationFrame(CommitConversationFrameRequest) returns (CommitConversationFrameResponse);

  // FetchSecrets (unary, Runner->Server): the Runner fetches the full resolved
  // secret set for one session to materialize into the agent container (SEA-1327
  // T4). Inject-all: no name filter, no per-agent grants (the filter is the
  // named future per-agent-scoping seam). The response is no-log: a logging
  // interceptor must never dump resolved values. Additive to the frozen dial-out
  // shape (the Runner still initiates; the Server gains no inbound route).
  rpc FetchSecrets(FetchSecretsRequest) returns (FetchSecretsResponse);

  // FetchAgentConfig (server-streaming, Runner->Server): the Runner fetches the
  // fleet config bundle to materialize into the agent container at provision
  // (SEA-1568 T3/T4). Server-streaming so the bundle is never bounded by the
  // connect/gRPC unary recv cap: the first response frame carries the version,
  // subsequent frames carry the tarball bytes in chunks. The security caps
  // (decompressed size, file count) live at unpack (T1's door, re-enforced at
  // the Runner's ConfigMaterializer), not in the transport. if_version is an
  // optional reconnect optimization: on a match the Server ends the stream after
  // the version frame with no chunks (the version-only fetch). The fleet bundle
  // is unkeyed — no per-account binding — so, like the other RunnerService RPCs,
  // it is authenticated by the per-Runner token alone (account-subject tokens
  // rejected). An unconfigured fleet returns a version frame with an empty
  // version and no chunks, never an error. Additive to the frozen dial-out shape
  // (the Runner still initiates; the Server gains no inbound route).
  rpc FetchAgentConfig(FetchAgentConfigRequest) returns (stream FetchAgentConfigResponse);
}

// Enroll request: the Runner announces its stable identity at connect. The id
// is cross-checked against the authenticated token subject (store.Subject.ID for
// a SubjectRunner token) — a mismatch is a spoofing attempt and is rejected
// CodeUnauthenticated, so the field is a defense-in-depth cross-check, not a
// trusted input. The credential itself rides the transport as a bearer token,
// never a field here (mirroring IssueTokenRequest, compass.proto:237-242).
message EnrollRequest {
  string runner_id = 1;
}

// Enroll response: the handshake ack. `reattached` distinguishes a fresh
// enrollment from a re-attach of an already-registered Runner (OQ6 duplicate
// enrollment, go-toolchain-default.md:1392) — the wire-level evidence a
// reattach test asserts on.
message EnrollResponse {
  bool reattached = 1;
}

// A session command result, sent Runner->Server on the Sessions request stream
// (the inversion: the Runner's request half carries results — see the RPC
// comment). `request_id` correlates it to the SessionsResponse command that
// produced it. Exactly one result variant is set; `error` carries an in-band
// failure so a single command's failure does not tear down the shared stream.
message SessionsRequest {
  string request_id = 1;
  oneof result {
    StartAgentSessionResponse start = 2;
    StopAgentSessionResponse stop = 3;
    ReloadAgentSessionResponse reload = 4;
    GetAgentStatusResponse status = 5;
    ProvisionAgentWorkspaceResponse provision = 6;
    RunnerError error = 7;
    RemoveAgentWorkspaceResponse remove = 8;
  }
}

// A session command, pushed Server->Runner on the Sessions response stream (the
// inversion: the Server's response half carries commands — see the RPC comment).
// The command variants reuse the frozen public session-RPC request payloads
// (compass.proto) verbatim: the relay carries exactly what the Client-facing
// CompassService session RPC received, so a payload field added there flows
// through the relay unchanged. `request_id` is the OQ6 idempotency key: a retry
// reuses it and the Runner returns the original result.
message SessionsResponse {
  string request_id = 1;
  oneof command {
    StartAgentSessionRequest start = 2;
    StopAgentSessionRequest stop = 3;
    ReloadAgentSessionRequest reload = 4;
    GetAgentStatusRequest status = 5;
    ProvisionAgentWorkspaceRequest provision = 6;
    // forge_notification (tag 7): the Server pushes one forge change on a
    // subscribed artifact (DL-053/DL-054); the Runner relays it down the
    // addressed session's per-container socket as AgentControl.forge_notification.
    // Payload-carrying (ForgeNotification, forge.proto), like deliver_control; no
    // SessionsRequest result variant — it is a notification, not a command.
    ForgeNotification forge_notification = 7;
    // secrets_version (tag 8; tag 7 reserved for forge_notification): the Server
    // signals the Runner that the session's secret set changed; the Runner
    // re-fetches via FetchSecrets. Signal-only — never carries values, no result
    // variant on the request stream.
    SecretsVersion secrets_version = 8;
    // config_version (tag 9): the Server signals the fleet that the config
    // bundle changed; the Runner re-fetches via FetchAgentConfig, re-materializes
    // the new version dir, and Reloads live agents in place (SEA-1568 T3/T6).
    // Fleet-wide, no per-account key. Signal-only — never carries bytes, and,
    // like secrets_version, is NOT request_id-correlated and has NO
    // SessionsRequest result variant: it is a notification, not a command, so the
    // Runner sends no result frame for it. Sibling to secrets_version (tag 8).
    ConfigVersion config_version = 9;
    // deliver_control (tag 11; 8 secrets_version / 9 config_version / 10 remove /
    // 11 deliver_control landed): the Server relays a control op — for SEA-1569, a message
    // delivery — down to the Runner, which writes it to the session's
    // per-container socket. Carries the op as payload (DispatchControl). No
    // SUCCESS result variant: the delivery receipt rides AgentFrame.delivery_ack
    // (RT-3); a refusal rides the RunnerError result (error = 7), correlated by
    // request_id.
    DispatchControl deliver_control = 11;
    // remove (tag 10; tag 7 reserved for forge_notification; 8 secrets_version /
    // 9 config_version / 11 deliver_control landed): the Server relays a
    // container-teardown command (RemoveAgentWorkspace) down to the Runner,
    // reusing the public payload verbatim like the other command variants. Its
    // result rides SessionsRequest.result.remove (tag 8); a refusal rides the
    // RunnerError result (error = 7), correlated by request_id.
    RemoveAgentWorkspaceRequest remove = 10;
  }
  // resume_body — the INTERNAL resume-body carrier, a TOP-LEVEL sibling of
  // request_id OUTSIDE the command oneof (SEA-1570): the Server attaches it on
  // an authorized resume start beside the verbatim public `start` request,
  // which itself carries only the authz-checked resume_session_id (no locator,
  // = 8 and deliver_control = 11, and 12 is skipped (the design-abandoned
  // ResumeContext resume, DL-065 — never wired, so nothing serialized it). A
  // fresh tag, never a reused one.
  ResumeBody resume_body = 13;
}

// ResumeBody — the INTERNAL resume-body carrier attached to SessionsResponse on
// an authorized resume (SEA-1570). Additive, INTERNAL-ONLY: rides the
// path-filtered internal gen lane, never the public client surface. The Server
// attaches it; no client can supply it, and the public `start` request is
// relayed verbatim (T6).
message ResumeBody {
  // The reconstructed post-supersession session-JSONL body (T5) — string,
  // consistent with TranscriptEntry.entry_json.
  string session_body = 1;
  // Inline-image blob bytes are OUT of MVP scope (SEA-1582): no grounded
  // agent-side capture seam exists, so the carrier holds only the JSONL body.
}

// DispatchControl — the Server->Runner relay envelope for a control op
// (SEA-1569). Carries the full AgentControl op (for a delivery,
// AgentControl{ deliver: DeliverControl{ message } }); the Runner relays op
// down the addressed session's per-container socket. Payload-carrying, not
// signal-only.
message DispatchControl {
  // The target session on this Runner.
  string session_id = 1;
  // The control op to relay into the session.
  AgentControl op = 2;
}

// FetchSecrets request: which agent's secret set to resolve. Inject-all — no
// name filter. The caller sets exactly one selector: a `container_name` for the
// PROVISION-time initial materialize (the container→account binding exists from
// Provision, before any session is minted — SEA-1327 T5 materializes before the
// agent is exec'd), or a `session_id` for the post-Start rotation re-fetch (the
// SecretsVersion signal path, T6). The two are mutually exclusive by convention,
// not a oneof: session_id kept tag 1 with its original flat cardinality so the
// change stays wire-compatible, and an empty string means "unset" (neither a
// session id nor a container name is ever empty). The server resolves the agent
// account from whichever binding is named and rejects an unbound/foreign one —
// or a request that sets neither — accordingly.
message FetchSecretsRequest {
  // session_id: authorize against the live session→Runner binding (rotation
  // re-fetch, T6). Empty when the caller selects by container_name instead.
  string session_id = 1;
  // container_name: authorize against the container→account binding recorded at
  // Provision (initial pre-exec materialize, T5). Empty when the caller selects
  // by session_id instead.
  string container_name = 2;
}
// FetchSecrets response: the whole resolved secret set. NO-LOG — carries live
// secret values.
message FetchSecretsResponse {
  repeated ResolvedSecret secrets = 1;
}
// One resolved secret: name + value + content-hash version + delivery/kind
// routing. The SecretDelivery/SecretKind enums are the public ones from
// compass.proto (this internal file already imports it). `value` is the no-log
// target.
message ResolvedSecret {
  string name = 1;
  string value = 2 [debug_redact = true];
  string version = 3 [debug_redact = true];  // content-hash (SHA-256 hex); redacted like value — the hash is a confirmation oracle for a low-entropy secret (mirrors secrets.go String/GoString omitting Version)
  SecretDelivery delivery = 4;
  SecretKind kind = 5;
  string host = 6;      // set only for SECRET_KIND_GH
  string provider = 7;  // set only for SECRET_KIND_PROVIDER
}
// SecretsVersion: a Server->Runner signal that a session's secret set changed.
// Signal only — carries no values; the Runner re-fetches on it.
message SecretsVersion {
  string session_id = 1;
  // An OPAQUE per-session monotonic set-change token — bumped on any registry
  // write to the session's set, NOT value-derived. It MUST NOT be an aggregate
  // content-hash of the set: the oracle-sensitive diff is downstream on the
  // per-value ResolvedSecret.version (a content hash, redacted for exactly that
  // reason), so a value-derived token here would gratuitously mint a second
  // confirmation oracle for zero benefit. Its only job is "re-fetch now", so it
  // carries no value entropy and is deliberately un-redacted.
  string version = 2;
}

// FetchAgentConfig request: an optional reconnect optimization. if_version, when
// set to the version the Runner already holds, lets the Server end the stream
// after the version frame with no chunks (the version-only fetch); empty means
// "send the full bundle". The fleet bundle is unkeyed, so no session/container
// selector rides here — the per-Runner token alone authorizes.
message FetchAgentConfigRequest {
  string if_version = 1;
}
// FetchAgentConfig response: a stream of frames. The FIRST frame carries the
// bundle version; every subsequent frame carries a tarball byte chunk. Splitting
// the bundle across chunk frames keeps its size off the connect/gRPC unary recv
// cap. On an if_version match the Server sends only the version frame (no
// chunks); an unconfigured fleet sends a version frame with an empty version and
// no chunks. The Runner reassembles the chunks in receive order.
message FetchAgentConfigResponse {
  oneof frame {
    // The bundle version (content hash). Always the first frame.
    string version = 1;
    // One tarball byte chunk. Reassembled in receive order.
    bytes chunk = 2;
  }
}
// ConfigVersion: a Server->Runner signal that the fleet config bundle changed.
// Signal only — carries no bytes; the Runner re-fetches via FetchAgentConfig on
// it. Fleet-wide, no per-account key. Mirrors SecretsVersion: not
// request_id-correlated, no result variant.
message ConfigVersion {
  // The new bundle version (content hash). An empty version means the fleet was
  // cleared to no config — the Runner re-fetches and materializes an empty dir.
  string version = 1;
}

// An in-band command failure carried in a SessionsRequest result oneof. The
// Server maps `code` to the Connect status it returns to the Client-facing
// caller of the relayed session RPC. ALREADY_RUNNING is distinguished so the
// OQ6 idempotency test can assert a legitimate retry does NOT surface it (the
// retry dedupes to the original success), while a genuine double-start of a
// live session does.
message RunnerError {
  RunnerErrorCode code = 1;
  string message = 2;
}

// The failure classes a Runner returns for a relayed session command. Kept to
// what the Runner actually distinguishes; the Server maps each to a Connect code.
enum RunnerErrorCode {
  RUNNER_ERROR_CODE_UNSPECIFIED = 0;
  // A start hit a session already live on this container (a genuine double
  // start, not an idempotent retry) -> Connect AlreadyExists.
  RUNNER_ERROR_CODE_ALREADY_RUNNING = 1;
  // The target session/container is unknown to the Runner -> Connect NotFound.
  RUNNER_ERROR_CODE_NOT_FOUND = 2;
  // Any other Runner-side failure (container engine error, exec failure) ->
  // Connect Internal.
  RUNNER_ERROR_CODE_INTERNAL = 3;
  // A delivery (deliver_control) was refused because the session's retention
  // buffer is full (SEA-1569) -> Connect ResourceExhausted. Distinguishes a
  // retention-full refusal in-band so the Server can leave the delivery cursor
  // unadvanced and redeliver.
  RUNNER_ERROR_CODE_RESOURCE_EXHAUSTED = 4;
}

// One Runner-sequenced agent event, relayed Runner->Server on PublishEvents.
message PublishEventsRequest {
  // Runner-assigned monotonic sequence across this Runner's whole event stream
  // (not per session). A gap in the sequence the Server observes is detectable
  // in-transit loss (OQ6, go-toolchain-default.md:1389-1392).
  uint64 runner_seq = 1;
  // The session this event belongs to (the Server-side session id the Runner
  // was handed at Start).
  string session_id = 2;
  // The relayed agent stdout frame, verbatim. The RunnerHub classifies it by
  // the set `oneof frame` field (conversation -> comms rows + SubscribeComms;
  // session -> the session-tail stream + extracted AgentSessionState ->
  // SubscribeEvents). An unset/unrecognized variant is the "unknown frame" the
  // hub logs and counts, never silently drops (agent.proto:38-39).
  AgentFrame frame = 3;
  // Agent-minted idempotency key for a durable conversation frame (the durable
  // PostConversationFrame path). Empty for trace/session frames and for the
  // Publish stream — only the delivered-or-erred durable path sets it. The
  // Server commits the frame at-most-once per (author, key) at the comms
  // Message store (store/messages.go AppendMessage clientRequestID), so a
  // committed-but-response-lost retry is deduped, never duplicated. Carried
  // here because the frozen wire had no field for it and Message.id is
  // Server-assigned, not agent-minted (transport-consolidation record,
  // Matt's Option A ruling 2026-07-24).
  string idempotency_key = 4;
}

// PublishEvents ack, returned once when the Runner closes the event stream.
message PublishEventsResponse {}

// RelayCommsCall request: the Runner forwards one agent-initiated comms call to
// the Server. `session_id` is the session the Runner structurally owns for this
// call (from which per-container AgentGateway socket it arrived on — 1:1 with
// the session, agent_gateway.proto). `call` is the agent's request verbatim.
// The Runner asserts NO account here; the Server resolves session_id -> account
// from its own binding (comms-tools design T2). A session_id the Server does not
// know (never provisioned, or stopped/dropped-on-reconnect) fails closed
// CodeNotFound — never a stale account, never the bootstrap admin.
message RelayCommsCallRequest {
  string session_id = 1;
  CommsCallRequest call = 2;
}

// RelayCommsCall response: the result of the executed comms call, correlated by
// the same call_id the agent minted. A successful call carries its post/list
// result; an in-band tool failure (non-member channel, bad input) carries the
// CommsCallError variant — NOT a Connect stream error, so a single failed call
// never tears down the transport.
message RelayCommsCallResponse {
  CommsCallResult result = 1;
}

// RelayLifecycleCall request: the Runner forwards one agent-initiated lifecycle
// call to the Server. `session_id` is the session the Runner structurally owns
// for this call (which per-container AgentGateway socket it arrived on — 1:1
// with the session, agent_gateway.proto). `call` is the agent's request
// verbatim. The Runner asserts NO account here; the Server resolves
// session_id -> account from its own binding, fail-closed CodeNotFound for an
// unknown/stopped/dropped session — never a stale account, never the bootstrap
// admin.
message RelayLifecycleCallRequest {
  string session_id = 1;
  LifecycleCallRequest call = 2;
}

// RelayLifecycleCall response: the result of the executed lifecycle call,
// correlated by the same call_id the agent minted. A successful call carries its
// spawn/despawn result; an in-band tool failure (unknown target, duplicate
// handle, self-despawn) carries the LifecycleCallError variant — NOT a Connect
// stream error, so a single failed call never tears down the transport.
message RelayLifecycleCallResponse {
  LifecycleCallResult result = 1;
}

// RelayForgeCall request: the Runner forwards one agent-initiated forge call to
// the Server. `session_id` is the session the Runner structurally owns for this
// call (which per-container AgentGateway socket it arrived on — 1:1 with the
// session, agent_gateway.proto). `call` is the agent's request verbatim. The
// Runner asserts NO account here; the Server resolves session_id -> account from
// its own binding and stamps the owner header itself, fail-closed CodeNotFound
// for an unknown/stopped/dropped session — never a stale account, never the
// bootstrap admin.
message RelayForgeCallRequest {
  string session_id = 1;
  ForgeCallRequest call = 2;   // defined in agent_gateway.proto
}

// RelayForgeCall response: the result of the executed forge call, correlated by
// the same call_id the agent minted. A successful call carries its domain/ack
// result; an in-band tool failure (not_found, rate limit, bad input) carries the
// ForgeCallError variant — NOT a Connect stream error, so a single failed call
// never tears down the transport.
message RelayForgeCallResponse {
  ForgeCallResult result = 1;  // defined in agent_gateway.proto
}

// CommitConversationFrame request: one durable conversation frame the Runner
// forwards for commit. `session_id` is the session the Runner structurally owns
// (resolved to an account Server-side, fail-closed — see the RPC comment).
// `frame` is constrained by the agent side to a conversation_posted /
// conversation_updated / transcript_entry AgentFrame variant (the durable lane
// carries the SEA-1570 transcript entry too; the same C4 constraint Publish
// telemetry frames are held to). `idempotency_key` is the agent-minted envelope
// key reused verbatim from AgentGateway.PostConversationFrameRequest.
message CommitConversationFrameRequest {
  string session_id = 1;
  AgentFrame frame = 2;
  string idempotency_key = 3;
}

// CommitConversationFrame response: the commit outcome for one frame. Named
// `Response` (not `Ack`) to satisfy the STANDARD RPC-response lint runner.proto
// keeps armed; it IS the commit acknowledgement, in its fields.
//   committed  — the frame is durable in the Server store (true on a fresh
//                commit AND on an idempotent replay of an already-committed
//                key; the ack is self-describing so the agent's sink reads the
//                durable boundary from the flag, not by inferring it from the
//                absence of a transport error).
//   message_id — the store-assigned message id of the committed row (stable
//                across idempotent replay).
//   seq        — the durable store-space sequence of the committed row
//                (`messages.seq`, a BIGSERIAL), the replay-stable ordered
//                position. NOT the bus-space SubscribeCommsResponse.seq, which
//                resets to 1 each server boot (comms.proto:372-373) and so is
//                not stable across a restart; the durable coordinate is
//                messages.seq. Stable across idempotent replay. MAY be 0 until
//                the store surfaces a per-row sequence; consumers must not treat
//                0 as a valid head position.
// A NON-commit is surfaced as a Connect status, not committed=false, split by
// retryability so the Runner can drive at-least-once correctly:
//   transient (Unavailable / stream teardown / FailedPrecondition contract
//     defect) -> a RETRYABLE Connect code; the agent's sink retries on the same
//     idempotency_key.
//   permanent (InvalidArgument malformed frame / NotFound unknown-or-stopped
//     session) -> a TERMINAL non-retryable code; the sink drops rather than
//     looping the agent forever.
message CommitConversationFrameResponse {
  bool committed = 1;
  string message_id = 2;
  uint64 seq = 3;
}
