// The compass.v1 host->guest control plane for the V2a microVM runtime spike
// (design docs/designs/infra/runtime/compass-elastic-session-runtime/
// microvm-v2a-guest-image-boot-spike.md, RIG-2588 T3).
//
// INTERNAL-ONLY surface. Unlike compass.proto / comms.proto — the public,
// generated-client door between a UI and the Server — GuestControl is the
// in-guest control plane the HOST dials: the host is the V2a Launch harness
// (later V2b's MicroVMRuntime), the guest is compass-guestd. The channel is
// cloud-hypervisor's hybrid vsock (D1) carrying Connect/h2c (D4): the host
// opens the AF_UNIX endpoint, writes the `CONNECT <port>` preamble, and speaks
// Connect over the transparent byte stream to guestd's generated handler.
//
// It is generated ONLY into the internal Go lane (guestd's handler + the host's
// client via buf.gen.internal-go.yaml -> go/internal/gen), never onto the
// public @compass/client surface or any TS lane — a host<->guest control plane
// is not a server-door client, so the SEA-1267 gen-fence intent holds. The
// public buf.gen.yaml excludes this file; buf.gen.agent-ts.yaml (an allowlist)
// simply never lists it.
//
// Additive and buf-breaking-safe: a new file in the owned `compass.v1` package.
// V2a seeds it with the single spike RPC; V2b grows the service additively
// (Exec/ExecStream/Signal/Provision) with no wire break.
//
// Naming: the service is `GuestControl` (a host-side door onto the guest), not
// a public `*Service`, following the AgentGateway precedent (also a Runner/
// host-side door). Its `SERVICE_SUFFIX` is ignore_only-scoped to this file in
// buf.yaml for exactly that reason. `Health` -> `HealthRequest`/`HealthResponse`
// already satisfies buf's RPC_REQUEST/RESPONSE_STANDARD_NAME — no carve-out.

syntax = "proto3";

package compass.v1;

// service GuestControl — the in-guest control plane the host dials over hybrid
// vsock (D1) with Connect/h2c (D4). V2a seeds it with the single spike RPC; V2b
// grows it additively (Exec/ExecStream/Signal/Provision) with no wire break.
// Suffix-less service name follows the AgentGateway precedent (a Runner/host-side
// door, not a public *Service) — carved out per-file in buf.yaml.
//
// The transport carries no credential over the vsock hop, by design (OQ-A
// resolved, record §(e)): the boundary is structural, not a secret. The host
// owns both ends of the hybrid vsock and the per-session AF_UNIX endpoint lives
// in a runtime dir only the Runner's uid can reach, so "it answered on the
// socket we opened" is the host's proof of the guest's identity. guestd
// independently refuses any vsock peer that is not the host (CID 2), closing the
// in-guest loopback (CID 1). As a cheap binding against a swapped guest, the
// host mints a boot nonce on the kernel cmdline (compass.boot_nonce=<hex>) that
// guestd echoes in HealthResponse.boot_nonce; Start verifies it before opening
// the exec gate. This is an identity binding (right guest on the right socket),
// not a secret channel — any nonce guestd can present, a guest-root attacker can
// read from /proc/cmdline, so a bearer token would buy no boundary the VM +
// socket ownership do not already provide.
service GuestControl {
  rpc Health(HealthRequest) returns (HealthResponse);

  // Exec runs one command to completion and returns its captured output. A
  // non-zero exit is a SUCCESSFUL call whose ExecResponse.exit_code is
  // non-zero — never a Connect error. A Connect error means the exec could not
  // be attempted or could not complete: a spawn failure, a refused uid (0), a
  // timeout, or an unprovisioned gate.
  rpc Exec(ExecRequest) returns (ExecResponse);

  // ExecStream runs a long-lived command over one bidi stream: the request
  // stream carries the start frame, then stdin bytes and an optional
  // half-close; the response stream carries the exec_id, then interleaved
  // stdout/stderr, then exactly one terminal exit frame. Kill rides Signal
  // (below), not this stream, so a teardown never contends with an in-flight
  // stdin write.
  rpc ExecStream(stream ExecStreamRequest) returns (stream ExecStreamResponse);

  // Signal delivers a signal to a running exec by exec_id; an empty exec_id
  // targets the guest itself (graceful Stop, record §(d)). Signalling an
  // already-exited exec is a no-op success.
  rpc Signal(SignalRequest) returns (SignalResponse);

  // Provision transitions the supervisor ready -> provisioned: it records the
  // session's default exec uid and base env and, when nft_script is non-empty,
  // arms egress (V3; a non-empty script is unimplemented in V2b). Exec and
  // ExecStream are refused until Provision succeeds.
  rpc Provision(ProvisionRequest) returns (ProvisionResponse);
}

message HealthRequest {}

message HealthResponse {
  string guestd_version = 1;
  bool net_provisioned = 2;
  bool workspace_mounted = 3;
  // boot_nonce echoes the host-minted compass.boot_nonce cmdline value so Start
  // can bind this guest to the VM it launched before opening the exec gate
  // (record §(e), OQ-A). Empty until V2b guestd parses the cmdline nonce.
  bytes boot_nonce = 4;
}

// ExecRequest is a one-shot exec. It mirrors runtime.ExecSpec field for field.
message ExecRequest {
  // command is argv; command[0] is the program.
  repeated string command = 1;
  // uid is the exec's user. Absent = the session default uid set by Provision
  // (the baked agent uid). uid 0 is REFUSED with a failed-precondition error
  // before any spawn — the guest supervisor never runs an exec as root.
  optional uint32 uid = 2;
  // workdir is the working directory; absent = the child's default.
  optional string workdir = 3;
  // env is merged over the session base env; exec-specific keys win.
  map<string, string> env = 4;
  // stdin is fed to the child's stdin — the body over the wire, NEVER the argv,
  // so a script and any secret it embeds never appear in the guest process
  // list.
  optional bytes stdin = 5;
  // timeout_seconds bounds the command; the guest enforces it too.
  uint32 timeout_seconds = 6;
}

message ExecResponse {
  bytes stdout = 1;
  bytes stderr = 2;
  // exit_code is the command's exit status. Non-zero is a successful call with
  // a failed command, never a Connect error (see the Exec doc-comment).
  int32 exit_code = 3;
}

// ExecStreamRequest frames flow host -> guest: exactly one StartExec first,
// then any number of stdin frames, then an optional StdinClose half-close.
message ExecStreamRequest {
  oneof frame {
    StartExec start = 1;
    bytes stdin = 2;
    StdinClose stdin_close = 3;
  }
}

message StartExec {
  repeated string command = 1;
  // uid as in ExecRequest: absent = session default; 0 REFUSED.
  optional uint32 uid = 2;
  optional string workdir = 3;
  map<string, string> env = 4;
}

// StdinClose half-closes the child's stdin pipe without ending the stream.
message StdinClose {}

// ExecStreamResponse frames flow guest -> host: exactly one ExecStarted first,
// then interleaved stdout/stderr, then exactly one ExecExit.
message ExecStreamResponse {
  oneof frame {
    ExecStarted started = 1;
    bytes stdout = 2;
    bytes stderr = 3;
    ExecExit exit = 4;
  }
}

// ExecStarted is the first response frame; exec_id is the handle Signal targets.
message ExecStarted {
  string exec_id = 1;
}

// ExecExit is the terminal response frame, emitted from guestd's own reap.
message ExecExit {
  // exit_code is meaningful when signal == 0.
  int32 exit_code = 1;
  // signal is non-zero when the child died by signal (e.g. SIGKILL on Kill).
  int32 signal = 2;
}

message SignalRequest {
  // exec_id targets a running exec; "" targets the guest itself (Stop).
  string exec_id = 1;
  // signal is the signal number: SIGKILL for a Kill, SIGTERM for Stop.
  int32 signal = 2;
}

message SignalResponse {}

message ProvisionRequest {
  // nft_script is the egress ruleset (V3, EgressPolicy.NftScript()); empty in
  // V2b, where a non-empty value is unimplemented.
  string nft_script = 1;
  // default_exec_uid is the session's agent uid (ContainerSpec.UID), the
  // default for an exec with no uid. Validated non-zero.
  uint32 default_exec_uid = 2;
  // base_env is the base environment every exec inherits (ContainerSpec.Env).
  map<string, string> base_env = 3;
}

message ProvisionResponse {}
