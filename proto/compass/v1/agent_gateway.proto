// The compass.v1 agent->Runner call transport (design
// docs/designs/product/compass-agent-runner-transport/design.md, SEA-1351 T1).
//
// INTERNAL-ONLY surface. Unlike compass.proto / comms.proto — the public,
// generated-client door between a UI and the Server — AgentGateway is the
// Runner-side LISTENER for calls the in-container first-party agent makes to its
// Runner. It runs the OPPOSITE direction to RunnerService (runner.proto, which
// is Runner->Server dial-out): here the agent is the client and the Runner is
// the server, over a per-container bind-mounted Unix socket (a local hop, no
// network path — the egress seal is untouched). It is generated ONLY into the
// internal lanes (the Runner's Go handler via buf.gen.internal-go.yaml; the
// agent's TS client via buf.gen.agent-ts.yaml), never onto the public client
// surface, so the `@compass/client` server-door fence stays intact (the agent is
// not a server-door client). The gen fan-out that enforces this is a separate
// path-filtered lane; the public buf.gen.yaml excludes this file.
//
// Additive and buf-breaking-safe: a new file in the owned `compass.v1` package,
// not a change to the public messages. `buf lint`/`buf breaking` still cover it
// (they glob `compass/**/*.proto`).
//
// Naming: the service is a `Gateway` (a Runner-side door for agent calls), not a
// public `*Service`, and its sole RPC `Comms` carries the general
// `CommsCallRequest`/`CommsCallResult` envelopes — named for the call family,
// NOT `CommsRequest`/`CommsResponse`, because the SAME messages are reused
// verbatim as the `RelayCommsCallRequest.call` / `RelayCommsCallResponse.result`
// payloads on the Runner->Server leg (runner.proto RelayCommsCall). Sharing one
// envelope across both hops is the point; renaming per-RPC would fork the wire.
// buf's SERVICE_SUFFIX / RPC_REQUEST_STANDARD_NAME / RPC_RESPONSE_STANDARD_NAME
// are ignore_only-scoped to this file in buf.yaml for exactly that reason.

syntax = "proto3";

package compass.v1;

import "compass/v1/comms.proto";
// AgentFrame (Publish/PostConversationFrame payload) + AgentControl (the
// Control server-stream message) live in agent.proto; the gateway carries them.
import "compass/v1/agent.proto";
// The forge carrier result arms retype to the canonical compass.v1 types
// (Issue/PullRequest/ChecksSummary), and the shared CommentRef/ForgeArtifactKind
// live in the forge.proto leaf (DL-069, DL-092). Importing forge.proto here is
// acyclic: forge.proto imports only compass.proto, never this file.
import "compass/v1/compass.proto";
import "compass/v1/forge.proto";

// agent -> Runner, unary. The agent emits a correlated comms call; the Runner
// forwards it to the Server (RelayCommsCall) tagged with the session it
// structurally owns (the one session bound to the per-container socket the call
// arrived on). The Runner resolves NO account and asserts NO account identity;
// the Server resolves session_id -> account from its own Provision-originated
// binding and attributes in-process, fail-closed (design Decision #3, OQ-2).
// INTERNAL surface (never public gen).
service AgentGateway {
  rpc Comms(CommsCallRequest) returns (CommsCallResult);  // frozen T1, unchanged

  // Lifecycle (unary, agent -> Runner): spawn or despawn a peer agent. A
  // sibling call family to Comms (DL-049 shape) — the LifecycleCallRequest /
  // LifecycleCallResult envelopes are reused verbatim as the
  // RelayLifecycleCallRequest.call / RelayLifecycleCallResponse.result payloads
  // on the Runner->Server leg (runner.proto RelayLifecycleCall). One shared
  // envelope across both hops. INTERNAL surface (never public gen).
  rpc Lifecycle(LifecycleCallRequest) returns (LifecycleCallResult);
  // agent -> Runner, client-stream: the loss-tolerable telemetry spine. Every
  // TRACE and SESSION AgentFrame rides it in emission order. Replaces the
  // stdout relay's trace/session half. The Runner assigns the upstream sequence
  // (PublishEvents RunnerSeq), so the request carries no seq of its own.
  rpc Publish(stream PublishFrameRequest) returns (PublishFrameResponse);
  // agent -> Runner, UNARY, delivered-or-erred: the durable conversation-frame
  // path (consolidation OQ-2(c)). conversation_posted / conversation_updated
  // ride THIS, not Publish — request/response so an agent-side drop is an ERROR
  // the agent retries (with a stable idempotency_key, so a commit whose response
  // was lost is deduped on retry, never duplicated), never a silent gapless loss.
  rpc PostConversationFrame(PostConversationFrameRequest) returns (PostConversationFrameResponse);
  // agent-opened server-stream: the control lane. The agent opens it at boot and
  // the Runner pushes one AgentControl per message. Replaces the never-built
  // stdin decoder.
  rpc Control(ControlSubscribeRequest) returns (stream AgentControl);

  // Forge (unary, agent -> Runner): create/comment/read a forge issue or PR, or
  // subscribe/unsubscribe an artifact. A sibling call family to Comms and
  // Lifecycle (DL-049 shape) — the ForgeCallRequest / ForgeCallResult envelopes
  // are reused verbatim as the RelayForgeCallRequest.call /
  // RelayForgeCallResponse.result payloads on the Runner->Server leg
  // (runner.proto RelayForgeCall). One shared envelope across both hops. The
  // Runner asserts NO account; the Server resolves session_id -> account and
  // stamps the owner header itself (DL-050), holding the sole forge write
  // credential (DL-052). Read ops are answered from the projection/store, not a
  // live forge proxy (DL-069 amendment §Resolved decisions OQ-A). INTERNAL
  // surface (never public gen).
  rpc Forge(ForgeCallRequest) returns (ForgeCallResult);

  // Board (unary, agent -> Runner): write an issue's canonical lifecycle state.
  // A sibling call family to Comms/Lifecycle/Forge (DL-049 shape) — the
  // BoardCallRequest / BoardCallResult envelopes are reused verbatim as the
  // RelayBoardCallRequest.call / RelayBoardCallResponse.result payloads on the
  // Runner->Server leg (runner.proto RelayBoardCall). One shared envelope across
  // both hops. The Runner asserts NO account; the Server resolves session_id ->
  // account and runs the transition under that caller (single-trust-domain MVP,
  // amendment §Resolved decisions 2). INTERNAL surface (never public gen).
  rpc Board(BoardCallRequest) returns (BoardCallResult);
}

// One agent-initiated comms call. `call_id` is the agent-minted correlation id
// (the SDK toolCallId); the `call` oneof selects the comms operation. The same
// message is the `RelayCommsCallRequest.call` payload on the Runner->Server leg.
message CommsCallRequest {
  string call_id = 1;
  oneof call {
    PostMessageRequest post = 2;
    ListMessagesRequest list = 3;
    GetRosterRequest roster = 4;
    SetAgentStatusRequest set_status = 5;
    UpdatePinnedBoardRequest pin = 6;
  }
  // The W3C `traceparent` of the delivered message that triggered this outbound
  // call, re-attached by the agent so the Server can LINK the reply's fresh
  // trace back to its trigger — a trace terminates at the turn, and a reply is
  // a new root causally linked to the message it answers, not a child span that
  // would grow an unbounded conversation tree. W3C format
  // `00-<32hex trace-id>-<16hex span-id>-<2hex flags>`; EMPTY on a human-seeded
  // first turn (no triggering message). Field 10 leaves 7-9 for the in-flight
  // org-management oneof arms (RIG-2673); numbers are frozen (DL-186/OQ-1b).
  // Server-side link per
  // docs/designs/platform/compass-server-runner-otel/design.md.
  string trigger_traceparent = 10;
}

// The result of one comms call, correlated by `call_id`. A successful call sets
// `post`/`list`; an in-band failure (a tool error — non-member channel, bad
// input) sets `error`, which is NOT a transport teardown. The same message is
// the `RelayCommsCallResponse.result` payload on the Runner->Server leg.
message CommsCallResult {
  string call_id = 1;
  oneof result {
    PostMessageResponse post = 2;
    ListMessagesResponse list = 3;
    CommsCallError error = 4;
    GetRosterResponse roster = 5;
    SetAgentStatusResponse set_status = 6;
    UpdatePinnedBoardResponse pin = 7;
  }
}

// An in-band comms-call failure: a tool error the agent renders to the model,
// never a stream teardown. `code` is a short stable token (e.g. "not_found");
// `message` is human-readable detail.
message CommsCallError {
  string code = 1;
  string message = 2;
}

// Set the calling agent's activity note (agent-only, via the relay — no public
// CommsService RPC). The presence enum stays session-derived; this carries only
// the human-readable activity string the roster and live streams surface.
message SetAgentStatusRequest {
  string activity = 1;
}

// Empty: the activity write is acknowledged by a non-error result.
message SetAgentStatusResponse {}

// One agent-initiated lifecycle call (spawn/despawn a peer). `call_id` is the
// agent-minted correlation id (the SDK toolCallId); the `call` oneof selects the
// operation. Mirrors CommsCallRequest — the same message is the
// RelayLifecycleCallRequest.call payload on the Runner->Server leg, one shared
// envelope across both hops.
message LifecycleCallRequest {
  string call_id = 1;
  oneof call {
    SpawnPeerRequest spawn = 2;
    DespawnPeerRequest despawn = 3;
  }
}

// Spawn a peer agent, owned by the caller agent's owner (F2 ownership frame).
// Names the new agent's identity and its initial prompt — never a repo/ref
// (spawn carries no repo, Matt 2026-07-29; the peer self-clones after launch).
message SpawnPeerRequest {
  string handle = 1;               // the new agent's account handle (unique)
  string display_name = 2;
  reserved 3;
  reserved "initial_prompt";
  string client_request_id = 4;    // whole-chain idempotency key (handler-level join + Provision dedup)
}
message SpawnPeerResponse {
  string agent_account_id = 1;
  string container_name = 2;
  string session_id = 3;
}

// Despawn a peer: tear down its container and release its durable placement.
// Same-owner authority (F2); the account row, home channel, and history survive
// (despawn tears down compute, not identity).
message DespawnPeerRequest {
  string agent_handle = 1;         // the peer to tear down; a `@handle` the server resolves to an account id; unknown → NOT_FOUND
}
message DespawnPeerResponse {}

// The result of one lifecycle call, correlated by `call_id`. A successful call
// sets `spawn`/`despawn`; an in-band tool failure sets `error` (same shape as
// CommsCallError), which is NOT a transport teardown. The same message is the
// RelayLifecycleCallResponse.result payload on the Runner->Server leg.
message LifecycleCallResult {
  string call_id = 1;
  oneof result {
    SpawnPeerResponse spawn = 2;
    DespawnPeerResponse despawn = 3;
    LifecycleCallError error = 4;
  }
}

// An in-band lifecycle-call failure: a tool error the agent renders to the
// model, never a stream teardown. `code` is a short stable token (e.g.
// "not_found", "already_exists", "invalid_argument"); `message` is detail.
message LifecycleCallError {
  string code = 1;
  string message = 2;
}

// One agent-initiated forge call. `call_id` is the agent-minted correlation id
// (the SDK toolCallId); the `call` oneof selects the forge operation. Mirrors
// CommsCallRequest / LifecycleCallRequest — the same message is the
// RelayForgeCallRequest.call payload on the Runner->Server leg, one shared
// envelope across both hops (DL-049).
message ForgeCallRequest {
  string call_id = 1;
  oneof call {
    CreateIssueRequest create_issue = 2;
    CommentOnIssueRequest comment_on_issue = 3;
    GetIssueRequest get_issue = 4;
    ListIssuesRequest list_issues = 5;
    CreatePullRequestRequest create_pull_request = 6;
    CommentOnPullRequestRequest comment_on_pull_request = 7;
    GetPullRequestRequest get_pull_request = 8;
    SubscribeForgeRequest subscribe = 9;      // DL-053
    UnsubscribeForgeRequest unsubscribe = 10; // DL-053
    SubmitReviewRequest submit_review = 11;
  }
  // Which forge the call addresses. UNSET selects the default (configured
  // GitHub) forge — additive, existing callers unchanged. An unknown/unconfigured
  // coordinate is an in-band not_found ForgeCallError; an EMPTY host means the
  // selected provider's default host (A3) — never a panic, never a silent
  // provider fall-through.
  compass.v1.ForgeRef forge = 12;
  // Whole-chain idempotency key for the CREATE arms (create_issue /
  // create_pull_request) — the SpawnPeerRequest.client_request_id precedent
  // (agent_gateway.proto:172 "whole-chain idempotency key (handler-level
  // join + Provision dedup)"). A retried create with the same key returns the
  // ORIGINAL artifact, never a duplicate. Distinct from call_id, which is
  // correlation-only. Ignored on non-create arms. Field 13 is collision-free:
  // call_id=1, oneof arms 2-11, forge=12.
  string client_request_id = 13;
}

// The result of one forge call, correlated by `call_id`. Per DL-069 no raw forge
// shape is a wire type: the domain result arms retype to the canonical compass.v1
// types (DL-092 supersedes #995's forge-shaped Issue/PullRequest domain messages),
// and the comment arms take the CommentRef reference (forge.proto). A successful
// call sets one domain/ack arm; an in-band failure (a tool error — not_found,
// rate limit, bad input) sets `error`, which is NOT a transport teardown.
message ForgeCallResult {
  string call_id = 1;
  oneof result {
    compass.v1.Issue issue = 2;             // create_issue / get_issue
    CommentRef issue_comment = 3;           // comment_on_issue (write ack: url + comment_id)
    ListIssuesResponse issues = 4;          // list_issues
    compass.v1.PullRequest pull_request = 5; // create_pull_request / get_pull_request
    CommentRef pr_comment = 6;              // comment_on_pull_request (write ack)
    SubscribeForgeResponse subscribed = 7;
    UnsubscribeForgeResponse unsubscribed = 8;
    ForgeCallError error = 9;
    ReviewRef review = 10;         // submit_review (write ack: url + review_id)
  }
}

// An in-band forge-call failure: a tool error the agent renders to the model,
// never a transport teardown. Mirrors CommsCallError and adds `retry_after_ms`
// because a forge, unlike the in-process comms handler, rate-limits.
message ForgeCallError {
  string code = 1;            // Connect status token, e.g. "not_found", "resource_exhausted"
  string message = 2;
  uint32 retry_after_ms = 3;  // 0 when the forge gave no hint
}

// The seven forge operation requests. Every field is a scalar — no forge domain
// type appears in any request shape, so the request wire is identical under
// either forge read model. `repo` is "<owner>/<name>" on GitHub and the team
// key on Linear, REQUIRED on every call — an empty `repo` is an invalid_argument
// ForgeCallError, never a default (an agent is bound to no single repo, so there
// is nothing to infer). Request addressing is single-forge for a GitHub-first v1
// (repo unambiguous); an optional ForgeRef is a named additive follow-up. The
// write requests carry the body WITHOUT the owner header — the Server stamps it.
message CreateIssueRequest {
  string repo = 1;               // REQUIRED; empty is invalid_argument
  string title = 2;
  string body = 3;               // WITHOUT the owner header; the Server stamps it
  repeated string labels = 4;
}
message CommentOnIssueRequest {
  string repo = 1;
  uint64 issue_number = 2;
  string body = 3;               // WITHOUT the owner header
}
message GetIssueRequest {
  string repo = 1;
  uint64 issue_number = 2;
}
message ListIssuesRequest {
  string repo = 1;
  string state = 2;              // "" = open
  repeated string labels = 3;
  uint32 limit = 4;              // 0 = server default (30), capped at 100
}
message ListIssuesResponse {
  repeated compass.v1.Issue issues = 1;
}
message CreatePullRequestRequest {
  string repo = 1;
  string title = 2;
  string body = 3;               // WITHOUT the owner header
  string head_ref = 4;           // the branch the agent already pushed with ITS OWN git creds
  string base_ref = 5;           // empty = the repo default branch
  bool draft = 6;
}
message CommentOnPullRequestRequest {
  string repo = 1;
  uint64 pull_number = 2;
  string body = 3;               // WITHOUT the owner header
}
message GetPullRequestRequest {
  string repo = 1;
  uint64 pull_number = 2;
}
message SubmitReviewRequest {
  string repo = 1;               // REQUIRED; empty is invalid_argument
  uint64 pull_number = 2;
  string verdict = 3;            // "approve" | "request_changes" | "comment"
  string body = 4;               // WITHOUT the owner header; the Server stamps it
  repeated ReviewCommentInput comments = 5;  // inline comments; may be empty
}
message ReviewCommentInput {
  string path = 1;               // REQUIRED
  uint32 line = 2;               // new-file line number (GitHub `line`)
  string side = 3;               // "LEFT" | "RIGHT"; "" = RIGHT
  string body = 4;               // NOT stamped (rides inside the stamped review)
}

// Subscribe/unsubscribe a forge artifact for change notifications (DL-053). The
// notification payload is ForgeNotification (forge.proto), delivered on the
// Sessions -> AgentGateway.Control push path.
// The subscription scope (W2, decided (b): the number=0 sentinel is dropped;
// OQ-1 ruled (i)). ARTIFACT addresses one issue/PR; CONTAINER addresses the
// whole repo on GitHub or a PROJECT on Linear. Zero is treated as ARTIFACT for
// pre-scope callers.
enum ForgeSubscriptionScope {
  FORGE_SUBSCRIPTION_SCOPE_UNSPECIFIED = 0; // treated as ARTIFACT (pre-scope callers)
  FORGE_SUBSCRIPTION_SCOPE_ARTIFACT = 1;    // one issue/PR; number REQUIRED (> 0)
  FORGE_SUBSCRIPTION_SCOPE_CONTAINER = 2;   // GitHub: the whole repo; Linear: a PROJECT
}
message SubscribeForgeRequest {
  string repo = 1;                   // GitHub owner/name; Linear team key
  ForgeArtifactKind kind = 2;
  uint64 number = 3;                 // ARTIFACT only; MUST be 0 under CONTAINER
  ForgeSubscriptionScope scope = 4;  // additive; UNSPECIFIED = ARTIFACT
  string project = 5;                // CONTAINER on LINEAR only: the project id
}
message SubscribeForgeResponse {
  string subscription_id = 1;
}
message UnsubscribeForgeRequest {
  string subscription_id = 1;
}
message UnsubscribeForgeResponse {}

// One agent-initiated board call. `call_id` is the agent-minted correlation id
// (the SDK toolCallId); the `call` oneof selects the board operation. Mirrors
// CommsCallRequest / ForgeCallRequest — the same message is the
// RelayBoardCallRequest.call payload on the Runner->Server leg, one shared
// envelope across both hops (DL-049).
message BoardCallRequest {
  string call_id = 1;
  oneof call {
    SetIssueStateRequest set_issue_state = 2;
  }
}

// Set an issue's canonical lifecycle state. Carries the full frozen
// UpdateIssueState semantics re-homed (compass-issue-model/design.md:474-511):
// any of the eight real states is a legal target (any-to-any; DL-033's arrows
// are normative flow, not server-enforced), ISSUE_STATE_UNSPECIFIED is an
// in-band invalid_argument, a target equal to the current state is an idempotent
// no-op returning current truth, ISSUE_STATE_ARCHIVED is just a target state
// (DL-091's archive-is-a-transition ruling survives on this surface).
message SetIssueStateRequest {
  string issue_id = 1;                  // the Compass-local id (Issue.id)
  compass.v1.IssueState state = 2;      // target; UNSPECIFIED -> in-band invalid_argument
}
// The post-transition truth, correlated in BoardCallResult. Unchanged on a no-op.
message SetIssueStateResponse {
  compass.v1.Issue issue = 1;
}

// The result of one board call, correlated by `call_id`. A successful call sets
// `set_issue_state`; an in-band failure (a tool error — not_found,
// invalid_argument) sets `error`, which is NOT a transport teardown. Same shape
// as CommsCallError / ForgeCallError.
message BoardCallResult {
  string call_id = 1;
  oneof result {
    SetIssueStateResponse set_issue_state = 2;
    BoardCallError error = 3;
  }
}

// An in-band board-call failure: a tool error the agent renders to the model,
// never a transport teardown. `code` is a short stable token ("not_found",
// "invalid_argument"); `message` is human-readable detail.
message BoardCallError {
  string code = 1;
  string message = 2;
}

// Publish stream element: one trace/session AgentFrame, in emission order. No
// seq field — the Runner assigns the upstream PublishEvents RunnerSeq. The
// durable conversation frames do NOT ride this stream; they take the correlated
// PostConversationFrame unary.
message PublishFrameRequest {
  AgentFrame frame = 1;  // trace/session only
}
// Acked at stream close, mirroring RunnerService.PublishEvents' PublishEventsResponse.
message PublishFrameResponse {}

// The durable-frame unary carries the SAME AgentFrame message, constrained by
// the agent side to a conversation_posted / conversation_updated variant,
// plus an agent-minted idempotency_key. Runner-sequenced upstream through the
// same ordered per-session publisher as Publish frames, so hub gap-detection is
// identical; the difference is delivered-or-erred to the agent.
message PostConversationFrameRequest {
  AgentFrame frame = 1;
  // Agent-minted, stable across retries of the same logical frame; the Runner
  // commits at-most-once per key so a lost-response retry is not duplicated. An
  // ENVELOPE field (dedup), not a payload field — SEA-1310's parked payload
  // decision is untouched.
  string idempotency_key = 2;
}
// Returned only after the upstream PublishEvents forward is accepted.
message PostConversationFrameResponse {}

// The Control subscribe request carries no session id: the per-container socket
// the call arrives on IS the session identity (frozen Decision #4).
message ControlSubscribeRequest {}
