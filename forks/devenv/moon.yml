# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# devenv (forks/devenv): vendored fork of cachix/devenv. The fork CARRIES a
# sealed diff — the per-container `user`/`group`/`homeDir` options, the
# conditional `$HOME` staging, the `DEVENV_`-prefix `imageEnv` filter, and the
# removal of the `DEVENV_CONTAINER` env lookup, all in
# `src/modules/containers.nix` (see forks/README.md § devenv).
# Style-gate-exempt vendored code (`forks/*/**` exclusions); this moon.yml is the
# sealed-added functional-CI registration. It is the one sealed file inside the
# subtree — a declared Copybara export-exclusion and excluded from the import
# byte-fidelity diff.
#
# WHAT GATES THE SEALED DIFF — and what does not. This repo has no CI: nothing
# executes the tasks below, so they gate nothing here today. Even once something
# runs them, they run the fork's OWN upstream suite (`nix build -L` over the
# flake) — that gates the fork as upstream ships it and proves the tree with
# sealed's changes still evaluates, but it does NOT exercise the sealed-added
# container behavior: nothing builds a container with a moved `homeDir`, and the
# only consumer of those options — `agent-image` — is not a registered moon
# project. So a defect confined to the sealed `containers.nix` logic is caught
# by manual verification alone. A reflow inside a `runCommand` body already
# reached review that way; prefer a mechanical check over a re-asserted claim.
#
# devenv builds through nix (a flake); its Rust crates compile via the flake's
# fenix toolchain, not the repo's own cargo, so tasks are nix-driven, not bare
# `cargo`. Inputs are scoped to this subtree so a fork-only change schedules only
# these tasks and a change elsewhere never marks devenv affected.
layer: 'application'
language: 'nix'
tags: ['oss']

workspace:
  inheritedTasks:
    # tag-bun contributes exactly one inherited task, `install` (a no-op
    # depending on the single root:install). This vendored nix fork is not a bun
    # package, so that install must not run here. `lint` and `format` are
    # whole-repo tasks on the root project, never inherited, so those two
    # entries are no-ops today — kept as a defensive guard in case tag-bun.yml
    # later grows tasks a vendored tree must not run.
    exclude: ['install', 'lint', 'format']

fileGroups:
  sources: ['**/*']

tasks:
  # Build devenv from its flake — the upstream CI's canonical build step
  # (.github/workflows/test.yml: `nix build -L`). Proves the fork tree evaluates
  # and compiles (Rust crates via the flake's fenix pin) against sealed CI's nix.
  # cache:false: nix has its own store-path caching; moon must not false-green a
  # build it did not re-run (same posture as infra/nix flake-eval-*).
  build:
    command: 'nix build -L --no-link --print-out-paths --accept-flake-config'
    options:
      cache: false
      runInCI: true
    inputs: ['@group(sources)']

  ci:
    deps: ['build']
    options:
      cache: false
      runInCI: true
