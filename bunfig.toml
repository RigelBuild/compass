# Supply-chain timing defense for the root bun workspace: refuses to install a
# package version published less than 5 days ago. `bun install` runs from this
# root (the workspace lockfile is /bun.lock), and Bun reads bunfig from the
# install dir (not parent dirs), so the guard lives here rather than per-project.
[install]
minimumReleaseAge = 432000
# @tanstack/virtual-core is pinned to 3.17.5 via root `overrides` — the chat-mode
# scroll floor the compass message-surface renderer requires (the end-anchored
# anchorTo:'end'+followOnAppend path needs the 3.17.5 anchor-offset clamp). That
# exact version is exempted from the 5-day cooldown because the floor is a
# reviewed, record-mandated pin, not an unvetted float; the exact-version
# exclude keeps the exemption from covering any other virtual-core release.
# @types/bun (and its lockstep transitive bun-types) tracks the bun runtime,
# which is itself a first-party, nix-pinned (tools/toolchain/versions/bun.nix)
# toolchain version — not an unvetted registry float. A toolchain bump lands the
# runtime and its types in lockstep, so the 5-day soak (a supply-chain guard
# against freshly-published untrusted packages) is the wrong policy for them: it
# would strand the types packages behind the pin for 5 days on every bun upgrade.
# Exempting the exact names keeps the global cooldown intact for everything else.
minimumReleaseAgeExcludes = [
  "@tanstack/virtual-core",
  "@types/bun",
  "bun-types",
]
