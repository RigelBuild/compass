# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
layer: 'tool'
language: 'typescript'
tags: ['bun', 'oss', 'ci-group.bun']

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock', '/.github/workflows/ci.yml']
  test:
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock', '/.github/workflows/ci.yml']
  ci:
    deps: ['typecheck', 'test']
    options:
      cache: false
