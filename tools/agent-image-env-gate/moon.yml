# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# agent-image-env-gate (RIG-1444) — assert the built compass-agent image is not
# a wrong-image build. The `compass-agent-image` project proves the image
# REALISES; this gate proves it is CORRECT. Three wrong-image defects have
# shipped through a green `container build`, each caught only by hand-inspecting
# the image: a build-host home path baked into DEVENV_ROOT, a DEVENV_ROOT=/env
# the image does not carry, and a stale DEVENV_CONTAINER corrupting an unrelated
# image. All three leave the same fingerprint — a DEVENV_-prefixed key surviving
# the fork's `imageEnv` filter (forks/devenv/src/modules/containers.nix) into the
# image's OCI config.Env. This gate inspects that config and fails on it, plus
# on a platform-contract (linux/amd64) drift.
#
# A bun/TypeScript CLI; a hoisted root-workspace member (`bun` tag): install is
# inherited via .moon/tasks/tag-bun.yml and lint/format are whole-repo tasks on
# the root project (/moon.yml), so this leaf has no own bun.lock.
#
# Compass CI is a single moon-driven `CI` job (.github/workflows/ci.yml runs
# `moon run :ci`), so the `ci` aggregate below is swept automatically.
layer: 'tool'
language: 'typescript'
tags: ['bun']

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', 'package.json', '/bun.lock']
  test:
    # The pure core (env-check.ts) over fixtures for each wrong-image defect.
    command: 'bun test'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', 'package.json', '/bun.lock']
  check:
    # The real gate: build the exact spec the publish lane ships, inspect its
    # OCI config, and assert env-cleanliness + platform. Depends on
    # compass-agent-image:build so the realise is ordered first and this task is
    # scheduled by the SAME affected-detection (a closure change reds both); the
    # index.ts `nix run … container build` is then a store cache hit. Run from
    # the workspace root (index.ts cd's into agent-image/ itself for the
    # path:../forks/* flake refs to resolve).
    command: 'bun run tools/agent-image-env-gate/index.ts'
    deps: ['install', 'compass-agent-image:build']
    options:
      runFromWorkspaceRoot: true
      # Never cache: nix owns the build's caching, and the gate's subject is the
      # freshly realised image — a cached green from another checkout is the
      # false-green a fail-closed gate exists to stop.
      cache: false
    # MIRRORS agent-image/moon.yml's build inputs (the reviewed source of truth
    # for what changes the image), so this env assertion runs on exactly the PRs
    # that can change the image. A leading `/` is workspace-root-relative; the
    # bare glob is this gate's own tree.
    inputs:
      - '**/*'
      - '/agent-image/**'
      - '/packages/compass-agent/**'
      - '/forks/devenv/**'
      - '/forks/nix2container/**'
      - '/package.json'
      - '/bun.lock'
      - '/tools/toolchain/versions/bun.nix'
  ci:
    deps: ['typecheck', 'test', 'check']
    options:
      cache: false
