# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# The toolchain parity gate (tools/toolchain). Asserts that the toolchain the
# runner has on PATH is the toolchain the dev shell defines — the
# devenv.lock-pinned nix derivations: the bun/node/moon/go language toolchains
# and the nixpkgs tools alongside them.
#
# It is a moon project, not a bare workflow step, for two reasons. Its pure half
# is real logic that must itself be gated (`test`, `typecheck` below) — an
# unverified gate is not a gate. And running it through `:ci` means the pre-push
# hook checks parity too, so a contributor whose PATH has drifted finds out
# before pushing rather than from a red run.
layer: 'tool'
language: 'typescript'
tags: ['bun', 'oss']

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', '/bun.lock']

  test:
    command: 'bun test'
    deps: ['install']
    # ci.yml and pgtest.go are inputs because a test below asserts their two
    # Postgres image digests are equal. Without them an edit to either file
    # leaves this task cached, so the assertion silently stops re-running
    # against the thing it constrains.
    inputs: ['*.ts', '/bun.lock', '/.github/workflows/ci.yml', '/go/internal/pgtest/pgtest.go']

  parity:
    # The gate itself. cache:false and no `inputs`: its verdict is a function of
    # the PATH it runs under, not of any file in the tree, so a cached green from
    # a different environment is exactly the false pass it exists to reject.
    command: 'bun tools/toolchain/parity.ts'
    options:
      runFromWorkspaceRoot: true
      cache: false

  ci:
    deps: ['typecheck', 'test', 'parity']
    options:
      cache: false
