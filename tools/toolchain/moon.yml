# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# The toolchain parity gate (tools/toolchain). Asserts that the toolchain the
# runner has on PATH is the toolchain the dev shell defines — the
# devenv.lock-pinned nix derivations: the bun/node/moon/go language toolchains
# and the nixpkgs tools alongside them.
#
# It is a moon project, not a bare workflow step, for two reasons. Its pure half
# is real logic that must itself be gated (`test`, `typecheck` below) — an
# unverified gate is not a gate. And running it through `:ci` means the pre-push
# hook checks parity too, so a contributor whose PATH has drifted finds out
# before pushing rather than from a red run.
layer: 'tool'
language: 'typescript'
tags: ['bun', 'oss', 'ci-group.bun']

# The ci-matrix generator computes a PR's affected set with
# `moon query projects --affected`, which walks the PROJECT graph only — a
# project is affected when its own tree or a project it `dependsOn` changed. It
# NEVER consults a project's cross-tree task `inputs` globs (the same mechanism
# tools/flake-gate/moon.yml:31-46 documents and works around). Several tasks
# here assert ABOUT files in `root`'s tree — the two Postgres image digests in
# .github/workflows/ci.yml, and the version.txt guards this project lifts out
# of flake.nix and devenv.nix — so without this edge a PR touching only those
# files leaves toolchain-parity unaffected and never schedules `test` at all.
# The `inputs:` globs stay the true cache closure; this edge is what gets the
# task SCHEDULED in the first place.
dependsOn:
  - 'root'

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', '/bun.lock']

  test:
    # The non-`*.ts` inputs are files that tests below assert *about*, so an
    # edit to one must invalidate this task — otherwise it stays cached and the
    # assertion silently stops re-running against the thing it constrains.
    # ci.yml + pgtest.go: a test asserts their two Postgres image digests are
    # equal. flake.nix + devenv.nix: version-guard-core.test.ts lifts the real
    # version.txt guards out of both and asserts they are still extractable.
    inputs:
      - '*.ts'
      - '/bun.lock'
      - '/.github/workflows/ci.yml'
      - '/go/internal/pgtest/pgtest.go'
      - '/flake.nix'
      - '/devenv.nix'

  parity:
    # The gate itself. cache:false and no `inputs`: its verdict is a function of
    # the PATH it runs under, not of any file in the tree, so a cached green from
    # a different environment is exactly the false pass it exists to reject.
    command: 'bun tools/toolchain/parity.ts'
    options:
      runFromWorkspaceRoot: true
      cache: false

  ci:
    deps: ['typecheck', 'test', 'parity']
    options:
      cache: false
