# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# The devenv-CLI source tool (RIG-2546). The single place that resolves the
# devenv CLI source from a named devenv.lock: parse `.nodes.devenv.locked` →
# `github:<owner>/<repo>/<rev>#devenv`, and (mode=bin-dir) realize it and expose
# a single-binary shim dir. Shared by .github/workflows/renovate.yml (PATH) and
# ci.yml (nix run) so neither carries a hand-pinned rev or its own jq/nix blob.
#
# A moon project, not a bare workflow step, for the same reason as the parity
# gate: its pure half is real logic that must itself be gated (`test`,
# `typecheck` below) — an unverified helper both workflows depend on is a
# liability. The parity task is intentionally absent; this tool is not the
# parity gate.
layer: 'tool'
language: 'typescript'
tags: ['bun', 'oss', 'ci-group.bun']

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', '/bun.lock']

  test:
    command: 'bun test'
    deps: ['install']
    inputs: ['*.ts', '/bun.lock']

  ci:
    deps: ['typecheck', 'test']
    options:
      cache: false
