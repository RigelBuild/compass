# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# sea-ref-gate (RIG-2804) — fail-closed check that the compass tree carries no
# retired SEA-NNN issue reference (the Linear team key is RIG, numbers preserved
# 1:1). A bun/TypeScript CLI; a hoisted root-workspace member (`bun` tag):
# install is inherited via .moon/tasks/tag-bun.yml (the shared root install) and
# lint/format are whole-repo tasks on the root project (/moon.yml), so this leaf
# has no own bun.lock and never runs its own install.
#
# Compass CI is a single moon-driven job (.github/workflows/ci.yml runs
# `moon run :ci`), so the `ci` aggregate below is swept automatically.
layer: 'tool'
language: 'typescript'
tags: ['bun', 'ci-group.bun']

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', 'package.json', '/bun.lock']
  test:
    command: 'bun test'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', 'package.json', '/bun.lock']
  check:
    # The boundary gate: scan the whole tracked tree (via git grep) for any
    # retired SEA-NNN issue ref. Run from the workspace root so the scan and
    # carve-out prefixes resolve repo-relative.
    command: 'bun run tools/sea-ref-gate/index.ts'
    deps: ['install']
    options:
      runFromWorkspaceRoot: true
      # Never cache: the gate's subject is the live tracked tree, and a cached
      # green from another checkout is the false-green a fail-closed gate exists
      # to stop.
      cache: false
    inputs:
      - '/**/*'
      - 'index.ts'
  ci:
    deps: ['typecheck', 'test', 'check']
    options:
      cache: false
