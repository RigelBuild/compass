# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# font-coverage-gate (RIG-3603 T8) — fail when rendered UI source uses a
# character absent from the branded body face. Findings are enforced against
# Space Mono (--rigel-mono, what body text resolves to); Departure Mono is
# parsed and plausibility-checked as a format-12 / parser sanity check, not as
# part of the covered set. T8 is complete: ERROR is the default and this check
# is fail-closed. WARN is available only as an explicit non-blocking opt-in via
# FONT_COVERAGE_GATE=warn.
#
# A bun/TypeScript CLI; a hoisted root-workspace member (`bun` tag): install is
# inherited via .moon/tasks/tag-bun.yml (the shared root install) and
# lint/format are whole-repo tasks on the root project (/moon.yml), so this leaf
# has no own bun.lock and never runs its own install.
#
# Wired into the `:ci` aggregate's red path: `check` is fail-closed by default
# and exits 1 for uncovered rendered characters. Invalid or unset mode values
# also resolve to ERROR; WARN requires an explicit FONT_COVERAGE_GATE=warn.
layer: 'tool'
language: 'typescript'
tags: ['bun', 'ci-group.bun']

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs:
      - '*.ts'
      - 'tsconfig.json'
      - '/tsconfig.base.json'
      - 'package.json'
      - '/bun.lock'
      - '/apps/eng-docs/public/fonts/SpaceMono-Regular.ttf'
      - '/apps/eng-docs/public/fonts/DepartureMono-Regular.otf'
  test:
    inputs:
      - '*.ts'
      - 'tsconfig.json'
      - '/tsconfig.base.json'
      - 'package.json'
      - '/bun.lock'
      - '/apps/eng-docs/public/fonts/SpaceMono-Regular.ttf'
      - '/apps/eng-docs/public/fonts/DepartureMono-Regular.otf'
  check:
    # The coverage gate: parse the branded font cmaps and scan the real
    # apps/ui/src tree for rendered characters Space Mono lacks. Run from the
    # workspace root so the globs resolve repo-relative (GATE_ROOT defaults to
    # the git toplevel = workspace root). Distinct from `test`, which drives
    # the pure core over fixtures; this observes the real tree and real fonts.
    command: 'bun run tools/font-coverage-gate/index.ts'
    deps: ['install']
    options:
      runFromWorkspaceRoot: true
      # Never cache: the gate's subject is the live apps/ui/src tree and the
      # real font files, and a cached green from another checkout is the
      # false-green a coverage gate exists to stop.
      cache: false
    inputs:
      - '/apps/ui/src/**/*.ts'
      - '/apps/ui/src/**/*.tsx'
      - '/apps/eng-docs/public/fonts/SpaceMono-Regular.ttf'
      - '/apps/eng-docs/public/fonts/DepartureMono-Regular.otf'
      - 'index.ts'
  ci:
    deps: ['typecheck', 'test', 'check']
    options:
      cache: false
