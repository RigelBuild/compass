# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# The repo-root flake gate (design record compass-distribution §T6). Two checks
# on the /flake.nix distribution surface:
#
#   flake-check   `nix flake check` — the flake evaluates and every package
#                 (compass{,-server,-runner,-stack}, compass-app, compass-ui,
#                 the compass-stack-env) builds from a bare checkout.
#   flake-parity  the nixpkgs-pin parity gate (tools/toolchain/flake-parity.ts):
#                 flake.lock's nixpkgs rev must equal devenv.lock's. The flake
#                 carries its OWN lock, a SECOND independent nixpkgs pin, so a
#                 devenv pin bump silently skews it — this gate turns the drift
#                 into a red check, keeping the flake-built ≡ bundle-built "one
#                 closure" claim honest. (The parity script's PURE core is
#                 unit-tested under toolchain-parity:test.)
#
# A moon project, not a bare workflow step, so both checks ride the affected-
# gated pre-merge gate: on a PR `moon ci :ci` runs them only when the PR affects
# the flake's build closure (the `inputs` below — flake.nix/flake.lock plus the
# go/ module the packages build and devenv.lock, whose bump is the drift event),
# and every push to main runs them unconditionally. devenv.lock is in the
# trigger set precisely because a devenv pin bump is what causes the skew.
#
# A nix-source project like its siblings (agent-image, guest-image, app-bundle):
# ci-group.nix, and the tag-bun install / whole-repo lint+format are never
# inherited here.
layer: 'tool'
language: 'nix'
tags: ['ci-group.nix']

# The ci-matrix generator computes a PR's affected set as the union of
# `moon query projects --affected` (the PROJECT graph) and `moon query tasks
# --affected` (declared task `inputs`). flake-gate's trigger surface lives in
# other projects' trees (flake.nix/flake.lock/devenv.lock in `root`, the Go
# tree in `compass-go`, and the parity sources in `toolchain-parity`). The
# `dependsOn` edges are retained because the project walk still supplies the
# reachability half; without them, the graph half would miss the drift this
# gate exists to catch. The `inputs:` globs on flake-check remain the true
# closure (main sweep + local `moon ci`).
dependsOn:
  - 'root'
  - 'compass-go'
  - 'toolchain-parity'
  # `nix flake check` now also realizes `compass-ui` (apps/ui/dist.nix — the web
  # UI dist the flake stages into compass-app's bin/dist, RIG-3474), so that
  # derivation's source projects are owners of this gate exactly as compass-go is
  # for the backend packages. Only `compass-client` can be declared: moon's
  # layer constraints forbid a `tool` project depending on an `application`, and
  # `compass-ui` is `layer: 'application'` (apps/ui/moon.yml:9) — the edge is
  # rejected as `project_constraints::invalid_layer_relationship`. So a
  # UI-source-only PR is caught by flake-check's `inputs` rather than by
  # project-graph affected detection, which never consults task inputs (see the
  # note above). Those inputs must therefore enumerate every path the compass-ui
  # derivation reads — including all 21 workspace manifests, argued at the entry
  # itself; the two member globs alone are NOT the closure.
  - 'compass-client'

workspace:
  inheritedTasks:
    exclude: ['install', 'lint', 'format']

tasks:
  flake-check:
    # Evaluate + build every flake output. Runs from the workspace root where
    # flake.nix lives. cache:false — nix owns its store-path caching; moon must
    # not false-green a check it did not re-run (the posture guest-image and
    # app-bundle take).
    command: 'nix flake check'
    options:
      runFromWorkspaceRoot: true
      cache: false
      runInCI: true
    # Affected-detection closure for the whole gate (the deps below inherit it
    # via the project). A change to any reschedules the gate under per-PR
    # affected detection; every push to main runs it unconditionally (ci.yml's
    # affected-PR / full-main split). devenv.lock is in the set precisely
    # because a devenv pin bump is the drift event the parity dep catches. A
    # leading `/` is workspace-root-relative (the sibling nix projects'
    # convention, guest-image/moon.yml:59-63).
    inputs:
      - '/flake.nix'
      - '/flake.lock'
      - '/devenv.lock'
      - '/go/**'
      - '/tools/toolchain/gtk-closure.nix'
      - '/tools/toolchain/flake-parity.ts'
      - '/tools/toolchain/flake-parity-core.ts'
      # The compass-ui closure (apps/ui/dist.nix): the two members' source, the
      # root manifest + lockfile the pinned FOD installs from, and the shared
      # tsconfig the build copies in. `bun.lock` earns its slot twice over — it
      # is both a build input and the trigger that invalidates the derivation's
      # `outputHash`, so a lockfile bump reddens this gate until the pin is
      # refreshed, which is precisely when it must run.
      - '/apps/ui/**'
      - '/packages/compass-client/**'
      - '/package.json'
      - '/bun.lock'
      - '/tsconfig.base.json'
      # EVERY workspace member's package.json, not just the two members that get
      # installed. dist.nix:83-99 reads `workspaces.packages` from the root
      # manifest and globs all 21 manifests into the FOD source, because bun
      # resolves the whole workspace graph before installing a filtered member
      # (omit one and it aborts with `Workspace not found`). Undeclared, a
      # manifest-only commit does not schedule this gate at all — measured with
      # `moon query tasks --affected --project flake-gate`, which returned no
      # task for packages/compass-agent, apps/eng-docs, and every tools/* member
      # before these three globs were added.
      #
      # The consequence depends on whether the FOD's output is already in the
      # local store, and the two cases differ:
      #
      # WARM (a dev box that already built it): the FOD is content-addressed by
      # `outputHash`, so its output path is a function of the pinned hash and
      # NOT of its inputs. A drifted manifest changes the .drv but resolves to
      # the same store path, which nix serves from cache without re-running
      # `bun install` — building `.#compass-ui` clean and with an added
      # dependency gives an identical out-path. Drift cannot change what ships.
      #
      # COLD (every CI runner — ci.yml:215 adds only devenv/cachix substituters,
      # neither carrying this FOD, and the workflow pushes to no cache): the
      # install really runs, and a dependency-graph drift fails closed with
      # `error: lockfile had changes, but lockfile is frozen`. A COSMETIC
      # manifest edit still builds clean and reproduces the pinned hash, so it
      # is specifically the dependency graph that trips this, not any manifest
      # byte.
      #
      # So the gate must be scheduled for a manifest-only commit: cold, it can
      # genuinely redden, with an error naming the LOCKFILE rather than the
      # manifest that caused it. It also catches a hash needing a refresh
      # (RIG-3514).
      - '/packages/*/package.json'
      - '/apps/*/package.json'
      - '/tools/*/package.json'

  flake-parity:
    # The nixpkgs-pin parity gate. bun runs the thin shell from the workspace
    # root (it reads /flake.lock + /devenv.lock relative to the repo root).
    # cache:false: a fail-closed gate never rides a cached green from another
    # checkout.
    command: 'bun tools/toolchain/flake-parity.ts'
    options:
      runFromWorkspaceRoot: true
      cache: false
      runInCI: true

  version-guard:
    # The version.txt guard-parity gate. flake.nix's `versionBase` and
    # devenv.nix's process-script guard validate the same file with two
    # independently hand-written expressions in two languages; a skew means one
    # lane hard-fails a tree the other builds, or both build and stamp
    # different versions. Same shape as flake-parity above: bun runs the thin
    # shell from the workspace root (it lifts the guards out of /flake.nix and
    # /devenv.nix by path), and cache:false because a fail-closed gate never
    # rides a cached green from another checkout.
    command: 'bun tools/toolchain/version-guard.ts'
    options:
      runFromWorkspaceRoot: true
      cache: false
      runInCI: true

  ci:
    deps: ['flake-check', 'flake-parity', 'version-guard']
    options:
      cache: false
      runInCI: true
