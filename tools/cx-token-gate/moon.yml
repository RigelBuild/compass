# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# cx-token-gate (SEA T2) — enforce the Compass design-token consumption rule
# (D2/D9): component + base CSS under apps/ui/src/ consumes ONLY the semantic
# + scale --cx-* tokens. Raw hex colours, --rigel-* references, and literal
# time/easing values are banned outside apps/ui/src/design/tokens.css, with one
# narrow carve-out — the mark component's CSS may name --rigel-purple directly
# (purple is never aliased into --cx-*, so the mark is the sole sanctioned
# direct primitive consumer).
#
# A bun/TypeScript CLI; a hoisted root-workspace member (`bun` tag): install is
# inherited via .moon/tasks/tag-bun.yml (the shared root install) and
# lint/format are whole-repo tasks on the root project (/moon.yml), so this leaf
# has no own bun.lock and never runs its own install.
#
# Compass CI is a single moon-driven `CI` job (.github/workflows/ci.yml runs
# `moon run :ci`), so the `ci` aggregate below is swept automatically.
layer: 'tool'
language: 'typescript'
tags: ['bun', 'ci-group.bun']

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock']
  test:
    command: 'bun test'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock']
  check:
    # The consumption gate: scan the whole repo's apps/ui/src CSS tree for
    # banned raw hex / --rigel-* / literal duration+easing values. Run from the
    # workspace root so the scanned globs resolve repo-relative (GATE_ROOT
    # defaults to the git toplevel = workspace root). Distinct from `test`,
    # which drives the pure core over fixtures; this observes the real tree.
    command: 'bun run tools/cx-token-gate/index.ts'
    deps: ['install']
    options:
      runFromWorkspaceRoot: true
      # Never cache: the gate's subject is the live apps/ui/src CSS tree, and a
      # cached green from another checkout is the false-green a fail-closed
      # gate exists to stop.
      cache: false
    inputs:
      - '/apps/ui/src/**/*.css'
      - 'index.ts'
  ci:
    deps: ['typecheck', 'test', 'check']
    options:
      cache: false
