# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# runner-image (R1): the build lane for the compass-runner container image.
# Realises the nix closure, stages it, and drives the rootless-BuildKit build.
# TypeScript rather than a shell script (the no-bash-gate CI task);
# runner-image/ carries the Dockerfile and the staged context.
#
# The BUILD itself needs a reachable buildkitd and realises a multi-GB nix
# closure, so it is not a CI gate task (see runner-image/moon.yml for the build
# task and why it is runInCI:false). The typecheck/test tasks here ARE ordinary
# bun gates that ride CI: they cover the pure core — the out-path parsing, the
# build-arg mapping, and the closure-root selection whose drift would silently
# produce an unrunnable image.
#
# A bun/TypeScript CLI, hoisted root-workspace member (`bun` tag): install is
# inherited via .moon/tasks/tag-bun.yml and lint/format are whole-repo root
# tasks, so this leaf carries no own bun.lock.
layer: 'tool'
language: 'typescript'
tags: ['bun', 'ci-group.bun']

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock']
  test:
    # The pure core (build-core.ts) over fixtures: the out-path parsing, the
    # artifact→build-arg mapping (incl. the kernel's bzImage suffix, which the
    # file-shaped rootfs/initrd must NOT gain), and the closure-root selection.
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock']
