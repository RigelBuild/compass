# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# design-ledger-gate — validate Compass design decision files
# (docs/designs/decisions/), per-record `Status:` headers, and dangling
# supersession/Record pointers. A bun/TypeScript CLI; a hoisted
# root-workspace member (`bun` tag): install is inherited via
# .moon/tasks/tag-bun.yml (the shared root install) and lint/format are
# whole-repo tasks on the root project (/moon.yml), so this leaf has no own
# bun.lock and never runs its own install.
#
# Compass CI runs a per-concern matrix: tools/ci-matrix computes the targets
# and .github/workflows/ci.yml runs `moon run <targets>`, so this project's `ci`
# aggregate is swept only when the matrix selects it. tools/ci-matrix adds this
# gate to every PR (`ALWAYS_RUN_ON_PR`), since its `check` reads the whole
# docs/designs corpus.
layer: 'tool'
language: 'typescript'
tags: ['bun', 'ci-group.bun']

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock']
  test:
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock']
  check:
    # Scan decisions and governed record/header/pointer integrity from the repo root.
    command: 'bun run tools/design-ledger-gate/index.ts'
    deps: ['install']
    options:
      runFromWorkspaceRoot: true
      # The corpus is live source; caching a pass would be a false green.
      cache: false
    inputs:
      - '/docs/designs/**/*.md'
      - 'index.ts'
      - 'decision-files.ts'
  ci:
    deps: ['typecheck', 'test', 'check']
    options:
      cache: false
