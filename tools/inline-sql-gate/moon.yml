# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# inline-sql-gate (sqlc adoption T1) — ban inline SQL string literals at pgx
# call sites. A `.Query`/`.QueryRow`/`.Exec` call whose SQL argument (tokenized
# across newlines) is a Go string literal containing a SQL keyword is banned in
# go/**/*.go, except the sqlc-generated go/internal/store/db/ package, *_test.go
# files, and a ratcheting allowlist (seeded to the current store files, shrunk
# per migration task). The allowlist is fail-closed: a stale entry (no matching
# finding) fails the gate.
#
# A bun/TypeScript CLI; a hoisted root-workspace member (`bun` tag): install is
# inherited via .moon/tasks/tag-bun.yml (the shared root install) and
# lint/format are whole-repo tasks on the root project (/moon.yml), so this leaf
# has no own bun.lock and never runs its own install.
#
# Compass CI is a single moon-driven `CI` job (.github/workflows/ci.yml runs
# `moon run :ci`), so the `ci` aggregate below is swept automatically.
layer: 'tool'
language: 'typescript'
tags: ['bun', 'ci-group.bun']

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock']
  test:
    command: 'bun test'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock']
  check:
    # The ban gate: scan the whole repo's go/**/*.go tree for inline SQL at pgx
    # call sites. Run from the workspace root so the scanned globs resolve
    # repo-relative (GATE_ROOT defaults to the git toplevel = workspace root).
    # Distinct from `test`, which drives the pure core over fixtures; this
    # observes the real tree.
    command: 'bun run tools/inline-sql-gate/index.ts'
    deps: ['install']
    options:
      runFromWorkspaceRoot: true
      # Never cache: the gate's subject is the live go/ source tree, and a
      # cached green from another checkout is the false-green a fail-closed
      # gate exists to stop.
      cache: false
    inputs:
      - '/go/**/*.go'
      - 'index.ts'
  ci:
    deps: ['typecheck', 'test', 'check']
    options:
      cache: false
