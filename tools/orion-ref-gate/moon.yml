# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# orion-ref-gate (RIG-2489) — fail-closed check that the PUBLIC compass repo
# carries no reference to the PRIVATE internal monorepo (RigelBuild/orion). A
# bun/TypeScript CLI; a hoisted root-workspace member (`bun` tag): install is
# inherited via .moon/tasks/tag-bun.yml (the shared root install) and
# lint/format are whole-repo tasks on the root project (/moon.yml), so this
# leaf has no own bun.lock and never runs its own install.
#
# Compass CI runs a per-concern matrix, not one job: tools/ci-matrix computes
# the targets and .github/workflows/ci.yml runs `moon run <targets>`, so this
# project's `ci` aggregate is swept only when the matrix selects it. The
# task-level half of the affected union selects this gate when a file in another
# project's tree matches the whole-repo `check` scan.
layer: 'tool'
language: 'typescript'
tags: ['bun', 'ci-group.bun']

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock']
  test:
    # `/docs/concepts/self-host-and-managed.md` is a real input: a test asserts
    # the doc cited in the failure hint still exists, so the cache key must
    # track it. Without it moon replays a green after the doc is deleted —
    # the same silent-pointer-death this gate's hint was repaired for. Scoped
    # to the one cited file, not `/docs/**`, so unrelated docs edits don't
    # re-run the suite. Keep in sync with `REMEDIATION_DOC` in index.ts.
    #
    inputs:
      - '*.ts'
      - 'tsconfig.json'
      - '/tsconfig.base.json'
      - 'package.json'
      - '/bun.lock'
      - '/docs/concepts/self-host-and-managed.md'
  check:
    # The boundary gate: scan the whole tracked tree (via git grep) for any
    # reference to the private monorepo. Run from the workspace root so the
    # scan and carve-out prefixes resolve repo-relative.
    command: 'bun run tools/orion-ref-gate/index.ts'
    deps: ['install']
    options:
      runFromWorkspaceRoot: true
      # Never cache: the gate's subject is the live tracked tree, and a cached
      # green from another checkout is the false-green a fail-closed gate
      # exists to stop.
      cache: false
    inputs:
      - '/**/*'
      - 'index.ts'
  ci:
    deps: ['typecheck', 'test', 'check']
    options:
      cache: false
