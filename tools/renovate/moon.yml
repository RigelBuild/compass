# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# renovate (RIG-2432) — self-hosted Renovate config + lockstep postUpgradeTask
# scripts for compass. A bun/TypeScript
# package; a hoisted root-workspace member (`bun` tag): install is inherited via
# .moon/tasks/tag-bun.yml (the shared root install) and lint/format are whole-repo
# tasks on the root project (/moon.yml), so this leaf has no own bun.lock and
# never runs its own install.
#
# Compass CI runs per-group `moon (<group>)` legs (tools/ci-matrix picks the
# targets) rolled up into the required `rollup`; this project's `ci` runs in
# `moon (bun)` when affected. The config.test.ts guard suite runs under `test`;
# it fails closed if the repo config and bot config drift (allowedCommands ↔
# postUpgradeTasks), if a fence/cap rule goes missing, or if the catalog regex
# silently truncates. `lock-integrity` fails closed on a half-relocked devenv lock.
layer: 'tool'
language: 'typescript'
tags: ['bun', 'ci-group.bun']

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock']
  test:
    inputs:
      - '*.ts'
      # The FOD vehicle (agent-image-fod-vehicle.nix) lives here and
      # is named by refresh-fod-hashes.ts's table; the suite asserts it exists, so
      # deleting or renaming it must schedule this project.
      - '*.nix'
      - '*.json5'
      - 'tsconfig.json'
      - '/tsconfig.base.json'
      - 'package.json'
      - '/bun.lock'
      - '/package.json'
      - '/bunfig.toml'
      - '/devenv.lock'
      # RIG-2815: the guard suite + the relock core's real-manifest tests read
      # the agent-image devenv lock too, not just the root one.
      - '/agent-image/devenv.lock'
      - '/.github/workflows/renovate.yml'
    options:
      # Never cache: the guard suite reads the live root package.json, bunfig,
      # devenv.lock, and the workflow file — a cached green from another checkout
      # is the false-green a fail-closed config gate exists to stop.
      cache: false
  lock-integrity:
    command: 'bun tools/renovate/devenv-lock-integrity.ts'
    inputs:
      - '/devenv.lock'
      - '/agent-image/devenv.lock'
      - 'devenv-lock-integrity*.ts'
      - 'refresh-devenv-lock.core.ts'
    options:
      runFromWorkspaceRoot: true
      runInCI: true
      # Never cache: the answer depends on the network and the fork's history.
      cache: false
  agent-fod:
    # Realise only agent-image/entrypoint.nix's node_modules FOD, so a stale
    # outputHash fails here in about a minute, not at the end of the image build.
    command: 'bun tools/renovate/check-agent-fod.ts'
    deps: ['install']
    inputs:
      - 'check-agent-fod.ts'
      - 'refresh-fod-hashes.ts'
      - 'agent-image-fod-vehicle.nix'
      - '/agent-image/entrypoint.nix'
      - '/agent-image/devenv.lock'
      - '/tools/toolchain/versions/bun.nix'
      - '/tools/toolchain/toolchain-tools.nix'
      - '/bun.lock'
      - '/package.json'
      - '/packages/*/package.json'
      - '/apps/*/package.json'
      - '/tools/*/package.json'
    options:
      runFromWorkspaceRoot: true
      # nix owns the caching; a cached green from another checkout is the
      # false green this check exists to stop.
      cache: false
  ci:
    deps: ['typecheck', 'test', 'lock-integrity', 'agent-fod']
    options:
      cache: false
