# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# sql-migration-gate (RIG-3031) — SQL migration lint for the first-party
# migrations under go/internal/store/migrations/. Two linters, both nix-pinned in
# devenv.nix (the SQL lint battery):
#
#   squawk  migration-SAFETY analysis — flags unsafe DDL (a NOT-NULL column with
#           no default, a full-table rewrite, a non-CONCURRENT index on a live
#           table). Config + accepted-rule rationale in /.squawk.toml.
#   sqruff  SQL style/lint — structural + correctness + capitalisation rules
#           kept, pure-layout reformatting rules excluded for this hand-authored
#           schema. Config in /.sqruff.
#
# A bun/TypeScript CLI (`bun` tag), like its gate siblings inline-sql-gate and
# microvm-boot-test: install is inherited via .moon/tasks/tag-bun.yml (the shared
# root install) and lint/format are whole-repo root tasks, so this leaf carries
# no own bun.lock. The `check` task execs the two nix-provided linter binaries
# (squawk/sqruff) — both are on PATH on every moon CI leg (ci.yml phase-two puts
# the devenv nixpkgs tools on PATH for each running leg, gated on matrix.run, not
# on the group), so a bun-group leg has them just as the nix leg did.
#
# WHY A SCRIPT, NOT AN INLINE `bash -c`: the gate WAS
# `command: 'bash -c "squawk …; rc=$?; sqruff …; rc2=$?; exit $(( rc | rc2 ))"'`.
# moon wraps every task command in its own `bash -c "<command>"`, and the nested
# double quotes collided: the OUTER shell expanded `$?`, `$rc`, `$rc2`, and
# `$(( rc | rc2 ))` (all unset → 0) BEFORE the inner shell ran, so the inner
# shell got a literal `…; rc=0; …; rc2=0; exit 0` and the gate ran fail-OPEN —
# it printed every finding and always exited 0. It went unnoticed because
# 0001_init.sql genuinely passes both linters. The exit-code combination now
# lives in index.ts (rule://scripts-ts-over-bash + the no-bash-gate CI task) and
# is unit-tested (index.test.ts).
#
# Compass CI runs a per-concern matrix: tools/ci-matrix computes the targets
# and .github/workflows/ci.yml runs `moon run <targets>`, so this project's `ci`
# aggregate is swept only when the matrix selects it.
layer: 'tool'
language: 'typescript'
tags: ['bun', 'ci-group.bun']

# Affected detection is the union of the project graph walk and the task-level
# input walk. The migration input glob on `check` covers the migration tree in
# compass-go's project, so declaring compass-go a dep lets `--downstream direct`
# pull the gate into the affected set whenever the Go tree is affected — the
# case that matters.
# The task-level half now also covers config-only changes to /.squawk.toml and
# /.sqruff. Keep the `inputs:` globs on `check` as the true closure for the main
# sweep + local `moon ci`.
dependsOn:
  - 'compass-go'

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock']
  test:
    # The pure core (index.ts): the fail-closed exit-code combination + verdict
    # formatting + the no-short-circuit orchestration — the contract the old
    # inline-`bash -c` form silently violated.
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock']
  check:
    # Both linters over every first-party migration, exit codes OR'd fail-closed
    # in index.ts. Run from the workspace root so squawk/sqruff discover their
    # repo-root configs (/.squawk.toml, /.sqruff) and the migration glob resolves
    # repo-relative (GATE_ROOT defaults to the git toplevel = workspace root).
    command: 'bun run tools/sql-migration-gate/index.ts'
    deps: ['install']
    options:
      runFromWorkspaceRoot: true
      # Never cache: a fail-closed lint gate must not ride a cached green from
      # another checkout — the subject is the live migration tree.
      cache: false
      runInCI: true
    inputs:
      - '/go/internal/store/migrations/**/*.sql'
      - '/.squawk.toml'
      - '/.sqruff'
      - 'index.ts'
  ci:
    deps: ['typecheck', 'test', 'check']
    options:
      cache: false
      runInCI: true
