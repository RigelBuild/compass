# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# The Renovate preflight (RIG-2432): probes GitHub with RENOVATE_TOKEN before
# the bot runs and fails fast with an actionable diagnosis instead of
# Renovate's opaque platform-unknown-error. A moon project so its own typecheck
# + test gate in CI like every other package; the preflight itself runs as a
# step in the `renovate` workflow (.github/workflows/renovate.yml), not off the
# affected graph — this project carries only the code + its unit gate.
# Compass CI runs a per-concern matrix: tools/ci-matrix computes the targets
# and .github/workflows/ci.yml runs `moon run <targets>`, so this project's `ci`
# aggregate is swept only when the matrix selects it.
# install/lint/format are inherited via the `bun` tag (.moon/tasks/tag-bun.yml).
layer: 'tool'
language: 'typescript'
tags: ['bun', 'ci-group.bun']

tasks:
  typecheck:
    command: 'bunx tsc --noEmit'
    deps: ['install']
    inputs: ['*.ts', 'tsconfig.json', '/tsconfig.base.json', 'package.json', '/bun.lock']

  test:
    inputs: ['*.ts', 'package.json', 'tsconfig.json', '/tsconfig.base.json', '/bun.lock']

  ci:
    deps: ['typecheck', 'test']
    options:
      cache: false
