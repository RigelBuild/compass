# Secret-scanning path exclusions.
#
# GitHub auto-closes secret-scanning alerts under these paths AND skips push
# protection for them (excluded paths are exempt from both — GitHub Docs,
# "Excluding folders and files from secret scanning").
#
# forks/*/** — vendored fork subtrees (SEA-1512, SEA-1514). These trees are
# byte-for-byte copies of their upstreams, imported and kept object-identical so
# they round-trip cleanly to their public spokes via Copybara. They legitimately
# carry upstream's own committed constants that secret scanning flags — e.g.
# oh-my-pi ships the public installed-app OAuth client IDs/secrets for the Gemini
# CLI / Antigravity flows (packages/ai/src/registry/oauth/*.ts), which are
# non-confidential values Google publishes in its own open-source CLIs (installed
# apps cannot hold a secret, RFC 8252). Scanning a vendored tree produces false
# positives at scale and, worse, blocks the import push itself. Editing the tree
# to satisfy the scanner would break the tree-hash-identity verification basis and
# poison the Copybara byte-compatibility the whole vendored posture depends on —
# so the vendored trees are excluded rather than redacted. First-party files that
# live beside the forks (forks/README.md) are NOT under a fork subtree
# (forks/<name>/) and stay scanned.
#
# This mirrors the sealed monorepo's own .github/secret_scanning.yml, with the
# path rebased from oss/forks/*/** to forks/*/** for this repo's layout.
paths-ignore:
  - "forks/*/**"
