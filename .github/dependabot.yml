# Every `uses:` in this repo's workflows is pinned to an immutable commit SHA,
# because a git tag can be repointed by its owner to arbitrary code that then
# runs in CI with no review and no diff. SHAs make that impossible — and make
# the actions go stale, since nothing follows a moving tag any more.
#
# Dependabot is the other half of that trade: it opens a reviewable PR to move
# each SHA forward, so the pins stay current through the same gate as any other
# change rather than drifting silently or being bumped by hand.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR moving several actions is one review and one CI run; separate PRs
    # per action are neither, for changes that are almost always routine.
    groups:
      actions:
        patterns:
          - '*'

  # The JS workspace is Bun, not npm: one root `bun.lock` drives a hoisted
  # workspace (packages/*, apps/*, tools/*). Dependabot resolves `bun.lock`
  # under its own `bun` ecosystem — the `npm` ecosystem does not parse it and
  # would silently update nothing. Root directory covers the whole workspace
  # because the lockfile is single and hoisted.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun:
        patterns:
          - '*'

  # The Go backend is a single module rooted at /go (go.mod + go.sum). Vendored
  # forks under /forks carry their own go.mod and are deliberately left out —
  # they track upstream, not our bumps.
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns:
          - '*'
