name: renovate-nix-package-diff-publish

on:
  workflow_run:
    workflows: [renovate-nix-package-diff]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: nix-package-diff-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] &&
      !github.event.workflow_run.pull_requests[1]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PR_NUMBERS: ${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Verify pull request is still eligible
        id: guard
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")
          state=$(jq -r '.state' <<<"$pr")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr")
          head_ref=$(jq -r '.head.ref // ""' <<<"$pr")
          if [ "$state" != open ] || [ "$head_repo" != "$GH_REPO" ] || [[ "$head_ref" != renovate/* ]]; then
            echo "eligible=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.eligible == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        if: steps.guard.outputs.eligible == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the language toolchains on PATH
        if: steps.guard.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          stores=$(nix eval --json -f tools/toolchain/gate-tools.nix langs | jq -r '.[].store')
          [ -n "$stores" ] || { echo "::error::gate-tools.nix langs produced no store paths" >&2; exit 1; }
          readarray -t store_paths <<<"$stores"
          nix build --out-link "$RUNNER_TEMP/langs" "${store_paths[@]}"
          for store in "${store_paths[@]}"; do echo "$store/bin" >>"$GITHUB_PATH"; done

      - name: Download package diff artifact
        if: steps.guard.outputs.eligible == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nix-package-diff
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nix-package-diff

      - name: Publish package changes
        if: steps.guard.outputs.eligible == 'true'
        env:
          ARTIFACT_FILE: ${{ runner.temp }}/nix-package-diff/diff.json
        run: bun tools/renovate/nix-package-diff.ts publish
