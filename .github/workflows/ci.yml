# The remote gate for every pull request and every push to main, plus a nightly
# full sweep of main.
#
# ONE JOB, NOT A MATRIX — the central structural decision, made deliberately.
#
# A matrix fanning each moon task into its own job would give per-task check
# names and crisper failure attribution. It was rejected on one decisive
# ground: it can only be built by enumerating projects (or tasks) in YAML, and
# a project list in a workflow is a second source of truth for something
# .moon/workspace.yml already owns. That list goes stale silently. It has
# already happened in this repo's history — a fork tree shipped a functional-CI
# registration with no entry in the project map, so it read as covered and
# gated nothing. A YAML enumeration recreates exactly that failure at the CI
# layer: add a project, forget the matrix entry, and the gate goes quiet about
# it while still reporting green. moon discovers projects from
# .moon/workspace.yml, so a new project with a `ci` task is picked up the moment
# it is registered — no matrix entry to forget, which is why the arriving
# oh-my-pi fork needs no edit to this file.
#
# The costs of one job are real and accepted: a single check name to require,
# and the failing task named in the log rather than in the check list. moon
# already prints the failing target and only the failing target's output, so
# attribution costs one click, not a bisect.
#
# AFFECTED ON PRs, FULL ON MAIN. A pull request runs `moon ci :ci`, which runs
# only the projects the PR affects — a Go, UI, or docs PR never pays for the
# vendored forks' nix builds (the dominant cost, and the reason the CI job's
# timeout is 90m). The tradeoff is real and named: affected detection trusts
# each task's `inputs` globs to be complete, so an inputs glob that misses a
# file would skip a task that should have run — the same silent-skip class the
# matrix rationale above rejects. The backstop is that main is never gated by
# affected: every push to main AND a nightly `schedule` run the FULL `moon run
# :ci` — every task, every project, no filter. So an inputs gap a PR skipped is
# caught the moment the change lands on main (named and attributable), not left
# to hide; the nightly sweep re-checks main even on a quiet day. Fast affected
# path on PRs, exhaustive sweep on everything that reaches main.
#
# pgtest — the real-Postgres suites — runs as a step in the same `CI` job,
# after the moon battery, against a Postgres service container attached to the
# job. It was once a separate job to keep a Postgres-service outage from redding
# the hermetic gate; folded in so there is one required check, at the cost that a
# service-container flake now reds `CI` (a re-run clears it). The suites are
# build-tagged `pgtest`, so the moon battery's `go test ./...` never compiles
# them — the folded step below is the only thing that runs them.

name: CI

on:
  pull_request:
    # The default types (opened, synchronize, reopened) OMIT `edited`, which is
    # the only event fired when a PR's BASE branch is re-pointed. A stacked PR
    # whose base flips when the PR below it merges/closes fires only
    # `pull_request.edited` — with the default set, no fresh CI runs against the
    # new base and `gh run rerun` only replays the frozen stale merge SHA (a
    # phantom red against the dead base's tree; the only escape was close+reopen).
    # `edited` closes that gap. It also fires on title/body edits, so the job
    # below guards on `changes.base` to stay a no-op for everything but a real
    # base re-point — no added CI spend on a title/body edit.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    # Nightly full backstop: runs the whole battery over main so an incomplete
    # `inputs` glob the affected PR gate skipped cannot hide indefinitely.
    # 07:17 UTC, off the top-of-hour cron congestion GitHub throttles.
    - cron: '17 7 * * *'

# One in-flight run per ref per event action. A superseded push's run is
# answering a question nobody is asking any more. Both the event and its action
# are in the key so runs answering different questions about the same ref don't
# cancel each other: a nightly schedule and a coincident post-merge push
# (different events), and a PR's `opened`/`edited`/`synchronize` sub-actions
# (same event, different questions). That last case is load-bearing: jj-vine
# opens a PR, then ~1s later edits the body to add the stack diagram, and that
# `edited` run must not cancel the still-running real `opened` run — otherwise
# the required check ends cancelled+skipped (the edited run self-skips via the
# job `if` below) and reads as a false green. Superseded pushes are all
# `synchronize`, so they still collapse to one in-flight run per ref as intended.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ github.event.action }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    # Skip only the no-op case of the `edited` trigger above: a PR title/body
    # edit that did NOT move the base. `changes.base` is present on the payload
    # only when the base branch was re-pointed, so a real base re-point still
    # runs (the whole reason `edited` is in the trigger set), while a title/body
    # edit is a no-op. push and schedule are not `pull_request` events, so the
    # first clause lets them through unconditionally.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'edited' ||
      github.event.changes.base != null
    # The vendored forks build through nix (devenv's Rust crates via its flake's
    # fenix pin), so this is a long job by construction.
    timeout-minutes: 90
    env:
      # A short temp root, because AF_UNIX sun_path is 108 bytes and the Go
      # suites bind sockets under `t.TempDir()`. The runner's default TMPDIR is
      # /home/runner/work/_temp — 22 bytes before the test's own name-derived
      # path — which pushes the runner and server socket tests past the cap and
      # fails them with a bare EINVAL from bind(2). /tmp is 4 bytes and leaves
      # the budget those tests were written against.
      #
      # A CI-shaped constraint, fixed in CI: the cap is real and the code's own
      # guards against it are elsewhere; nothing about this repo's sockets should
      # be redesigned around one runner's choice of temp root.
      TMPDIR: /tmp
    services:
      postgres:
        # Matches pgtest.go's pinned image: the suites assert on generated-tsvector
        # and websearch_to_tsquery behavior, which is major-version-sensitive.
        #
        # Pinned by DIGEST, not tag. `16-alpine` is mutable, so a repoint would
        # ship unreviewed container code into the gate and could change the
        # database behavior the suites assert on — with the tag unchanged, so
        # nothing in the diff would show it. The digest must stay equal to
        # pgtest.go's pgImage, or CI and a local run stop exercising the same
        # Postgres, which is the parity the line above claims.
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: compass-test
          POSTGRES_DB: compass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The drift gate's `git diff --no-index` needs real git; a shallow
          # single-ref checkout does not provide it.
          fetch-depth: 0

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          # The forks' functional CI is `nix build` of their own flakes, and the
          # whole toolchain — language runtimes AND the nixpkgs tools — is built
          # from nix below. Flakes are needed for the former; nix-command for both.
          #
          # The substituters below are declared here rather than delegated via
          # `accept-flake-config = true`. That setting makes nix accept the
          # `nixConfig` of ANY flake it evaluates, and forks/devenv/flake.nix
          # carries exactly such a block — so a PR could add its own substituter
          # AND its own trusted public key, and CI would fetch and run binaries
          # signed by the attacker's key, with signature verification satisfied
          # by the key the same PR supplied. Naming the two caches the forks
          # legitimately use keeps that trust in a reviewed file: adding a third
          # is a change to this workflow, not to a vendored tree.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the language toolchains on PATH
        # Phase one of the two-phase bootstrap. The language runtimes
        # (bun/node/moon/go) come from nix, not `setup-*` actions: gate-tools.nix's
        # `langs` output resolves the identical derivations the dev shell does —
        # bun/node/moon from tools/toolchain/toolchain-tools.nix, go from the
        # go-overlay applied to the devenv.lock-pinned nixpkgs — so CI runs the
        # pinned versions byte-for-byte and the parity gate has a concrete store
        # path to check each against. `langs` is a closed set, so it needs no
        # `--arg attrs` (the head defaults it).
        #
        # This must precede phase two: `--print-nix-attrs` runs under `bun`, so
        # bun has to be on PATH before that parse can run.
        run: |
          stores=$(nix eval --json -f tools/toolchain/gate-tools.nix langs \
            | jq -r '.[].store')
          # Fail closed locally rather than leaning on the absence of a
          # root-level flake.nix: with no installables `nix build` would build a
          # default package if one existed, so an empty `langs` must error here.
          [ -n "$stores" ] || {
            echo "::error::gate-tools.nix langs produced no store paths"
            exit 1
          }
          nix build --no-link $stores
          for store in $stores; do
            echo "$store/bin" >>"$GITHUB_PATH"
          done

      - name: Put the dev shell's nixpkgs tools on PATH
        # Phase two. buf, protoc, the Go analysis battery, biome and markdownlint
        # have no `setup-*` action that could reproduce a nixpkgs pin. Rather than
        # pick a close-enough release from some other channel and hope, CI
        # resolves the SAME derivations the dev shell does, from the nixpkgs
        # revision devenv.lock pins.
        #
        # The attribute list comes from the parity script's own parse of
        # devenv.nix (run under the bun that phase one just put on PATH), so what
        # CI installs and what the gate expects cannot disagree, and neither is
        # enumerated here.
        run: |
          attrs=$(bun tools/toolchain/parity.ts --print-nix-attrs)
          out=$(nix build --no-link --print-out-paths \
            -f tools/toolchain/gate-tools.nix env --arg attrs "$attrs")
          echo "$out/bin" >>"$GITHUB_PATH"

      - name: Toolchain parity
        # Runs BEFORE the gate, though `:ci` schedules it again (it takes under a
        # second). A toolchain skew invalidates every result the gate is about to
        # produce, so finding out first is worth running it twice.
        run: bun tools/toolchain/parity.ts

      - name: CI (affected)
        # Pull requests only: run only what the PR affects. moon reads the base
        # from GITHUB_BASE_REF (the PR's target branch) via the ci_env crate and
        # diffs against it — see the AFFECTED section in the header for the
        # tradeoff and the backstop. Restricted to `pull_request` deliberately:
        # on a push GITHUB_BASE_REF is unset, so moon would fall back to
        # comparing vcs.defaultBranch against HEAD — which on a push to main is
        # main against its own tip, an empty diff that runs nothing and reports a
        # misleading green. So affected is the fast PR path; every landing on
        # main gets the full sweep below.
        if: github.event_name == 'pull_request'
        run: moon ci :ci

      - name: CI (full sweep)
        # Every push to main and the nightly schedule: the whole battery,
        # unconditionally. This is what makes the affected PR gate safe — an
        # incomplete `inputs` glob that let a task be skipped on a PR is caught
        # here the moment the change lands on main (and again nightly), named and
        # attributable, not left to hide indefinitely. `moon run :ci`, not `moon
        # ci`: affected detection would find nothing to do on a push to main.
        if: github.event_name != 'pull_request'
        run: moon run :ci


      - name: Real-Postgres suites
        working-directory: go
        env:
          # pgtest.go's documented CI-service path: with a DSN set the harness
          # uses this database (giving each test its own schema) instead of
          # managing a container.
          COMPASS_TEST_DATABASE_DSN: postgres://postgres:compass-test@127.0.0.1:5432/compass?sslmode=disable
          CGO_ENABLED: '1'
          # The harness SKIPS when it can reach no database — correct for a
          # container-less sandbox, but in CI the service Postgres above is
          # mandatory, so a skip here would silently pass nothing. Setting this
          # turns the no-DSN/no-runtime SKIP into a hard failure.
          COMPASS_REQUIRE_LIVE: '1'
        # -v so the assertion below can read per-test outcomes. The redirect —
        # rather than a pipe to tee — is deliberate: a pipeline's exit status is
        # its LAST command's, so `go test ... | tee` returns tee's 0 and a real
        # test failure is silently discarded (this job reported green over a
        # `FAIL` before this was fixed). Capture, replay the log, then exit on
        # go test's own status. `|| rc=$?` because the step runs under `bash -e`,
        # which would otherwise abort before the log is ever printed. The
        # explicit -timeout exceeds the job's slowest suite: on the default 10m a
        # wedged test panics mid-run and the panic, not the failure, is the story.
        run: |
          rc=0
          go test -tags pgtest -race -v -timeout 15m ./... >/tmp/pgtest.log 2>&1 || rc=$?
          cat /tmp/pgtest.log
          exit "$rc"

      - name: Assert the real-Postgres suites ran rather than skipped
        working-directory: go
        # The harness SKIPS (never fails) when it can find no database — correct
        # for a container-less sandbox, and a silent no-op here. This step exists
        # to run those assertions, so a skip is a failure of its whole purpose and
        # must be loud.
        #
        # Both halves are derived from source rather than hardcoded, because a
        # guard that drifts out of step with what it guards passes silently:
        #   - the skip text is read from pgtest.go, so rewording it cannot leave
        #     this grep matching nothing and reporting success;
        #   - the package list is the set that actually calls RequireDSN, so the
        #     count means "the real-Postgres packages ran". Counting every
        #     `--- PASS` in the module would be inert: the module has hundreds of
        #     tests that touch no database, so the total stays high even if every
        #     database suite vanished.
        run: |
          skip=$(sed -n 's/.*t\.Skip("\(no COMPASS_TEST_DATABASE_DSN[^"]*\)").*/\1/p' \
            internal/pgtest/pgtest.go)
          if [ -z "$skip" ]; then
            echo "::error::could not read the skip message out of internal/pgtest/pgtest.go — this guard has drifted from the harness and is no longer checking anything"
            exit 1
          fi
          if grep -qF "$skip" /tmp/pgtest.log; then
            echo "::error::pgtest harness skipped — the service Postgres was not reached, so nothing was asserted"
            grep -nF "$skip" /tmp/pgtest.log | head
            exit 1
          fi
          pkgs=$(grep -rl 'pgtest\.RequireDSN' --include='*.go' . \
            | sed 's|^\./||' | xargs -n1 dirname | sort -u)
          if [ -z "$pkgs" ]; then
            echo "::error::no package calls pgtest.RequireDSN — the harness moved and this guard is vacuous"
            exit 1
          fi
          rc=0
          for pkg in $pkgs; do
            if ! grep -qE "^ok[[:space:]]+github\.com/sealedsecurity/compass/go/$pkg[[:space:]]" /tmp/pgtest.log; then
              echo "::error::real-Postgres package '$pkg' did not report ok — it failed, skipped, or never ran"
              rc=1
            fi
          done
          echo "pgtest: checked $(printf '%s\n' "$pkgs" | wc -l) real-Postgres packages against the service database"
          exit "$rc"

      - name: Retrospect
        # Collapse the single job's flat task fan-out into per-task sections in
        # the Actions log, so a failure is one expand instead of a scroll. Reads
        # .moon/cache/{ci,run}Report.json — no token, no added permissions, so
        # `permissions: contents: read` above is untouched. `success() ||
        # failure()` so it still renders when the gate failed.
        #
        # This is third-party JS that runs on every event, fork PRs included, so
        # the SHA pin below IS its trust anchor — the same posture the pgtest
        # image digest and the nix substituter keys take for their own boundaries.
        # At the pinned commit the action takes no token, makes no network call,
        # and only reads and prints local cache files, so a fork PR cannot turn it
        # into an exfiltration or write path. Bump the pin deliberately (it rides
        # the same dependabot config as the other pinned actions), never drift it.
        if: success() || failure()
        uses: appthrust/moon-ci-retrospect@631a1e667f96e8ca893eab69f03e425f7fbfdc2b # v2.1.0

