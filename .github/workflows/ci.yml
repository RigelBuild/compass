# The remote gate for every pull request and every push to main, plus a nightly
# full sweep of main.
#
# ONE JOB, NOT A MATRIX — the central structural decision, made deliberately.
#
# A matrix fanning each moon task into its own job would give per-task check
# names and crisper failure attribution. It was rejected on one decisive
# ground: it can only be built by enumerating projects (or tasks) in YAML, and
# a project list in a workflow is a second source of truth for something
# .moon/workspace.yml already owns. That list goes stale silently. It has
# already happened in this repo's history — a fork tree shipped a functional-CI
# registration with no entry in the project map, so it read as covered and
# gated nothing. A YAML enumeration recreates exactly that failure at the CI
# layer: add a project, forget the matrix entry, and the gate goes quiet about
# it while still reporting green. moon discovers projects from
# .moon/workspace.yml, so a new project with a `ci` task is picked up the moment
# it is registered — no matrix entry to forget, which is why the arriving
# oh-my-pi fork needs no edit to this file.
#
# The costs of one job are real and accepted: a single check name to require,
# and the failing task named in the log rather than in the check list. moon
# already prints the failing target and only the failing target's output, so
# attribution costs one click, not a bisect.
#
# AFFECTED ON PRs, FULL ON MAIN. A pull request runs `moon ci :ci`, which runs
# only the projects the PR affects — a Go, UI, or docs PR never pays for the
# vendored forks' nix builds (the dominant cost, and the reason the CI job's
# timeout is 90m). The tradeoff is real and named: affected detection trusts
# each task's `inputs` globs to be complete, so an inputs glob that misses a
# file would skip a task that should have run — the same silent-skip class the
# matrix rationale above rejects. The backstop is that main is never gated by
# affected: every push to main AND a nightly `schedule` run the FULL `moon run
# :ci` — every task, every project, no filter. So an inputs gap a PR skipped is
# caught the moment the change lands on main (named and attributable), not left
# to hide; the nightly sweep re-checks main even on a quiet day. Fast affected
# path on PRs, exhaustive sweep on everything that reaches main.
#
# pgtest — the real-Postgres suites — runs as a step in the same `CI` job,
# after the moon battery, against a Postgres service container attached to the
# job. It was once a separate job to keep a Postgres-service outage from redding
# the hermetic gate; folded in so there is one required check, at the cost that a
# service-container flake now reds `CI` (a re-run clears it). The suites are
# build-tagged `pgtest`, so the moon battery's `go test ./...` never compiles
# them — the folded step below is the only thing that runs them.

name: CI

on:
  pull_request:
    # The default types (opened, synchronize, reopened) OMIT `edited`, which is
    # the only event fired when a PR's BASE branch is re-pointed. A stacked PR
    # whose base flips when the PR below it merges/closes fires only
    # `pull_request.edited` — with the default set, no fresh CI runs against the
    # new base and `gh run rerun` only replays the frozen stale merge SHA (a
    # phantom red against the dead base's tree; the only escape was close+reopen).
    # `edited` closes that gap. It also fires on title/body edits, so the job
    # below guards on `changes.base` to stay a no-op for everything but a real
    # base re-point — no added CI spend on a title/body edit.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    # Nightly full backstop: runs the whole battery over main so an incomplete
    # `inputs` glob the affected PR gate skipped cannot hide indefinitely.
    # 07:17 UTC, off the top-of-hour cron congestion GitHub throttles.
    - cron: '17 7 * * *'
  workflow_dispatch:
    # The forge fixture-regeneration lane (regen-forge-fixtures job below). It is
    # operator-triggered ONLY — the live `-update` capture rewrites the golden
    # testdata against the real testbed, whose PATs live only in Actions secrets,
    # so a local `-update` is impossible. The gate events above never trigger the
    # regen job (its own `if:` gates on this event name); this trigger exists
    # solely so an operator can dispatch a fixture refresh from the Actions tab.

# One in-flight run per ref per event action. A superseded push's run is
# answering a question nobody is asking any more. Both the event and its action
# are in the key so runs answering different questions about the same ref don't
# cancel each other: a nightly schedule and a coincident post-merge push
# (different events), and a PR's `opened`/`edited`/`synchronize` sub-actions
# (same event, different questions). That last case is load-bearing: jj-vine
# opens a PR, then ~1s later edits the body to add the stack diagram, and that
# `edited` run must not cancel the still-running real `opened` run — otherwise
# the required check ends cancelled+skipped (the edited run self-skips via the
# job `if` below) and reads as a false green.
#
# `push` and `schedule` payloads have no `action` field, so
# `${{ github.event.action }}` renders to a constant empty string for them —
# their grouping is unchanged by this key addition (every main push still
# collapses to `ci-<ref>-push-` and still cancels the prior one; a schedule run
# still coexists with a coincident push via the distinct event name). A PR
# branch's superseded pushes fire `pull_request.synchronize`, so they too share
# one group and collapse to one in-flight run per ref, as intended.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ github.event.action }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Gates (moon + pgtest)
    runs-on: ubuntu-latest
    # Skip only the no-op case of the `edited` trigger above: a PR title/body
    # edit that did NOT move the base. `changes.base` is present on the payload
    # only when the base branch was re-pointed, so a real base re-point still
    # runs (the whole reason `edited` is in the trigger set), while a title/body
    # edit is a no-op. push and schedule are not `pull_request` events, so the
    # first clause lets them through unconditionally. `workflow_dispatch` is
    # excluded: it exists solely to drive the regen-forge-fixtures job, which
    # carries its own `if:` — a fixture-regen dispatch has no business spinning
    # up the full 90-minute gate battery, so this job stays off it.
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
      github.event.action != 'edited' ||
      github.event.changes.base != null)
    # The vendored forks build through nix (devenv's Rust crates via its flake's
    # fenix pin), so this is a long job by construction.
    timeout-minutes: 90
    env:
      # A short temp root, because AF_UNIX sun_path is 108 bytes and the Go
      # suites bind sockets under `t.TempDir()`. The runner's default TMPDIR is
      # /home/runner/work/_temp — 22 bytes before the test's own name-derived
      # path — which pushes the runner and server socket tests past the cap and
      # fails them with a bare EINVAL from bind(2). /tmp is 4 bytes and leaves
      # the budget those tests were written against.
      #
      # A CI-shaped constraint, fixed in CI: the cap is real and the code's own
      # guards against it are elsewhere; nothing about this repo's sockets should
      # be redesigned around one runner's choice of temp root.
      TMPDIR: /tmp
    services:
      postgres:
        # Matches pgtest.go's pinned image: the suites assert on generated-tsvector
        # and websearch_to_tsquery behavior, which is major-version-sensitive.
        #
        # Pinned by DIGEST, not tag. `16-alpine` is mutable, so a repoint would
        # ship unreviewed container code into the gate and could change the
        # database behavior the suites assert on — with the tag unchanged, so
        # nothing in the diff would show it. The digest must stay equal to
        # pgtest.go's pgImage, or CI and a local run stop exercising the same
        # Postgres, which is the parity the line above claims.
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: compass-test
          POSTGRES_DB: compass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The drift gate's `git diff --no-index` needs real git; a shallow
          # single-ref checkout does not provide it.
          fetch-depth: 0

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          # The forks' functional CI is `nix build` of their own flakes, and the
          # whole toolchain — language runtimes AND the nixpkgs tools — is built
          # from nix below. Flakes are needed for the former; nix-command for both.
          #
          # The substituters below are declared here rather than delegated via
          # `accept-flake-config = true`. That setting makes nix accept the
          # `nixConfig` of ANY flake it evaluates, and the RigelBuild/devenv
          # flake the build fetches carries exactly such a block — so a PR could add its own substituter
          # AND its own trusted public key, and CI would fetch and run binaries
          # signed by the attacker's key, with signature verification satisfied
          # by the key the same PR supplied. Naming the two caches the forks
          # legitimately use keeps that trust in a reviewed file: adding a third
          # is a change to this workflow, not to a vendored tree.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the language toolchains on PATH
        # Phase one of the two-phase bootstrap. The language runtimes
        # (bun/node/moon/go) come from nix, not `setup-*` actions: gate-tools.nix's
        # `langs` output resolves the identical derivations the dev shell does —
        # bun/node/moon from tools/toolchain/toolchain-tools.nix, go from the
        # go-overlay applied to the devenv.lock-pinned nixpkgs — so CI runs the
        # pinned versions byte-for-byte and the parity gate has a concrete store
        # path to check each against. `langs` is a closed set, so it needs no
        # `--arg attrs` (the head defaults it).
        #
        # This must precede phase two: `--print-nix-attrs` runs under `bun`, so
        # bun has to be on PATH before that parse can run.
        run: |
          stores=$(nix eval --json -f tools/toolchain/gate-tools.nix langs \
            | jq -r '.[].store')
          # Fail closed locally rather than leaning on the absence of a
          # root-level flake.nix: with no installables `nix build` would build a
          # default package if one existed, so an empty `langs` must error here.
          [ -n "$stores" ] || {
            echo "::error::gate-tools.nix langs produced no store paths"
            exit 1
          }
          nix build --no-link $stores
          for store in $stores; do
            echo "$store/bin" >>"$GITHUB_PATH"
          done

      - name: Put the dev shell's nixpkgs tools on PATH
        # Phase two. buf, protoc, the Go analysis battery, biome and markdownlint
        # have no `setup-*` action that could reproduce a nixpkgs pin. Rather than
        # pick a close-enough release from some other channel and hope, CI
        # resolves the SAME derivations the dev shell does, from the nixpkgs
        # revision devenv.lock pins.
        #
        # The attribute list comes from the parity script's own parse of
        # devenv.nix (run under the bun that phase one just put on PATH), so what
        # CI installs and what the gate expects cannot disagree, and neither is
        # enumerated here.
        run: |
          attrs=$(bun tools/toolchain/parity.ts --print-nix-attrs)
          out=$(nix build --no-link --print-out-paths \
            -f tools/toolchain/gate-tools.nix env --arg attrs "$attrs")
          echo "$out/bin" >>"$GITHUB_PATH"
          # The dev-boot gate (apps/ui:dev-smoke) drives a headless Chromium
          # through Playwright, which resolves it from PLAYWRIGHT_CHROMIUM_PATH
          # (apps/ui/playwright.config.ts:31-33). chromium is Linux-only in
          # nixpkgs, so it is NOT in the parity `attrs` above (see devenv.nix) —
          # it is realized out-of-band here from its own pinned helper, the same
          # pattern the gtk3 e2e step uses for its browser stack. Read its
          # bin/chromium out-path straight into the env: a $GITHUB_PATH append
          # only affects SUBSEQUENT steps, so resolving `chromium` off PATH here
          # would find nothing and silently fall back to the dev-box path.
          chromium=$(nix build --no-link --print-out-paths \
            -f tools/toolchain/chromium-e2e-env.nix chromium)
          echo "PLAYWRIGHT_CHROMIUM_PATH=$chromium/bin/chromium" >>"$GITHUB_ENV"

      - name: Toolchain parity
        # Runs BEFORE the gate, though `:ci` schedules it again (it takes under a
        # second). A toolchain skew invalidates every result the gate is about to
        # produce, so finding out first is worth running it twice.
        run: bun tools/toolchain/parity.ts

      - name: CI (affected)
        # Pull requests only: run only what the PR affects. moon reads the base
        # from GITHUB_BASE_REF (the PR's target branch) via the ci_env crate and
        # diffs against it — see the AFFECTED section in the header for the
        # tradeoff and the backstop. Restricted to `pull_request` deliberately:
        # on a push GITHUB_BASE_REF is unset, so moon would fall back to
        # comparing vcs.defaultBranch against HEAD — which on a push to main is
        # main against its own tip, an empty diff that runs nothing and reports a
        # misleading green. So affected is the fast PR path; every landing on
        # main gets the full sweep below.
        if: github.event_name == 'pull_request'
        run: moon ci :ci

      - name: CI (full sweep)
        # Every push to main and the nightly schedule: the whole battery,
        # unconditionally. This is what makes the affected PR gate safe — an
        # incomplete `inputs` glob that let a task be skipped on a PR is caught
        # here the moment the change lands on main (and again nightly), named and
        # attributable, not left to hide indefinitely. `moon run :ci`, not `moon
        # ci`: affected detection would find nothing to do on a push to main.
        if: github.event_name != 'pull_request'
        run: moon run :ci


      - name: Real-Postgres suites
        working-directory: go
        env:
          # pgtest.go's documented CI-service path: with a DSN set the harness
          # uses this database (giving each test its own schema) instead of
          # managing a container.
          COMPASS_TEST_DATABASE_DSN: postgres://postgres:compass-test@127.0.0.1:5432/compass?sslmode=disable
          CGO_ENABLED: '1'
          # The harness SKIPS when it can reach no database — correct for a
          # container-less sandbox, but in CI the service Postgres above is
          # mandatory, so a skip here would silently pass nothing. Setting this
          # turns the no-DSN/no-runtime SKIP into a hard failure.
          COMPASS_REQUIRE_LIVE: '1'
        # -v so the assertion below can read per-test outcomes. The redirect —
        # rather than a pipe to tee — is deliberate: a pipeline's exit status is
        # its LAST command's, so `go test ... | tee` returns tee's 0 and a real
        # test failure is silently discarded (this job reported green over a
        # `FAIL` before this was fixed). Capture, replay the log, then exit on
        # go test's own status. `|| rc=$?` because the step runs under `bash -e`,
        # which would otherwise abort before the log is ever printed. The
        # explicit -timeout exceeds the job's slowest suite: on the default 10m a
        # wedged test panics mid-run and the panic, not the failure, is the story.
        run: |
          rc=0
          go test -tags pgtest -race -v -timeout 15m ./... >/tmp/pgtest.log 2>&1 || rc=$?
          cat /tmp/pgtest.log
          exit "$rc"

      - name: Assert the real-Postgres suites ran rather than skipped
        working-directory: go
        # The harness SKIPS (never fails) when it can find no database — correct
        # for a container-less sandbox, and a silent no-op here. This step exists
        # to run those assertions, so a skip is a failure of its whole purpose and
        # must be loud.
        #
        # Both halves are derived from source rather than hardcoded, because a
        # guard that drifts out of step with what it guards passes silently:
        #   - the skip text is read from pgtest.go, so rewording it cannot leave
        #     this grep matching nothing and reporting success;
        #   - the package list is the set that actually calls RequireDSN, so the
        #     count means "the real-Postgres packages ran". Counting every
        #     `--- PASS` in the module would be inert: the module has hundreds of
        #     tests that touch no database, so the total stays high even if every
        #     database suite vanished.
        run: |
          skip=$(sed -n 's/.*t\.Skip("\(no COMPASS_TEST_DATABASE_DSN[^"]*\)").*/\1/p' \
            internal/pgtest/pgtest.go)
          if [ -z "$skip" ]; then
            echo "::error::could not read the skip message out of internal/pgtest/pgtest.go — this guard has drifted from the harness and is no longer checking anything"
            exit 1
          fi
          if grep -qF "$skip" /tmp/pgtest.log; then
            echo "::error::pgtest harness skipped — the service Postgres was not reached, so nothing was asserted"
            grep -nF "$skip" /tmp/pgtest.log | head
            exit 1
          fi
          pkgs=$(grep -rl 'pgtest\.RequireDSN' --include='*.go' . \
            | sed 's|^\./||' | xargs -n1 dirname | sort -u)
          if [ -z "$pkgs" ]; then
            echo "::error::no package calls pgtest.RequireDSN — the harness moved and this guard is vacuous"
            exit 1
          fi
          rc=0
          for pkg in $pkgs; do
            if ! grep -qE "^ok[[:space:]]+github\.com/RigelBuild/compass/go/$pkg[[:space:]]" /tmp/pgtest.log; then
              echo "::error::real-Postgres package '$pkg' did not report ok — it failed, skipped, or never ran"
              rc=1
            fi
          done
          echo "pgtest: checked $(printf '%s\n' "$pkgs" | wc -l) real-Postgres packages against the service database"
          exit "$rc"

      - name: Detect whether this PR touches the forge contract surface
        id: forge_affected
        working-directory: go
        # PRs only. The live-contract oracle below is expensive (it drives a real
        # GitHub + Linear testbed over the network) and secret-bearing, so on a PR
        # it runs ONLY when the PR actually changes the forge surface it guards —
        # the same affected posture the one-job gate takes everywhere else. The
        # surface is two path sets: the forge package the suite exercises
        # (go/internal/forge/**) and this workflow file itself (a change to the
        # oracle's own wiring must re-run the oracle to prove the wiring).
        #
        # GitHub exposes no changed-paths primitive to a step `if:`, so — exactly
        # as the dogfood job resolves image_affected into $GITHUB_OUTPUT for its
        # own `if:` to read — this step computes the boolean and the oracle's
        # `if:` reads steps.forge_affected.outputs.forge_affected. The checkout is
        # fetch-depth 0 (see the checkout step), so the base branch's history is
        # present locally; GITHUB_BASE_REF names the PR's base. `git diff
        # --name-only origin/$GITHUB_BASE_REF...HEAD` lists the PR's changed files
        # against the merge-base, and the grep is the path filter. Paths are
        # repo-relative (this step's working-directory is go/, but git reports
        # from the repo root), so the forge glob is the full go/internal/forge/
        # prefix. On push/schedule this step never runs (the `if:` below), so the
        # output is unset and the oracle's push/schedule arms carry it regardless.
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${GITHUB_BASE_REF}"
          # Fail LOUD if the base ref does not resolve rather than swallowing the
          # error as "not affected" (mirrors the gtk3-affected gate): an
          # unresolvable base (e.g. a stacked PR's base churning under a
          # pull_request.edited re-point) must red the gate, never skip it green.
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "::error::forge affected gate: base ref $base does not resolve — cannot compute the affected set"
            exit 1
          fi
          changed=$(git diff --name-only "$base...HEAD")
          if printf '%s\n' "$changed" \
            | grep -qE '^(go/internal/forge/|\.github/workflows/ci\.yml$)'; then
            echo "forge_affected=true" >>"$GITHUB_OUTPUT"
          else
            echo "forge_affected=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Detect whether the live-oracle credentials are provisioned
        id: forge_creds
        # STAGING GATE (design §399-403 "Required-blocking activation ordering":
        # the required-blocking flip activates AFTER the testbed is provisioned;
        # skip-mode in the interim is the decided staging order). The oracle's
        # skip-guard below turns a credential-less skip into a HARD failure — so
        # until RIG-2345 lands the LIVEGITHUB_*/LINEAR_FORGE Actions secrets, a
        # push-to-main or nightly run would red the build on a skip that is
        # CORRECT for an unprovisioned testbed. This step resolves whether the
        # GitHub trio AND the Linear pair are present (secrets are not readable in
        # a step `if:`, only in `env:`/`run:`, so — exactly like forge_affected —
        # it computes the boolean into $GITHUB_OUTPUT for the oracle + guard `if:`
        # to read) and both gate on it. All FIVE are required together because the
        # two providers are CO-EQUAL and both in scope now (design §525-526), and
        # the guard below asserts BOTH the GitHub and the Linear leg ran: coupling
        # the gate to the full set keeps the oracle fully dormant until the whole
        # testbed is provisioned, so a half-provisioned window (say GitHub secrets
        # land before the Linear pair) cannot half-run and red on the still-skipped
        # Linear leg. While unprovisioned the oracle + guard skip cleanly
        # (dormant-green); the moment all secrets land the gate flips true and
        # enforcement activates with no further edit. The FINAL RIG-2230 step,
        # after provisioning is confirmed, removes this have_creds clause so a
        # later secret-drop can no longer silently disable the required oracle.
        env:
          LIVEGITHUB_REPO: ${{ secrets.LIVEGITHUB_REPO }}
          LIVEGITHUB_AUTHOR_TOKEN: ${{ secrets.LIVEGITHUB_AUTHOR_TOKEN }}
          LIVEGITHUB_REVIEWER_TOKEN: ${{ secrets.LIVEGITHUB_REVIEWER_TOKEN }}
          LINEAR_FORGE: ${{ secrets.LINEAR_FORGE }}
          LINEAR_FORGE_TEAM: ${{ secrets.LINEAR_FORGE_TEAM }}
        run: |
          if [ -n "$LIVEGITHUB_REPO" ] && [ -n "$LIVEGITHUB_AUTHOR_TOKEN" ] \
            && [ -n "$LIVEGITHUB_REVIEWER_TOKEN" ] && [ -n "$LINEAR_FORGE" ] \
            && [ -n "$LINEAR_FORGE_TEAM" ]; then
            echo "have_creds=true" >>"$GITHUB_OUTPUT"
          else
            echo "have_creds=false" >>"$GITHUB_OUTPUT"
            echo "forge live-oracle credentials not yet provisioned (RIG-2345); the oracle stays in skip mode this run"
          fi

      - name: Forge live-contract oracle
        working-directory: go
        # The live-contract oracle: the build-tagged `livegithub` suite driven
        # against a real GitHub + Linear testbed, proving the forge providers
        # honor the contract the golden fixtures (leg 1) replay offline. It is a
        # DEDICATED step, not a moon-battery task, for the same reason the pgtest
        # and gtk3 gates are: it is build-tagged (`livegithub`) so moon's untagged
        # `go test ./...` never compiles it, and it needs an environment the bare
        # moon gate has no business realizing — live testbed credentials.
        #
        # THE TRI-EVENT CONDITION (design record §376-386). The oracle runs when:
        #   - a pull_request AND its head is the SAME repo (not a fork) AND the
        #     forge surface is affected — the fork guard is the Global-Constraints
        #     secret boundary (a fork PR cannot be trusted with testbed creds, and
        #     GitHub withholds them from it anyway, so a fork PR SKIPS rather than
        #     fails); the affected guard is the per-PR cost filter above; OR
        #   - a push to main, unconditionally with secrets; OR
        #   - the nightly schedule, unconditionally with secrets.
        # push and schedule are the backstop: they carry no `github.event.pull_request`
        # (so the same-repo/affected clauses would null out), which is exactly why
        # the condition is an explicit OR across the three events, NOT one same-repo
        # guard ANDed across all of them (that form nulls the oracle out on
        # push/schedule — design §376-379).
        if: >-
          (
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            steps.forge_affected.outputs.forge_affected == 'true') ||
           github.event_name == 'push' ||
           github.event_name == 'schedule') &&
          steps.forge_creds.outputs.have_creds == 'true'
        env:
          # The T2 env contract (design §358-362, §431-436): the GitHub live legs
          # gate on the LIVEGITHUB_* trio, the Linear live legs gate independently
          # on LINEAR_FORGE (+ its team). All from repo Actions secrets — never
          # available to a fork PR, which is why the fork arm of the `if:` skips.
          LIVEGITHUB_REPO: ${{ secrets.LIVEGITHUB_REPO }}
          LIVEGITHUB_AUTHOR_TOKEN: ${{ secrets.LIVEGITHUB_AUTHOR_TOKEN }}
          LIVEGITHUB_REVIEWER_TOKEN: ${{ secrets.LIVEGITHUB_REVIEWER_TOKEN }}
          LINEAR_FORGE: ${{ secrets.LINEAR_FORGE }}
          LINEAR_FORGE_TEAM: ${{ secrets.LINEAR_FORGE_TEAM }}
          # -race needs cgo, matching go/moon.yml's race lane (§431-436). Without
          # it `go test -race` refuses to build.
          CGO_ENABLED: '1'
        # Same capture-replay-exit shape as the pgtest and dogfood suites above:
        # the redirect — not a `| tee` pipeline, whose exit status is tee's 0 and
        # would swallow a FAIL — then replay the log, then exit on go test's own
        # status. `|| rc=$?` because the step runs under `bash -e`, which would
        # otherwise abort before the log is ever printed. The explicit -timeout is
        # finite headroom for a run that drives a live testbed over the network.
        run: |
          rc=0
          go test -tags livegithub -race -v -timeout 10m ./internal/forge/... >/tmp/forge-oracle.log 2>&1 || rc=$?
          cat /tmp/forge-oracle.log
          exit "$rc"

      - name: Assert the forge live-contract oracle ran rather than skipped
        working-directory: go
        # The live legs t.Skip (never fail) when their credentials are unset —
        # correct for a container-less sandbox, but a silent no-op here. A required
        # step that let that skip pass would be VACUOUSLY green, so this guard makes
        # a credential-less run loud. It carries the IDENTICAL `if:` as the oracle
        # step above: on a PR that LEGITIMATELY skipped the oracle (fork head, or an
        # unaffected forge surface) this guard must skip too, or it would red an
        # otherwise-green build for a skip that was correct.
        #
        # The skip text is derived from source, not hardcoded, matching the pgtest
        # guard's discipline (§388-389): a guard that drifts out of step with what
        # it guards passes silently. Each provider's live legs carry their own
        # stable one-line skip literal — the GitHub legs `const liveSkipMessage`,
        # the Linear legs `const liveLinearSkipMessage` — kept greppable for
        # exactly this read; sed extracts each verbatim. BOTH are asserted because
        # the providers are CO-EQUAL and both required (design §525-526): asserting
        # only the GitHub leg would leave a permanent vacuous-green hole where the
        # Linear live-contract leg silently skips (e.g. a LINEAR_FORGE rotation to
        # empty) yet the required check stays green — a hole that would survive the
        # final removal of the have_creds staging clause. The have_creds gate
        # already couples all five secrets, so under normal provisioning both legs
        # run together; these two assertions are the source-derived backstop that
        # a partial credential state cannot pass green.
        if: >-
          (
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            steps.forge_affected.outputs.forge_affected == 'true') ||
           github.event_name == 'push' ||
           github.event_name == 'schedule') &&
          steps.forge_creds.outputs.have_creds == 'true'
        run: |
          src=internal/forge/livegithub_test.go
          ghskip=$(sed -n 's/.*liveSkipMessage = "\(.*\)"/\1/p' "$src")
          lnskip=$(sed -n 's/.*liveLinearSkipMessage = "\(.*\)"/\1/p' "$src")
          if [ -z "$ghskip" ] || [ -z "$lnskip" ]; then
            echo "::error::could not read the skip messages out of $src (github='$ghskip' linear='$lnskip') — this guard has drifted from the harness and is no longer checking anything"
            exit 1
          fi
          if grep -qF "$ghskip" /tmp/forge-oracle.log; then
            echo "::error::forge live-contract oracle skipped the GitHub legs — the LIVEGITHUB_* credentials were not reached, so nothing was asserted"
            grep -nF "$ghskip" /tmp/forge-oracle.log | head
            exit 1
          fi
          if grep -qF "$lnskip" /tmp/forge-oracle.log; then
            echo "::error::forge live-contract oracle skipped the Linear legs — the LINEAR_FORGE credential was not reached, so the co-equal Linear contract was not asserted"
            grep -nF "$lnskip" /tmp/forge-oracle.log | head
            exit 1
          fi
          if ! grep -qE "^ok[[:space:]]+github\.com/RigelBuild/compass/go/internal/forge[[:space:]]" /tmp/forge-oracle.log; then
            echo "::error::the forge live-contract package did not report ok — it failed, skipped, or never ran"
            exit 1
          fi
          echo "forge oracle: the live-contract suite ran both the GitHub and Linear legs against the testbed and reported ok"

      - name: Multi-window gtk3 e2e gate
        # The ONE CI lane that compiles + runs the native app (Wails v3,
        # go/cmd/compass-app) — the multi-window smoke gate (design record
        # compass-multi-window §M4). It is a DEDICATED step, not a moon-battery
        # task, for the same reason the pgtest suite above is: it is build-tagged
        # (unix,gtk3) so `moon`'s untagged `go test ./...` never compiles it, and
        # it needs an environment the bare moon gate has no business realizing —
        # a virtual framebuffer (the real GTK3/WebKit shell opens windows) and
        # the heavy WebKitGTK cgo-link closure. The per-PR moon battery stays
        # GTK-free; this step realizes the closure out of band via
        # tools/toolchain/gtk-e2e-env.nix (pinned to the SAME devenv.lock nixpkgs
        # the dev shell links against), so a dev box and CI run byte-for-byte the
        # same libraries.
        #
        # AFFECTED-GUARDED to match the one-job affected posture: on a PR it runs
        # only when go/cmd/compass-app/ actually changed (the native app is the
        # only tree whose behavior it gates), so a Go/UI/docs PR never pays the
        # WebKitGTK realization. push-to-main and the nightly schedule always run
        # it (the full-sweep backstop), matching the moon affected/full split.
        if: success()
        working-directory: go
        env:
          CGO_ENABLED: '1'
        run: |
          # Decide whether this event must run the gate.
          run_it=1
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="origin/${GITHUB_BASE_REF}"
            # fetch-depth:0 (job checkout) gives the base ref for the diff. Fail
            # LOUD if it does not resolve rather than swallowing the error as
            # "not affected": an unresolvable base (e.g. a stacked PR's base
            # churning under a pull_request.edited re-point) must red the gate,
            # never skip it green. No `|| true` on the diff for the same reason —
            # under `bash -e` a genuine diff failure aborts the step.
            if ! git -C .. rev-parse --verify --quiet "$base" >/dev/null; then
              echo "::error::gtk3 e2e affected gate: base ref $base does not resolve — cannot compute the affected set"
              exit 1
            fi
            changed=$(git -C .. diff --name-only "$base"...HEAD -- go/cmd/compass-app/)
            if [ -z "$changed" ]; then
              run_it=0
            fi
          fi
          if [ "$run_it" = 0 ]; then
            echo "gtk3 e2e: PR does not touch go/cmd/compass-app/ — skipping (affected gate)"
            exit 0
          fi

          # Realize the out-of-band gtk3 env, ALL parts via `nix build` (not
          # `nix eval`): xvfb-run (+ its Xvfb) + pkg-config on PATH, the
          # WebKitGTK pkg-config closure, and the nixpkgs C toolchain. `nix
          # build` is what actually builds each into this runner's store; a `nix
          # eval --raw` of a search-path string strips nix's store context, so
          # the `.pc` paths it prints would name derivations nix never built and
          # the cgo link fails "No package 'glib-2.0' found". All pinned to
          # devenv.lock's nixpkgs via the helper.
          helper=../tools/toolchain/gtk-e2e-env.nix
          binenv=$(nix build --no-link --print-out-paths -f "$helper" bin)
          pcenv=$(nix build --no-link --print-out-paths -f "$helper" pkgConfig)
          # cc.out, not the bare `cc`: the cc-wrapper is multi-output (out, man,
          # info) and `nix build --print-out-paths` of the derivation prints
          # ALL of them, so a bare `cc` captures two lines and CC resolves to
          # the `-man` dir. The `.out` selector pins the one output with bin/cc.
          ccenv=$(nix build --no-link --print-out-paths -f "$helper" cc.out)
          PKG_CONFIG_PATH="$pcenv/lib/pkgconfig:$pcenv/share/pkgconfig"
          export PKG_CONFIG_PATH
          export PATH="$binenv/bin:$PATH"
          # Link the cgo objects with the nixpkgs toolchain, NOT the runner's
          # /usr/bin/gcc: WebKitGTK from this nixpkgs is built against glibc
          # 2.42, so the system gcc's older libc fails to link
          # libwebkit2gtk-4.1.so ("undefined reference to
          # `__inet_pton_chk@GLIBC_2.42'"). The cc-wrapper carries the matching
          # glibc and rpaths + interp-stamps the store libs, so the test binary
          # is self-contained on a non-NixOS runner. This is the toolchain a dev
          # box links with implicitly, so CI now matches it byte-for-byte.
          export CC="$ccenv/bin/cc"
          export CXX="$ccenv/bin/c++"

          # xvfb-run -a auto-picks a free display. The Xvfb SERVER log goes to a
          # real file (-e), NOT /dev/stdout: with the step's own `>… 2>&1`
          # redirect already pointing fd 1 at the go-test log, `-e /dev/stdout`
          # makes xvfb-run reopen that fd for the server log and the fd juggling
          # swallows the child's stdout — the go-test output never reaches the
          # file, so the PASS-line guard below fires on an empty log even though
          # the e2e passed. A dedicated server-log file avoids the collision and
          # is replayed only on failure, where a bring-up error is what matters.
          # Capture-then-replay + explicit exit so a FAIL is never masked (same
          # discipline as the pgtest step above).
          #
          # No -race here (the pgtest step uses it): this is a cgo+GTK smoke lane
          # where -race is slow and noisy, and the driver-goroutine / InvokeSync
          # handoffs it would cover are already exercised under -race by the
          # untagged unit suite. The omission is deliberate.
          rc=0
          xvfb-run -a -e /tmp/xvfb-server.log \
            go test -tags 'unix gtk3' -run 'E2E' -count=1 -v -timeout 10m \
            ./cmd/compass-app/ >/tmp/gtk3-e2e.log 2>&1 || rc=$?
          cat /tmp/gtk3-e2e.log
          # Guard against a silent no-op: the gate must have PASSED the e2e, not
          # merely started it. Assert the PASS line, not `=== RUN`: `go test -v`
          # prints `=== RUN <name>` BEFORE the body runs, so a `t.Skip` (no
          # display came up, or any future skip condition) still emits RUN — a
          # RUN-grep would read a skipped, assertion-free run as green. The PASS
          # grep fails on skip, on no-run, and on a build-tag regression that
          # drops the test; a genuine FAIL is still caught by `exit "$rc"`. This
          # is the polarity the pgtest step uses (it fails on the SKIP message).
          if ! grep -q -- '--- PASS: TestMultiWindowCloseCancelsOnlyClosingWindowE2E' /tmp/gtk3-e2e.log; then
            echo "::error::gtk3 e2e gate did not PASS TestMultiWindowCloseCancelsOnlyClosingWindowE2E — it skipped (no display came up), the build tag broke, or the test did not run"
            echo "--- Xvfb server log (bring-up diagnostics) ---"
            cat /tmp/xvfb-server.log 2>/dev/null || echo "(no Xvfb server log)"
            exit 1
          fi
          exit "$rc"

      - name: Retrospect
        # Collapse the single job's flat task fan-out into per-task sections in
        # the Actions log, so a failure is one expand instead of a scroll. Reads
        # .moon/cache/{ci,run}Report.json — no token, no added permissions, so
        # `permissions: contents: read` above is untouched. `success() ||
        # failure()` so it still renders when the gate failed.
        #
        # This is third-party JS that runs on every event, fork PRs included, so
        # the SHA pin below IS its trust anchor — the same posture the pgtest
        # image digest and the nix substituter keys take for their own boundaries.
        # At the pinned commit the action takes no token, makes no network call,
        # and only reads and prints local cache files, so a fork PR cannot turn it
        # into an exfiltration or write path. Bump the pin deliberately (it rides
        # the same dependabot config as the other pinned actions), never drift it.
        if: success() || failure()
        uses: appthrust/moon-ci-retrospect@631a1e667f96e8ca893eab69f03e425f7fbfdc2b # v2.1.0

  dogfood-e2e:
    name: Dogfood e2e (deterministic full-stack tier)
    runs-on: ubuntu-latest
    # A DEDICATED job in a PRIVILEGED container, split off from `gates`, for one
    # reason: the image-affected seed path. On a PR that changes the image
    # closure the gate builds the agent image from THIS tree and copies it into
    # local containers-storage (`nix run …#devenv -- container copy agent`,
    # skopeo `nix:` → `containers-storage:`). That copy needs the equivalent of
    # `podman unshare` — a nested user namespace — which the bare `ubuntu-latest`
    # runner denies (`Error during unshare(...): Operation not permitted`;
    # skopeo#2377, actions/runner-images#10443). `podman run` works there (the
    # pulled-image legs execute), but the copy-to-storage does not. A privileged
    # container is the reliable way to grant the userns caps that copy needs
    # (the redhat-actions / travier pattern), so the from-tree seed runs here
    # rather than in `gates`.
    #
    # It is its OWN job, not `gates` wrapped in a container, so `gates` stays on
    # the bare runner: wrapping the whole job would flip its Postgres service
    # from 127.0.0.1 to the `postgres` service hostname (containerized jobs reach
    # services by label) and break the Real-Postgres step's DSN. This tier needs
    # no Postgres service anyway — it stands up its OWN private postgres
    # (go/cmd/compass-postgres) inside the stack. The cost is a second nix +
    # toolchain bootstrap; the `CI` rollup below keeps the single required check.
    container:
      # A glibc≥2.27 image carrying podman + newuidmap: the runner mounts its
      # node20 (dynamically linked) into the container to run the JS actions
      # below, so a musl or ancient-glibc image breaks checkout at
      # `/__e/node20/bin/node`. quay.io/podman/stable is Fedora-based (recent
      # glibc) and ships the rootless podman + shadow-utils stack (subuid/subgid
      # preconfigured for its `podman` user) this job needs. --privileged is what
      # lets rootless podman-in-a-container work at all here: the podman user's
      # nested user namespaces (for `podman unshare`, image pulls, and the e2e's
      # own agent-container spawns) need the userns + mount caps the default
      # container sandbox withholds.
      image: quay.io/podman/stable@sha256:663e0dbf407987b7db3f20d3588c283a8228db17b282d2029a482d4d47e36964
      options: --privileged
    # Mirror the `gates` guard: skip the no-op `edited` (title/body) case, and
    # stay off `workflow_dispatch` (regen-only — see the gates guard).
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
      github.event.action != 'edited' ||
      github.event.changes.base != null)
    timeout-minutes: 60
    env:
      # Same short temp root as `gates`: the e2e suite binds AF_UNIX sockets
      # under t.TempDir() and the 108-byte sun_path cap needs the budget.
      TMPDIR: /tmp
      # The rootless runtime dir for the podman user. Without it, containers
      # (skopeo's containers-storage write in the seed, and the e2e's own agent
      # spawns) default their runroot to the system `/run/containers`, which the
      # non-root podman user cannot create (`mkdir /run/containers: permission
      # denied`). Pointing XDG_RUNTIME_DIR at a podman-owned dir (created in prep)
      # puts the rootless runroot there instead. `-E` on the step shell forwards
      # it across the user switch.
      XDG_RUNTIME_DIR: /run/user/1000
    # Every `run:` step executes as the image's built-in rootless `podman` user
    # (uid 1000), NOT root. The container itself must stay root (no `--user`): the
    # root-only prep step below needs to create /nix and grant sudo, which a
    # non-root container user cannot do. But the WORK must not run as root,
    # because the self-hosted postgres this tier stands up
    # (go/cmd/compass-postgres) runs initdb/postgres, and PostgreSQL refuses to
    # run as root by design (`initdb: cannot be run as root`). Running every step
    # as one consistent non-root uid — the purpose-built rootless `podman` user,
    # which already has subuid/subgid configured — makes postgres, rootless
    # podman storage, the nix build, and the image seed all agree, matching how
    # the suite runs locally (a normal non-root user).
    #
    # `defaults.run.shell` runs each step through the `/usr/local/bin/podman-step`
    # wrapper the prep step writes. The wrapper is spawned by the runner as the
    # container user (root), does the one thing that MUST be root, then drops to
    # the podman user for the step body:
    #   - GitHub's `$GITHUB_PATH` / `$GITHUB_OUTPUT` are runner-created files owned
    #     by root (mode 644). The steps below append to them (toolchain bin dirs,
    #     the image_affected flag), which the non-root podman user cannot do — so
    #     the wrapper first `chmod`s the per-step file-command dir writable while
    #     it is still root, then execs the body as podman. Doing this in the
    #     wrapper (not a step) is what lets every step keep using the standard
    #     `>>"$GITHUB_PATH"` idiom unchanged.
    #   - `sudo -u podman -E` preserves the runner env across the user switch
    #     (the `$GITHUB_*` vars, `$GITHUB_BASE_REF` for moon's detection); `-E` is
    #     permitted by the `SETENV:` tag on the podman sudoers line prep writes.
    #   - explicit `env "PATH=…"` overrides the one var `-E` cannot carry (sudo
    #     resets PATH via secure_path): the runner-built PATH FIRST (its nix +
    #     toolchain bin dirs win), then the standard system dirs appended
    #     (`:/usr/local/bin:/usr/bin:/bin`), which the runner's PATH omits inside
    #     this container so `mktemp`/`curl`/`sh`/`git` resolve. bash is absolute
    #     (/usr/bin/bash) because `env "PATH=…"` resolves the interpreter against
    #     that PATH. HOME is pinned to the podman user's home (over the runner's
    #     /github/home) so nix and the go/bun/moon caches resolve there.
    # `uses:` steps (checkout) ignore this shell and still run as root — their
    # output is world-readable, which is all the podman steps need from them.
    defaults:
      run:
        shell: podman-step {0}
    steps:
      - name: Provision the container as root (prep for the podman user)
        # The ONLY step that runs as root — it overrides the job's default
        # podman-user shell (see `defaults.run` above) with a plain root bash to
        # set up everything the non-root work needs, none of which the podman user
        # could do itself:
        #   - gcc + jq + xz + procps-ng: this minimal Fedora image lacks them,
        #     and the bare ubuntu runner had them ambiently. gcc for `go test
        #     -race` (cgo); jq for the toolchain bootstrap parse + the Detect
        #     step's moon JSON; xz for the nix installer tarball; procps-ng for
        #     `ps`, which the e2e harness reads the live compass-runner's argv
        #     from (harness_test.go assertRunnerHasConfiguredFlags reads the
        #     process table to prove the configured flags reached the runner).
        #   - /nix owned by the podman user: the nix single-user install below
        #     runs AS podman and needs to own the store (the installer does
        #     `mkdir /nix` as root normally; here we pre-create it owned by
        #     podman so a non-root install can populate it).
        #   - /run/user/1000 owned by the podman user: the rootless runtime dir
        #     $XDG_RUNTIME_DIR (job env) points at, so containers-storage puts its
        #     runroot there instead of the root-only /run/containers.
        #   - /home/podman/.config/containers/containers.conf with
        #     netns = "bridge": the e2e stands up agent containers via rootless
        #     podman NESTED inside this privileged container (podman-in-podman).
        #     Each agent container's root entrypoint arms an nftables egress
        #     firewall (runtime/egress.go); but the default rootless netns
        #     (pasta/slirp4netns) does not give a doubly-nested netns a
        #     manageable nftables — `nft add table` fails EPERM even with
        #     CAP_NET_ADMIN present in the exec's effective set. A bridge netns
        #     (netavark) is owned by the nested user namespace, so nft works.
        #     Single-level rootless — the production model a normal dev box and
        #     the real runner use — takes the default netns and is unaffected;
        #     this reshapes only the CI nesting, not the product or its egress
        #     security property (default-deny + allowlist is armed identically).
        #   - passwordless sudo for podman WITH the SETENV tag: every work step
        #     runs via `sudo -u podman -E` (see `defaults.run` above), and `-E`
        #     (preserve the runner's environment across the user switch) is only
        #     permitted when the sudoers rule carries `SETENV:`. The nix installer
        #     also shells `sudo` in single-user mode. The image grants the podman
        #     user no sudo by default.
        #   - git safe.directory system-wide: GitHub checks the repo out as the
        #     host runner uid, but the podman user reads it — without this, git
        #     (and moon's affected-detection, which shells git) fails with
        #     `detected dubious ownership`. `--system` so the podman user sees it;
        #     `*` covers the vendored forks under the tree (each a git-aware moon
        #     project).
        #   - /usr/bin/podman-step: the wrapper `defaults.run.shell` runs every
        #     other step through (see the job's `defaults.run` comment). GitHub
        #     resolves a custom shell's command via $PATH, so it is named bare
        #     (`podman-step {0}`) — an absolute-path custom shell trips the
        #     runner's .NET path parser ("Second path fragment must not be a
        #     drive or UNC name"). It lands in /usr/bin (always on the runner's
        #     PATH) and is written here, while root, because it must exist before
        #     the first podman step and only root can install it and chmod the
        #     runner's file-command files.
        shell: bash -e {0}
        run: |
          dnf install -y --setopt=install_weak_deps=False gcc jq xz procps-ng
          install -d -m 0755 -o podman -g podman /nix
          install -d -m 0700 -o podman -g podman /run/user/1000
          install -d -m 0755 -o podman -g podman \
            /home/podman/.config /home/podman/.config/containers
          cat >/home/podman/.config/containers/containers.conf <<'CONF'
          [containers]
          netns = "bridge"
          CONF
          chown podman:podman /home/podman/.config/containers/containers.conf
          echo "podman ALL=(ALL) NOPASSWD: SETENV: ALL" >/etc/sudoers.d/podman
          git config --system --add safe.directory '*'
          cat >/usr/bin/podman-step <<'WRAP'
          #!/usr/bin/env bash
          # Run one GitHub step as the rootless podman user. The runner spawns
          # this as root; make the per-step file-command files (owned root, 644)
          # writable so the podman body can append to $GITHUB_PATH/$GITHUB_OUTPUT,
          # then drop to podman preserving env, fixing PATH, and pinning HOME.
          set -e
          [ -n "$RUNNER_TEMP" ] && chmod -R a+rw "$RUNNER_TEMP/_runner_file_commands" 2>/dev/null || true
          exec sudo -u podman -E env "PATH=$PATH:/usr/local/bin:/usr/bin:/bin" HOME=/home/podman /usr/bin/bash -e "$1"
          WRAP
          chmod 0755 /usr/bin/podman-step

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Hand the checkout to the podman user (as root)
        # actions/checkout runs as the container user (root), so the worktree
        # lands root-owned. The podman user that runs every step below must WRITE
        # into it — moon drops its cache at .moon/cache, and the seed's nix build
        # from agent-image/ writes there too — so a read-only (safe.directory)
        # grant is not enough; without ownership moon fails with
        # `Failed to create .moon/cache: Permission denied`. chown the whole
        # checkout to podman. Overrides the default podman shell (only root can
        # chown), so it is one of the two root steps in this job.
        shell: bash -e {0}
        run: chown -R podman:podman "$GITHUB_WORKSPACE"

      - name: Install Nix (single-user, as the podman user)
        # This REPLACES cachix/install-nix-action, which cannot serve this job:
        # the action installs as the container user (root), and with no systemd in
        # the container it does a SINGLE-USER install whose store database is
        # root-owned — so the non-root podman user that runs every other step
        # could not `nix build` (the image seed needs a build). Installing nix AS
        # the podman user (this step runs under the job's default podman shell)
        # puts the store db under the same uid that later builds and seeds.
        #
        # `build-users-group =` (empty) selects the single-user build model (no
        # nixbld group in this image). `--no-channel-add` matches the action; the
        # installer is pinned to the same nix version the action installs (2.35.1).
        # The profile bin dir goes on $GITHUB_PATH so the toolchain steps below
        # find `nix`. The nix.conf details are documented at the `run:` below.
        run: |
          # The nix config the podman user reads on every `nix` call. Written to
          # BOTH the installer's --nix-extra-conf-file (so the install itself honors
          # build-users-group =) AND the podman user's own ~/.config/nix/nix.conf
          # (so `nix eval`/`nix build` in the steps below see nix-command + flakes;
          # the system /etc/nix/nix.conf the installer writes is not consulted for a
          # single-user install run as a normal user). Mirrors the `gates`
          # install-nix-action config exactly — the SAME two cache substituters +
          # trusted keys the vendored forks use, never `accept-flake-config` (which
          # would trust a PR-supplied substituter + key).
          conf=$(mktemp)
          cat >"$conf" <<'NIXCONF'
          build-users-group =
          experimental-features = nix-command flakes
          extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
          extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=
          NIXCONF
          # Pin the installer by content hash, not just version+TLS: the gates
          # job gets its nix from a SHA-pinned action, so this bare curl must not
          # be the one unverified fetch feeding a --privileged job that then holds
          # passwordless sudo and builds+loads the agent image. Fail closed if the
          # published bytes ever differ from the reviewed pin.
          curl -fsSL https://releases.nixos.org/nix/nix-2.35.1/install -o /tmp/install-nix
          echo "34e0ef63ec1f3e552e15069660afd9a0a23f69009e340c33067595252888286c  /tmp/install-nix" \
            | sha256sum -c -
          sh /tmp/install-nix --no-daemon --no-channel-add --nix-extra-conf-file "$conf"
          mkdir -p /home/podman/.config/nix
          cp "$conf" /home/podman/.config/nix/nix.conf
          echo "/home/podman/.nix-profile/bin" >>"$GITHUB_PATH"

      - name: Put the language toolchains on PATH
        # The dogfood seed's `moon query tasks --affected` and the e2e `go test`
        # need the same nix-pinned toolchain the gates job builds. Phase one:
        # bun/node/moon/go from gate-tools.nix's `langs` (see the gates job for
        # the two-phase rationale). Duplicated here because this is a separate
        # job with its own runner filesystem.
        run: |
          stores=$(nix eval --json -f tools/toolchain/gate-tools.nix langs \
            | jq -r '.[].store')
          [ -n "$stores" ] || {
            echo "::error::gate-tools.nix langs produced no store paths"
            exit 1
          }
          nix build --no-link $stores
          for store in $stores; do
            echo "$store/bin" >>"$GITHUB_PATH"
          done

      - name: Put the dev shell's nixpkgs tools on PATH
        # Phase two: the nixpkgs tools (buf, the Go battery, …) from the parity
        # script's own parse of devenv.nix, run under the bun phase one added.
        run: |
          attrs=$(bun tools/toolchain/parity.ts --print-nix-attrs)
          out=$(nix build --no-link --print-out-paths \
            -f tools/toolchain/gate-tools.nix env --arg attrs "$attrs")
          echo "$out/bin" >>"$GITHUB_PATH"

      - name: Detect whether this PR changes the compass-agent image
        id: image_affected
        # PRs only. Whether the e2e gate must test a LOCALLY-BUILT image or the
        # published `:latest` turns on one question — does this PR change the
        # image's inputs? — and the answer already lives in one place: the
        # `compass-agent-image` build task's `inputs` globs (agent-image/moon.yml),
        # which mirror publish-agent-image.yml's on.push.paths (the reviewed
        # source of truth for what changes the published artifact).
        #
        # The discriminator is `moon query tasks --affected --project
        # compass-agent-image`: it intersects the PR's changed files with that
        # build task's `inputs`, so the detection cannot drift from what actually
        # rebuilds the image — the same anti-silent-staleness doctrine the matrix
        # rationale in this file's header rejects a hand-kept project list for.
        # It must be `tasks --affected`, NOT `projects --affected`: the latter
        # walks the PROJECT graph (a project is affected only when its own sources
        # or a project it `dependsOn` changed) and never consults a project's
        # cross-tree task `inputs`. The image project's sources are `agent-image/`
        # alone with no `dependsOn`, so a change confined to
        # `packages/compass-agent/**` — in the image's `build.inputs` but the
        # compass-agent PROJECT's tree — is invisible to `projects --affected`,
        # and the gate would silently pull and test a stale published image.
        # moon resolves the base from GITHUB_BASE_REF. `moon query tasks` prints
        # a JSON envelope on stdout UNCONDITIONALLY — an unaffected project
        # yields `{"tasks": {}, "options": {…}}`, not empty output — so the
        # signal is the discriminator: populated `.tasks` = affected (build from
        # tree), empty = not (fall to the pull branch below); the non-PR path
        # never runs this step, so image_affected is unset and the seed step's
        # `!= true` also pulls. moon's own exit is checked SEPARATELY from jq:
        # under pipefail a `moon query` that ITSELF exits non-zero (moon error,
        # renamed id, transient) would sink the pipe, fall to the else, and set
        # image_affected=false — silently pulling published :latest and testing
        # the WRONG image with no signal. A broken moon means the detection
        # cannot be trusted, so fail the step loudly rather than guess.
        if: github.event_name == 'pull_request'
        run: |
          if ! moon_out=$(moon query tasks --affected --project compass-agent-image); then
            echo "::error::moon query for compass-agent-image affected-detection failed; cannot trust the image-affected signal, so failing rather than testing a possibly-stale published image"
            exit 1
          fi
          if printf '%s' "$moon_out" | jq -e '.tasks | length > 0' >/dev/null; then
            echo "image_affected=true" >>"$GITHUB_OUTPUT"
          else
            echo "image_affected=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Seed the compass-agent image into local containers-storage
        # The dogfood e2e fixture resolves its agent image as the bare ref
        # `compass-agent:latest` (go/e2e/fixture.go's agentImage const), and its
        # EnsureImage present-checks the LOCAL containers-storage
        # (internal/stack/adapters/image.go) — it does not pull at test time. So
        # seeding that exact tag into local storage here is what satisfies the
        # ensure: the run below finds it present and no registry round-trip
        # happens mid-test. The bare `compass-agent:latest` ref is also what
        # podmanUsable() runs as its probe, so the same seed makes that probe
        # true rather than skipping the suite.
        #
        # Where that tag COMES FROM branches on the detection above:
        #
        #   image-affected PR → build+load from THIS tree. On a PR that changes
        #   the image's inputs the gate must prove the image THIS PR produces, not
        #   the last-published `:latest`. `nix run
        #   github:RigelBuild/devenv/<rev>#devenv -- container copy agent -r
        #   docker-archive:…`, run from agent-image/,
        #   builds the image and writes it to a docker-archive TAR, which `podman
        #   load` then imports into the podman user's rootless containers-storage
        #   as the exact `compass-agent:latest` ref the fixture resolves — with no
        #   registry round-trip and no `:pr-<N>` tag. The docker-archive write is
        #   a plain file (no user namespace); `podman load` sets up its rootless
        #   namespace via newuidmap, avoiding the bare host unshare the GitHub
        #   runner denies a non-root uid (see the run body).
        #
        #   otherwise → pull the published image. On a PR that leaves the image
        #   untouched (and on every push to main, where the detection step does
        #   not run and image_affected is unset), test the last-published
        #   `:latest`. The image is public (SEA-1690; Matt-ruled public), so this
        #   pulls with no login, no credential, and no `packages: read`. The
        #   mutable `:latest` tag is intentional (Matt-ruled always-fresh) — do
        #   NOT "fix" it to a digest pin; the gate is meant to test whatever main
        #   last published.
        run: |
          if [ "${{ steps.image_affected.outputs.image_affected }}" = "true" ]; then
            # Build the image from THIS tree and load it into the podman user's
            # rootless containers-storage WITHOUT a bare host unshare — which the
            # GitHub runner denies a non-root uid even in a privileged container
            # (skopeo#2377, actions/runner-images#10443). nix2container's skopeo
            # copies the `nix:` image to a `docker-archive:` TAR, a plain file
            # write with no user namespace and no containers-storage. `podman
            # load` then imports that tar; it sets up its rootless namespace
            # through newuidmap against the podman user's subuid/subgid (the same
            # path a plain `podman pull` uses, which the host allows), so it never
            # hits the denied bare unshare. The image lands in the podman user's
            # own rootless storage as `compass-agent:latest`, the exact ref the
            # e2e run (also podman) resolves.
            ( cd agent-image && nix run github:RigelBuild/devenv/15a81f3e15619187fcbe10c2eac40878e0b4ce28#devenv -- container copy agent -r "docker-archive:/tmp/compass-agent-seed.tar:" )
            podman load -i /tmp/compass-agent-seed.tar
            rm -f /tmp/compass-agent-seed.tar
          else
            podman pull ghcr.io/rigelbuild/compass-agent:latest
            podman tag ghcr.io/rigelbuild/compass-agent:latest compass-agent:latest
          fi

      - name: Dogfood e2e (deterministic full-stack tier)
        working-directory: go
        env:
          # -race needs cgo, matching go/moon.yml's race lane. Without it `go
          # test -race` refuses to build.
          CGO_ENABLED: '1'
        # The deterministic tier: a REAL full stack — compass-server + runner +
        # agent-container + a PRIVATE postgres the suite stands up itself — brought
        # up via stack.Up, driven against a canned in-process model. No live model
        # egress and no secrets (Decision D2), so it is reproducible and safe on
        # every PR. It is build-tagged `podman`, so the moon `go test ./...`
        # battery never compiles it — this step is the ONLY thing that runs it.
        #
        # D2's no-secrets claim scopes to THIS dogfood tier specifically: the
        # forge live-contract oracle in the gates job is a separate, secret-bearing
        # per-PR step (the LIVEGITHUB_*/LINEAR_FORGE testbed creds), so "the PR gate
        # carries no secrets" is now true of the dogfood tier alone — see the record
        # docs/designs/product/compass-forge-integration-testing.
        #
        # Same capture-replay-exit shape as the gates job's suites: redirect (not
        # a `| tee` pipeline, whose exit status is tee's 0 and would swallow a
        # FAIL), replay the log, then exit on go test's own status. `|| rc=$?`
        # because the step runs under `bash -e`. The 20m timeout is finite
        # headroom for a run that builds 3 binaries, stands up a real stack, and
        # runs a container turn.
        run: |
          rc=0
          go test -tags podman -race -v -timeout 20m ./e2e/... >/tmp/e2e.log 2>&1 || rc=$?
          cat /tmp/e2e.log
          exit "$rc"

      - name: Assert the dogfood e2e ran rather than skipped
        working-directory: go
        # The e2e legs t.Skip (never fail) when podmanUsable() is false — correct
        # for a container-less sandbox, but a silent no-op here. A required check
        # that let that skip pass would be VACUOUSLY green, so this guard makes an
        # unavailable-podman run loud.
        #
        # Both halves are derived from source rather than hardcoded, matching the
        # pgtest guard's discipline: a guard that drifts out of step with what it
        # guards passes silently.
        #   - the skip text is read from go/e2e/harness_test.go, so rewording the
        #     skip cannot leave this grep matching nothing and reporting success;
        #   - the ok line is required for the e2e package specifically, so "the
        #     deterministic tier actually ran and passed" is what green means.
        #     This matters because go/e2e/cannedmodel_test.go is deliberately
        #     UNTAGGED and runs under a bare `go test`, so an `ok`-line grep alone
        #     could pass on that file while the real podman legs silently skipped
        #     — the skip-string check above is what closes that gap.
        run: |
          skip=$(sed -n 's/.*t\.Skip("\(rootless podman[^";]*\)[^"]*").*/\1/p' \
            e2e/harness_test.go)
          if [ -z "$skip" ]; then
            echo "::error::could not read the skip message out of go/e2e/harness_test.go — this guard has drifted from the harness and is no longer checking anything"
            exit 1
          fi
          if grep -qF "$skip" /tmp/e2e.log; then
            echo "::error::dogfood e2e skipped — podman could not run compass-agent:latest, so nothing was asserted"
            grep -nF "$skip" /tmp/e2e.log | head
            exit 1
          fi
          if ! grep -qE "^ok[[:space:]]+github\.com/RigelBuild/compass/go/e2e[[:space:]]" /tmp/e2e.log; then
            echo "::error::the dogfood e2e package did not report ok — it failed, skipped, or never ran"
            exit 1
          fi
          echo "dogfood e2e: the deterministic full-stack tier ran and reported ok"

  CI:
    name: CI
    # The single required check: a rollup that succeeds only if every work job
    # above did. Requiring THIS one status (not each work job) means the set of
    # jobs can be split or renamed without touching branch protection — a new
    # tier just joins `needs` below.
    #
    # The `if` has three parts AND-ed together, and all are load-bearing:
    #   - `always()` so the rollup runs even when a needed job FAILED. Without it
    #     the default `success()` gate would SKIP this job when a work job failed,
    #     and branch protection treats a skipped required check as passing — so a
    #     red work job would be mergeable. `always()` forces the rollup to run and
    #     inspect each result, turning any non-success into a red required check.
    #   - `github.event_name != 'workflow_dispatch'`: the work jobs stay off a
    #     fixture-regen dispatch (regen-forge-fixtures runs alone there), so both
    #     `needs` skip — this rollup must skip too, or `always()` would red the
    #     required check on `skipped != success` for a run that never gates a merge.
    #   - the SAME no-op-`edited` guard the work jobs carry, so on a PR title/body
    #     edit that did not move the base — where both work jobs skip — this rollup
    #     skips too, rather than running and failing on `skipped != success`. A
    #     bare `always()` would red the required check on a legitimate no-op edit.
    # `always()` must be parenthesized: `&&` binds tighter than `||`, so without
    # the parens the trailing `|| changes.base != null` would detach from the AND.
    needs: [gates, dogfood-e2e]
    if: >-
      always() &&
      github.event_name != 'workflow_dispatch' && (
      github.event_name != 'pull_request' ||
      github.event.action != 'edited' ||
      github.event.changes.base != null )
    runs-on: ubuntu-latest
    steps:
      - name: Require every work job to have succeeded
        # `needs.<job>.result` is one of success | failure | cancelled | skipped.
        # Only `success` passes. This step runs only when the rollup's own `if`
        # let it (see above): the no-op-`edited` case skips the whole rollup, so a
        # work-job `skipped` reaching here means a real dependency skip, not the
        # benign no-op — still correctly a non-success. Any failure or
        # cancellation reds the one required check.
        run: |
          gates='${{ needs.gates.result }}'
          dogfood='${{ needs.dogfood-e2e.result }}'
          echo "gates=$gates dogfood-e2e=$dogfood"
          if [ "$gates" != "success" ] || [ "$dogfood" != "success" ]; then
            echo "::error::a required work job did not succeed (gates=$gates, dogfood-e2e=$dogfood)"
            exit 1
          fi
          echo "all work jobs succeeded"

  regen-forge-fixtures:
    name: Regenerate forge golden fixtures
    runs-on: ubuntu-latest
    # The operator-only fixture-regeneration lane. The live `-update` capture
    # (TestLiveUpdateFixtures) rewrites go/internal/forge/testdata/ against the
    # real GitHub + Linear testbed — whose PATs live only in Actions secrets, so
    # a local `-update` is impossible — then opens a BOT PR carrying the rewritten
    # fixtures for human review. It is a SEPARATE job, never a step in `gates`:
    # gating on `workflow_dispatch` keeps it off every normal gate event, so the
    # required `CI` rollup above (which does not `needs:` this job) is untouched.
    if: github.event_name == 'workflow_dispatch'
    # The top-level `permissions: contents: read` is the floor; this job widens
    # its own to open a PR: contents:write to push the regen branch,
    # pull-requests:write to open the PR against it.
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 90
    env:
      # Same short temp root as `gates`: the live suite binds AF_UNIX sockets
      # under t.TempDir() and the 108-byte sun_path cap needs the budget.
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the create-pull-request action can branch and diff
          # cleanly, matching the gates checkout.
          fetch-depth: 0

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          # The SAME two-cache trust posture as the gates job — the two
          # substituters the vendored forks use plus their trusted keys, never
          # `accept-flake-config` (which would trust a PR-supplied substituter +
          # key). See the gates install-nix-action step for the full rationale.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the language toolchains on PATH
        # Phase one of the two-phase bootstrap, identical to the gates job: the
        # language runtimes (bun/node/moon/go) from gate-tools.nix's `langs`, built
        # from the devenv.lock pin so this lane runs the same toolchain the gate
        # does. See the gates job for the two-phase rationale.
        run: |
          stores=$(nix eval --json -f tools/toolchain/gate-tools.nix langs \
            | jq -r '.[].store')
          [ -n "$stores" ] || {
            echo "::error::gate-tools.nix langs produced no store paths"
            exit 1
          }
          nix build --no-link $stores
          for store in $stores; do
            echo "$store/bin" >>"$GITHUB_PATH"
          done

      - name: Put the dev shell's nixpkgs tools on PATH
        # Phase two: the nixpkgs tools (buf, the Go battery, …) from the parity
        # script's own parse of devenv.nix, run under the bun phase one added.
        run: |
          attrs=$(bun tools/toolchain/parity.ts --print-nix-attrs)
          out=$(nix build --no-link --print-out-paths \
            -f tools/toolchain/gate-tools.nix env --arg attrs "$attrs")
          echo "$out/bin" >>"$GITHUB_PATH"

      - name: Regenerate the forge golden fixtures against the live testbed
        working-directory: go
        env:
          # The SAME T2 env contract as the live-contract oracle in gates: the
          # GitHub live legs gate on the LIVEGITHUB_* trio, the Linear legs on
          # LINEAR_FORGE (+ team), all from Actions secrets. A dispatch run with
          # the secrets unset is an operator error (the -update capture would skip
          # and rewrite nothing) — not a silent-green gate risk, so this lane needs
          # no skip-guard.
          LIVEGITHUB_REPO: ${{ secrets.LIVEGITHUB_REPO }}
          LIVEGITHUB_AUTHOR_TOKEN: ${{ secrets.LIVEGITHUB_AUTHOR_TOKEN }}
          LIVEGITHUB_REVIEWER_TOKEN: ${{ secrets.LIVEGITHUB_REVIEWER_TOKEN }}
          LINEAR_FORGE: ${{ secrets.LINEAR_FORGE }}
          LINEAR_FORGE_TEAM: ${{ secrets.LINEAR_FORGE_TEAM }}
          CGO_ENABLED: '1'
        # TestLiveUpdateFixtures is the agreed cross-slice update test (added to
        # livegithub_test.go by leg 2); `-update` is its capture flag, rewriting
        # go/internal/forge/testdata/ from the live testbed responses. No -race and
        # no capture-replay-exit shape here: a regen is an operator-driven refresh,
        # not a gate — a failure surfaces directly in the dispatch run's log.
        run: |
          go test -tags livegithub -run TestLiveUpdateFixtures -update -timeout 10m ./internal/forge/...

      - name: Open a bot PR with the regenerated fixtures
        # The regenerated testdata/ is a working-tree diff; this opens a bot PR
        # carrying it for human review — the one bot-opens-a-PR credential path
        # (design §394-398). create-pull-request stages the diff onto a fresh
        # branch and opens the PR via the job's widened permissions above; it is
        # SHA-pinned like every other action in this file, its trust anchor.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: forge-fixture-regen-${{ github.run_id }}
          title: 'test(forge): regenerate forge golden fixtures'
          commit-message: 'test(forge): regenerate forge golden fixtures'
          body: >-
            Automated `-update` capture of the forge golden fixtures
            (`go/internal/forge/testdata/`) against the live testbed, produced by
            the `regen-forge-fixtures` workflow_dispatch lane. Review the fixture
            diff before merging.
          add-paths: go/internal/forge/testdata

