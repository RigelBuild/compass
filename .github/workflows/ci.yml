# The remote gate for every pull request and every push to main, plus a nightly
# full sweep of main.
#
# A MATRIX OF NAMED CONCERN GROUPS, NOT ONE JOB — this reverses the earlier
# single-job decision recorded here. That decision rejected a matrix on one
# ground: a matrix could only be built by ENUMERATING projects (or tasks) in
# YAML, a second source of truth for something .moon/workspace.yml already owns,
# and such a list goes stale silently (a fork tree once shipped a functional-CI
# registration with no entry in the project map, so it read as covered and gated
# nothing). That ground no longer applies, because the matrix is no longer
# enumerated in YAML. moon still owns project DISCOVERY: the `setup` job below
# runs `moon query projects` (the affected closure on a PR, the full set on
# push/schedule) and a generator (tools/ci-matrix) translates that live answer
# into the matrix the `moon` job fans out over. The generator owns only
# GROUPING — bucketing each discovered project by its one `ci-group.<name>` tag
# — and that grouping is guarded so it cannot silently drift: the generator
# fails loud (naming the offending project id) on any untagged project
# (zero-untagged), any project carrying two ci-group tags (disjointness), and
# any coverage gap. A new project with a `ci` task is picked up the moment it is
# registered and tagged — no matrix entry to forget — and a departing one drops
# out just as quietly: removing the vendored oh-my-pi fork emptied the `forks`
# group and stopped emitting its leg with no edit to this file, the same property
# the one-job design prized, now with per-group named checks instead of one opaque
# `gates` status.
#
# The `gates` display name is gone. Each concern group runs as its own matrix
# leg, checked as `ci / moon (<group>)` per DL-277 (go / bun / nix today), so a
# failure is attributed to a named check rather than to a line in one job's log.
# The four special legs that already needed an environment the bare moon battery
# has no business realizing — pgtest, microvm, forge-oracle, gtk4-e2e — remain
# their own peer jobs. A single required `rollup` check (below) still fronts the
# whole set, so branch protection requires one check regardless of the fan-out.
#
# AFFECTED ON PRs, FULL ON MAIN — now per leg. A pull request runs only what it
# affects: `setup` computes the affected closure once and emits, per group, the
# affected members' `:ci` targets (an unaffected group's leg no-ops) plus a
# per-special-leg affected flag (pgtest/microvm/forge/gtk4), so a Go, UI, or
# docs PR never pays for the nix group's image builds — the dominant cost, and
# why affected-detection matters most there. The tradeoff is real and named:
# affected detection trusts each task's `inputs` globs to be complete, so an
# inputs glob that misses a file would skip a task that should have run. The
# backstop is that main is never gated by affected: every push to main AND a
# nightly `schedule` run the FULL set — every group, every special leg, no
# filter (setup emits every group with run:true and every flag true). So an
# inputs gap a PR skipped is caught the moment the change lands on main (named
# and attributable), not left to hide; the nightly sweep re-checks main even on
# a quiet day. Fast affected path on PRs, exhaustive sweep on everything that
# reaches main.
#
# pgtest — the real-Postgres suites — runs as its own peer job (below), behind
# the `rollup` check, rather than as a step in the moon battery. It was peeled out
# so a Postgres-service flake or the slow `-race` suite no longer serializes
# behind the whole battery: the two lanes fail independently and a
# service-container flake reds only `pgtest` (a re-run clears it), not the
# hermetic gate. The suites are build-tagged `pgtest`, so the moon battery's `go
# test ./...` never compiles them — the pgtest job is the only thing that runs
# them. It joins the `rollup` check's `needs`, so there is still one required check.

name: ci

on:
  pull_request:
    # The default types (opened, synchronize, reopened). `edited` is
    # deliberately ABSENT: jj-vine edits every PR's body ~1s after opening it,
    # and an `edited` trigger fired a full phantom run that self-skipped and
    # double-listed every check on the PR (a cosmetic artifact with a latent
    # skipped-required-as-passing false green). The one thing `edited` used to
    # buy — a fresh run when a stacked PR's BASE is re-pointed — is handled
    # out of band by pr-base-repoint.yml, which guards on `changes.base` and
    # re-triggers this workflow via `workflow_dispatch` (see the `pr` input
    # below). A triggered run cannot post zero contexts (a skipped job still
    # posts a `skipped` context), so the phantom could not be narrowed away in
    # place — the trigger itself had to move.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    # Nightly full backstop: runs the whole battery over main so an incomplete
    # `inputs` glob the affected PR gate skipped cannot hide indefinitely.
    # 07:17 UTC, off the top-of-hour cron congestion GitHub throttles.
    - cron: '17 7 * * *'
  workflow_dispatch:
    # TWO distinct dispatch lanes, disambiguated by the `pr` input:
    #   - `pr` EMPTY  → the operator-only forge fixture-regeneration lane
    #     (regen-forge-fixtures below). The live `-update` capture rewrites the
    #     golden testdata against the real testbed, whose PATs live only in
    #     Actions secrets, so a local `-update` is impossible. Its own `if:`
    #     gates on `workflow_dispatch` AND an empty `pr`, so the gate jobs stay
    #     off it and this trigger only refreshes fixtures from the Actions tab.
    #   - `pr` SET (a PR number) → the base-re-point re-trigger. When a stacked
    #     PR's base is re-pointed, pr-base-repoint.yml dispatches this workflow
    #     with `pr=<N>`; the gate jobs below run the FULL battery (as on a
    #     push) against that PR's freshly-recomputed `refs/pull/<N>/merge` — a
    #     default `GITHUB_TOKEN` event triggers no workflow, so
    #     `workflow_dispatch` is the one re-trigger that needs no minted
    #     credential. A fresh run (unlike `gh run rerun`) picks up the merge
    #     ref GitHub recomputes against the new base (actions/checkout#919).
    inputs:
      pr:
        description: 'PR number to re-run against its recomputed merge ref (base re-point); empty = forge fixture regen'
        required: false
        default: ''

# One in-flight run per ref per event action. A superseded push's run is
# answering a question nobody is asking any more. Both the event and its action
# are in the key so runs answering different questions about the same ref don't
# cancel each other: a nightly schedule and a coincident post-merge push
# (different events). A PR branch's superseded pushes fire
# `pull_request.synchronize`, so they share one group and collapse to one
# in-flight run per ref, as intended.
#
# `push` and `schedule` payloads have no `action` field, so
# `${{ github.event.action }}` renders to a constant empty string for them —
# their grouping is unchanged by this key (every main push still collapses to
# `ci-<ref>-push-` and still cancels the prior one; a schedule run still
# coexists with a coincident push via the distinct event name). A base-re-point
# re-trigger arrives as `workflow_dispatch` on the PR's HEAD branch, so its
# `github.ref` (`refs/heads/<head>`) differs from the PR's own
# `pull_request` runs (`refs/pull/<N>/merge`) — no cross-cancel between a
# re-point run and a concurrent push to that branch — while two re-points of
# the same PR share a group and the newer supersedes the older.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ github.event.action }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    # The discovery + grouping stage: run `moon query projects` (affected on a
    # PR, full on push/schedule) and translate the live answer into the matrix
    # the `moon` job fans out over, plus the four special-leg affected flags.
    # untagged / double-tagged project or coverage gap. Same dispatch-aware gate
    # guard every gate job carries.
    # Run on every gate event (push, schedule, pull_request) and on a
    # base-re-point re-trigger — a `workflow_dispatch` carrying a non-empty
    # `pr` input. Stay OFF the fixture-regen dispatch (empty `pr`), which
    # runs regen-forge-fixtures alone. `github.event.inputs.pr` is '' for
    # every non-dispatch event, so the left disjunct carries those.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.pr != ''
    timeout-minutes: 15
    env:
      # Same short temp root as every gate job — see the moon battery below for
      # the sun_path rationale. Harmless here; kept for consistency.
      TMPDIR: /tmp
    outputs:
      # The matrix the `moon` job fans out over (one entry per group that exists
      # in the workspace), plus the four special-leg affected flags each gated
      # job reads to decide whether a PR must run it. The full set is emitted on
      # push/schedule (every group run:true, every flag true) — the full-sweep
      # backstop lives in the generator, not here.
      matrix: ${{ steps.gen.outputs.matrix }}
      pgtest_affected: ${{ steps.gen.outputs.pgtest_affected }}
      microvm_affected: ${{ steps.gen.outputs.microvm_affected }}
      forge_affected: ${{ steps.gen.outputs.forge_affected }}
      gtk4_affected: ${{ steps.gen.outputs.gtk4_affected }}
      darwin_affected: ${{ steps.gen.outputs.darwin_affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth 0 gives the base branch history the generator's affected
          # closure + the forge/gtk4 changed-paths diff need. moon reads the base
          # from GITHUB_BASE_REF and diffs against it; the generator's own path
          # detection diffs base...HEAD — both need real history, not a shallow
          # single-ref checkout.
          fetch-depth: 0
          # On a base-re-point re-trigger (workflow_dispatch with pr set) check
          # out the PR's merge ref, which GitHub recomputes against the new base
          # for a FRESH run (actions/checkout#919 — a plain rerun would replay
          # the stale merge SHA). Empty on every other event → checkout's default
          # triggering ref.
          ref: ${{ github.event.inputs.pr != '' && format('refs/pull/{0}/merge', github.event.inputs.pr) || '' }}

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          # The forks' functional CI is `nix build` of their own flakes, and the
          # whole toolchain — language runtimes AND the nixpkgs tools — is built
          # from nix below. Flakes are needed for the former; nix-command for both.
          #
          # The substituters below are declared here rather than delegated via
          # `accept-flake-config = true`. That setting makes nix accept the
          # `nixConfig` of ANY flake it evaluates, and the RigelBuild/devenv
          # flake the build fetches carries exactly such a block — so a PR could add its own substituter
          # AND its own trusted public key, and CI would fetch and run binaries
          # signed by the attacker's key, with signature verification satisfied
          # by the key the same PR supplied. Naming the two caches the forks
          # legitimately use keeps that trust in a reviewed file: adding a third
          # is a change to this workflow, not to a vendored tree.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the language toolchains on PATH
        # Phase one of the two-phase bootstrap — the generator needs only bun and
        # moon on PATH (it runs `moon query projects` under bun), so setup carries
        # phase one alone and skips the heavier phase-two nixpkgs-tools step. The
        # language runtimes (bun/node/moon/go) come from nix, not `setup-*`
        # actions: gate-tools.nix's `langs` output resolves the identical
        # derivations the dev shell does — bun/node/moon from
        # tools/toolchain/toolchain-tools.nix, go from the go-overlay applied to
        # the devenv.lock-pinned nixpkgs — so CI runs the pinned versions
        # byte-for-byte. `langs` is a closed set, so it needs no `--arg attrs`
        # (the head defaults it).
        run: |
          stores=$(nix eval --json -f tools/toolchain/gate-tools.nix langs \
            | jq -r '.[].store')
          # Fail closed locally rather than leaning on the absence of a
          # root-level flake.nix: with no installables `nix build` would build a
          # default package if one existed, so an empty `langs` must error here.
          [ -n "$stores" ] || {
            echo "::error::gate-tools.nix langs produced no store paths"
            exit 1
          }
          nix build --no-link $stores
          for store in $stores; do
            echo "$store/bin" >>"$GITHUB_PATH"
          done

      - name: Generate the concern matrix
        id: gen
        # The discovery + grouping edge: runs `moon query projects` (affected
        # closure on a PR via GITHUB_BASE_REF; full set on push/schedule) and its
        # own base...HEAD changed-paths diff for the forge/gtk4 detection, then
        # translates that into the matrix + the four affected flags written to
        # $GITHUB_OUTPUT (mapped up into this job's `outputs:` above). The pure
        # translation core is exhaustively unit-tested; this invocation is the
        # thin impure shell around it. It fails loud (exit 1, `::error::`) on any
        # untagged / double-tagged project or coverage gap — the fail-loud posture
        # that lets moon own discovery without a stale YAML enumeration.
        run: bun run tools/ci-matrix/index.ts

  moon:
    name: moon (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: setup
    # One leg per concern group, discovered at run time from setup's matrix. No
    # YAML project enumeration — the group set is whatever `ci-group.*` tags
    # exist in the workspace, translated by the generator. `fail-fast: false` so
    # one group's failure does not cancel the others (each is an independently
    # attributable named check). NO `continue-on-error`: a leg's failure must red
    # its check and, through the rollup, the required `rollup` status.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    # Same dispatch-aware gate guard every gate job carries (see setup): run on
    # push/schedule/pull_request and on a base-re-point re-trigger
    # (workflow_dispatch with a non-empty pr); stay off the fixture-regen
    # dispatch (empty pr, regen-only).
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.pr != ''
    # 90m is an INHERITED ceiling, not a measured one. It was sized for the
    # vendored forks' nix worst case
    # (infra/ci/compass-ci-job-decomposition/design.md:77-78), and that group is
    # now gone — the monolith's real wall-clock on main was ~20m even before it
    # left (same record, :377-378). `agent-image/moon.yml` used to point back
    # here as the reason for the 90m and no longer does, so nothing measures the
    # NIX LEG's own worst case.
    #
    # Counterweight, before anyone lowers it: DL-299 and its record
    # (infra/release/compass-unified-release-lane/design.md:145) put the
    # agent-image closure build at ~90m, and release.yml:115-116 sizes its own
    # 90 on that same cost. The nix group (every `ci-group.nix` project) builds
    # that closure, so this leg may genuinely need the headroom even though the
    # ~20m monolith baseline does not justify it. Right-sizing per leg is the
    # decomposition record's stated intent — "never the monolith's inherited 90,
    # which is a forks-nix artifact" (:463-465) — and is still open; it needs a
    # per-leg measurement, not this comment.
    timeout-minutes: 90
    env:
      # A short temp root, because AF_UNIX sun_path is 108 bytes and the Go
      # suites bind sockets under `t.TempDir()`. The runner's default TMPDIR is
      # /home/runner/work/_temp — 22 bytes before the test's own name-derived
      # path — which pushes the runner and server socket tests past the cap and
      # fails them with a bare EINVAL from bind(2). /tmp is 4 bytes and leaves
      # the budget those tests were written against.
      #
      # A CI-shaped constraint, fixed in CI: the cap is real and the code's own
      # guards against it are elsewhere; nothing about this repo's sockets should
      # be redesigned around one runner's choice of temp root.
      TMPDIR: /tmp
    steps:
      # Every step is gated on `matrix.run == 'true'`: an unaffected group is a
      # placeholder leg (run:'false', empty targets) that the generator emits to
      # keep the matrix non-empty and the check names stable, so its leg spins up
      # and no-ops rather than never appearing. A running leg does the full
      # two-phase bootstrap the moon battery does.
      - if: matrix.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The drift gate's `git diff --no-index` needs real git; a shallow
          # single-ref checkout does not provide it.
          fetch-depth: 0
          # Base-re-point re-trigger checks out the recomputed merge ref; empty
          # on every other event (see setup's checkout).
          ref: ${{ github.event.inputs.pr != '' && format('refs/pull/{0}/merge', github.event.inputs.pr) || '' }}

      - if: matrix.run == 'true'
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          # The forks' functional CI is `nix build` of their own flakes, and the
          # whole toolchain — language runtimes AND the nixpkgs tools — is built
          # from nix below. Flakes are needed for the former; nix-command for both.
          #
          # The substituters below are declared here rather than delegated via
          # `accept-flake-config = true`. That setting makes nix accept the
          # `nixConfig` of ANY flake it evaluates, and the RigelBuild/devenv
          # flake the build fetches carries exactly such a block — so a PR could add its own substituter
          # AND its own trusted public key, and CI would fetch and run binaries
          # signed by the attacker's key, with signature verification satisfied
          # by the key the same PR supplied. Naming the two caches the forks
          # legitimately use keeps that trust in a reviewed file: adding a third
          # is a change to this workflow, not to a vendored tree.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the language toolchains on PATH
        if: matrix.run == 'true'
        # Phase one of the two-phase bootstrap. The language runtimes
        # (bun/node/moon/go) come from nix, not `setup-*` actions: gate-tools.nix's
        # `langs` output resolves the identical derivations the dev shell does —
        # bun/node/moon from tools/toolchain/toolchain-tools.nix, go from the
        # go-overlay applied to the devenv.lock-pinned nixpkgs — so CI runs the
        # pinned versions byte-for-byte and the parity gate has a concrete store
        # path to check each against. `langs` is a closed set, so it needs no
        # `--arg attrs` (the head defaults it).
        #
        # This must precede phase two: `--print-nix-attrs` runs under `bun`, so
        # bun has to be on PATH before that parse can run.
        run: |
          stores=$(nix eval --json -f tools/toolchain/gate-tools.nix langs \
            | jq -r '.[].store')
          # Fail closed locally rather than leaning on the absence of a
          # root-level flake.nix: with no installables `nix build` would build a
          # default package if one existed, so an empty `langs` must error here.
          [ -n "$stores" ] || {
            echo "::error::gate-tools.nix langs produced no store paths"
            exit 1
          }
          nix build --no-link $stores
          for store in $stores; do
            echo "$store/bin" >>"$GITHUB_PATH"
          done

      - name: Put the dev shell's nixpkgs tools on PATH
        if: matrix.run == 'true'
        # Phase two. buf, protoc, biome and markdownlint have no `setup-*` action
        # that could reproduce a nixpkgs pin. Rather than pick a close-enough
        # release from some other channel and hope, CI resolves the SAME
        # derivations the dev shell does, from the nixpkgs revision devenv.lock
        # pins. (The Go analysis battery — golangci-lint/govulncheck/go-licenses/
        # nilaway — is NOT here: it is rebuilt against the go toolchain and rides
        # phase one via gate-tools.nix `langs`, not this nixpkgs-attrs step.)
        #
        # The attribute list comes from the parity script's own parse of
        # devenv.nix (run under the bun that phase one just put on PATH), so what
        # CI installs and what the gate expects cannot disagree, and neither is
        # enumerated here.
        run: |
          attrs=$(bun tools/toolchain/parity.ts --print-nix-attrs)
          out=$(nix build --no-link --print-out-paths \
            -f tools/toolchain/gate-tools.nix env --arg attrs "$attrs")
          echo "$out/bin" >>"$GITHUB_PATH"
          # The dev-boot gate (apps/ui:dev-smoke) drives a headless Chromium
          # through Playwright, which resolves it from PLAYWRIGHT_CHROMIUM_PATH
          # (apps/ui/playwright.config.ts:31-33). chromium is Linux-only in
          # nixpkgs, so it is NOT in the parity `attrs` above (see devenv.nix) —
          # it is realized out-of-band here from its own pinned helper, the same
          # pattern the gtk4 e2e step uses for its browser stack. Read its
          # bin/chromium out-path straight into the env: a $GITHUB_PATH append
          # only affects SUBSEQUENT steps, so resolving `chromium` off PATH here
          # would find nothing and silently fall back to the dev-box path.
          chromium=$(nix build --no-link --print-out-paths \
            -f tools/toolchain/chromium-e2e-env.nix chromium)
          echo "PLAYWRIGHT_CHROMIUM_PATH=$chromium/bin/chromium" >>"$GITHUB_ENV"

      - name: Toolchain parity
        if: matrix.run == 'true'
        # Runs BEFORE the battery, though `:ci` schedules it again (it takes under
        # a second). A toolchain skew invalidates every result the battery is
        # about to produce, so finding out first is worth running it twice.
        run: bun tools/toolchain/parity.ts

      - name: Moon battery
        if: matrix.run == 'true'
        # `moon run <targets>`, NOT `moon ci`: setup already computed the affected
        # set and this leg's `matrix.targets` are exactly the affected members'
        # `:ci` targets for this group (full set on push/schedule). Re-running
        # `moon ci` here would recompute affected — redundant on a PR and, on a
        # push where GITHUB_BASE_REF is unset, an empty-diff no-op that runs
        # nothing. Passing the precomputed targets keeps discovery in one place
        # (setup) and makes each leg run exactly its share. `matrix.targets` is a
        # JSON array; `join(...)` renders it as the space-separated argument list
        # `moon run` expects (a bare `${{ matrix.targets }}` would inline the raw
        # JSON, not a target list). A running leg always has >=1 target, so this
        # is never an empty `moon run`.
        run: moon run ${{ join(matrix.targets, ' ') }}

      - name: Retrospect
        if: matrix.run == 'true' && (success() || failure())
        # Collapse this leg's flat task fan-out into per-task sections in the
        # Actions log, so a failure is one expand instead of a scroll. Reads
        # .moon/cache/{ci,run}Report.json — no token, no added permissions, so
        # `permissions: contents: read` above is untouched. `success() ||
        # failure()` so it still renders when the battery failed.
        #
        # This is third-party JS that runs on every event, fork PRs included, so
        # the SHA pin below IS its trust anchor — the same posture the pgtest
        # image digest and the nix substituter keys take for their own boundaries.
        # At the pinned commit the action takes no token, makes no network call,
        # and only reads and prints local cache files, so a fork PR cannot turn it
        # into an exfiltration or write path. Bump the pin deliberately (it rides
        # the same dependabot config as the other pinned actions), never drift it.
        uses: appthrust/moon-ci-retrospect@631a1e667f96e8ca893eab69f03e425f7fbfdc2b # v2.1.0

  pgtest:
    name: pgtest
    runs-on: ubuntu-latest
    needs: setup
    # Peeled out of the moon gate so a Postgres-service flake or a slow -race
    # suite no longer serializes behind the whole battery. The job-level `if:`
    # ANDs the dispatch-aware gate guard with the pgtest affected gate: on a PR
    # it runs only when setup's closure contains compass-go (pgtest_affected),
    # and always on push/schedule (setup emits the flag 'true' there). A failed
    # setup leaves the output empty → `'' == 'true'` is false → the job skips,
    # and the rollup turns that skip red because the paired flag is not 'false'.
    # The in-step guards stay as defense-in-depth.
    if: >-
      (github.event_name != 'workflow_dispatch' ||
      github.event.inputs.pr != '') &&
      (github.event_name != 'pull_request' ||
      needs.setup.outputs.pgtest_affected == 'true')
    timeout-minutes: 20
    env:
      # The Real-Postgres suites bind AF_UNIX sockets under t.TempDir(); the
      # runner's default TMPDIR overflows sun_path's 108-byte cap. Same reason as
      # the moon gate.
      TMPDIR: /tmp
    services:
      postgres:
        # Matches pgtest.go's pinned image: the suites assert on generated-tsvector
        # and websearch_to_tsquery behavior, which is major-version-sensitive.
        #
        # Pinned by DIGEST, not tag. `16-alpine` is mutable, so a repoint would
        # ship unreviewed container code into the gate and could change the
        # database behavior the suites assert on — with the tag unchanged, so
        # nothing in the diff would show it. The digest must stay equal to
        # pgtest.go's pgImage, or CI and a local run stop exercising the same
        # Postgres, which is the parity the line above claims.
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: compass-test
          POSTGRES_DB: compass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # checkout: the Real-Postgres suites run no git diff (their guard greps
      # files via `grep -rl`), but the sqlc-vet step below invokes `moon run`,
      # which resolves the PR base ("main") to compute its changed-files set
      # before running the task. A shallow checkout lacks that ref and moon dies
      # `git exit 128: ambiguous argument 'main'` — so this job needs full
      # history, the same `fetch-depth: 0` every other moon-invoking job uses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Base-re-point re-trigger checks out the recomputed merge ref; empty
          # on every other event (see setup's checkout).
          ref: ${{ github.event.inputs.pr != '' && format('refs/pull/{0}/merge', github.event.inputs.pr) || '' }}

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          # The forks' functional CI is `nix build` of their own flakes, and the
          # whole toolchain — language runtimes AND the nixpkgs tools — is built
          # from nix below. Flakes are needed for the former; nix-command for both.
          #
          # The substituters below are declared here rather than delegated via
          # `accept-flake-config = true`. That setting makes nix accept the
          # `nixConfig` of ANY flake it evaluates, and the RigelBuild/devenv
          # flake the build fetches carries exactly such a block — so a PR could add its own substituter
          # AND its own trusted public key, and CI would fetch and run binaries
          # signed by the attacker's key, with signature verification satisfied
          # by the key the same PR supplied. Naming the two caches the forks
          # legitimately use keeps that trust in a reviewed file: adding a third
          # is a change to this workflow, not to a vendored tree.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the language toolchains on PATH
        # The nix-pinned language toolchains (bun/node/moon/go) — pgtest needs
        # only `go` on PATH, but the whole `langs` set is a closed group built in
        # one nix build. They come from nix, not `setup-*` actions: gate-tools.nix's
        # `langs` output resolves the identical derivations the dev shell does —
        # bun/node/moon from tools/toolchain/toolchain-tools.nix, go from the
        # go-overlay applied to the devenv.lock-pinned nixpkgs — so CI runs the
        # pinned versions byte-for-byte and the parity gate has a concrete store
        # path to check each against. `langs` is a closed set, so it needs no
        # `--arg attrs` (the head defaults it).
        #
        # Unlike the moon gate, this job carries no phase-two nixpkgs-tools step:
        # the real-Postgres suite runs only `go test`, which needs no buf/protoc/
        # biome/markdownlint, so the language toolchains are the whole bootstrap.
        run: |
          stores=$(nix eval --json -f tools/toolchain/gate-tools.nix langs \
            | jq -r '.[].store')
          # Fail closed locally rather than leaning on the absence of a
          # root-level flake.nix: with no installables `nix build` would build a
          # default package if one existed, so an empty `langs` must error here.
          [ -n "$stores" ] || {
            echo "::error::gate-tools.nix langs produced no store paths"
            exit 1
          }
          nix build --no-link $stores
          for store in $stores; do
            echo "$store/bin" >>"$GITHUB_PATH"
          done

      - name: Real-Postgres suites
        working-directory: go
        env:
          # pgtest.go's documented CI-service path: with a DSN set the harness
          # uses this database (giving each test its own schema) instead of
          # managing a container.
          COMPASS_TEST_DATABASE_DSN: postgres://postgres:compass-test@127.0.0.1:5432/compass?sslmode=disable
          CGO_ENABLED: '1'
          # The harness SKIPS when it can reach no database — correct for a
          # container-less sandbox, but in CI the service Postgres above is
          # mandatory, so a skip here would silently pass nothing. Setting this
          # turns the no-DSN/no-runtime SKIP into a hard failure.
          COMPASS_REQUIRE_LIVE: '1'
        # -v so the assertion below can read per-test outcomes. The redirect —
        # rather than a pipe to tee — is deliberate: a pipeline's exit status is
        # its LAST command's, so `go test ... | tee` returns tee's 0 and a real
        # test failure is silently discarded (this job reported green over a
        # `FAIL` before this was fixed). Capture, replay the log, then exit on
        # go test's own status. `|| rc=$?` because the step runs under `bash -e`,
        # which would otherwise abort before the log is ever printed. The
        # explicit -timeout exceeds the job's slowest suite: on the default 10m a
        # wedged test panics mid-run and the panic, not the failure, is the story.
        run: |
          rc=0
          go test -tags pgtest -race -v -timeout 15m ./... >/tmp/pgtest.log 2>&1 || rc=$?
          cat /tmp/pgtest.log
          exit "$rc"

      - name: Assert the real-Postgres suites ran rather than skipped
        working-directory: go
        # The harness SKIPS (never fails) when it can find no database — correct
        # for a container-less sandbox, and a silent no-op here. This step exists
        # to run those assertions, so a skip is a failure of its whole purpose and
        # must be loud.
        #
        # Both halves are derived from source rather than hardcoded, because a
        # guard that drifts out of step with what it guards passes silently:
        #   - the skip text is read from pgshare.go (the shared acquisition core
        #     pgtest delegates to), so rewording it cannot leave
        #   - the package list is the set that actually calls RequireDSN, so the
        #     count means "the real-Postgres packages ran". Counting every
        #     `--- PASS` in the module would be inert: the module has hundreds of
        #     tests that touch no database, so the total stays high even if every
        #     database suite vanished.
        run: |
          skip=$(sed -n 's/.*t\.Skip("\(no COMPASS_TEST_DATABASE_DSN[^"]*\)").*/\1/p' \
            internal/pgshare/pgshare.go)
          if [ -z "$skip" ]; then
            echo "::error::could not read the skip message out of internal/pgshare/pgshare.go — this guard has drifted from the harness and is no longer checking anything"
            exit 1
          fi
          if grep -qF "$skip" /tmp/pgtest.log; then
            echo "::error::pgtest harness skipped — the service Postgres was not reached, so nothing was asserted"
            grep -nF "$skip" /tmp/pgtest.log | head
            exit 1
          fi
          pkgs=$({ grep -rl 'pgtest\.RequireDSN' --include='*.go' . || true; } \
            | sed 's|^\./||' | xargs -r -n1 dirname | sort -u)
          if [ -z "$pkgs" ]; then
            echo "::error::no package calls pgtest.RequireDSN — the harness moved and this guard is vacuous"
            exit 1
          fi
          rc=0
          for pkg in $pkgs; do
            if ! grep -qE "^ok[[:space:]]+github\.com/RigelBuild/compass/go/$pkg[[:space:]]" /tmp/pgtest.log; then
              echo "::error::real-Postgres package '$pkg' did not report ok — it failed, skipped, or never ran"
              rc=1
            fi
          done
          echo "pgtest: checked $(printf '%s\n' "$pkgs" | wc -l) real-Postgres packages against the service database"
          exit "$rc"

      - name: Put the dev shell's nixpkgs tools on PATH (for sqlc vet)
        # The Real-Postgres suite above needs only `go`, so this job skips the
        # moon battery's phase-two bootstrap by default. sqlc-vet (next step)
        # DOES need two nixpkgs tools from the dev shell — `psql` (apply the
        # migrations into the throwaway DB) and `sqlc` (run the vet) — so resolve
        # them here, the same way the moon job's phase two does: the attribute
        # list is the parity script's own parse of devenv.nix, so what CI installs
        # and what the gate expects cannot disagree. Run at the repo root (no
        # working-directory): parity.ts reads the workspace-root devenv.nix, and
        # bun is already on PATH from the language-toolchains step above.
        run: |
          attrs=$(bun tools/toolchain/parity.ts --print-nix-attrs)
          out=$(nix build --no-link --print-out-paths \
            -f tools/toolchain/gate-tools.nix env --arg attrs "$attrs")
          echo "$out/bin" >>"$GITHUB_PATH"

      - name: sqlc vet (db-prepare against the service Postgres)
        env:
          # Same service DSN the Real-Postgres suite uses. The sqlc-vet moon task
          # derives its own throwaway-DB URL from this (creates sqlcvet_$$, applies
          # the migrations, points SQLC_DATABASE_URL at it, drops it on exit), so
          # the job needs no extra env beyond the DSN. This is where db-prepare
          # actually runs against a live schema — the moon `ci` battery has no
          # Postgres service, so sqlc-vet is peeled into this env-bearing job
          # (ci.yml header: the moon battery realizes no environment), the same
          # pattern as the Real-Postgres suite itself.
          COMPASS_TEST_DATABASE_DSN: postgres://postgres:compass-test@127.0.0.1:5432/compass?sslmode=disable
        # `--force` so the vet always runs here regardless of what the PR diff
        # touched: moon would otherwise cache-hit or affected-skip the task when
        # no sqlc input changed, but db-prepare against the live service is the
        # whole point of peeling it into this job. (The VCS-base resolution moon
        # does before running is satisfied by this job's `fetch-depth: 0`
        # checkout above — `--force` alone does not skip it in moon 2.5.3.)
        run: moon run compass-go:sqlc-vet --force

  microvm:
    name: microvm
    runs-on: ubuntu-latest
    needs: setup
    # Peeled out of the moon gate so the KVM boot suite runs as its own lane, in
    # parallel with the moon battery and the other peer jobs, behind the CI
    # rollup. The job-level `if:` ANDs the dispatch-aware gate guard with the
    # microVM affected gate: on a PR it runs only when setup's closure contains
    # compass-go or compass-guest-image (microvm_affected), and always on
    # push/schedule. No privileged container — the boot leg runs rootless on a
    # bare runner with the udev + sysctl relaxations below (design T2 / §E-D2).
    # The in-step guards stay as defense-in-depth.
    if: >-
      (github.event_name != 'workflow_dispatch' ||
      github.event.inputs.pr != '') &&
      (github.event_name != 'pull_request' ||
      needs.setup.outputs.microvm_affected == 'true')
    timeout-minutes: 30
    env:
      # microVM suites bind AF_UNIX sockets under t.TempDir(); the runner's
      # default TMPDIR overflows sun_path's 108-byte cap. Same reason as the moon
      # gate and the pgtest job.
      TMPDIR: /tmp
    steps:
      # microVM runs no git-diff, so a default shallow checkout suffices.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Base-re-point re-trigger checks out the recomputed merge ref; empty
          # on every other event (see setup's checkout).
          ref: ${{ github.event.inputs.pr != '' && format('refs/pull/{0}/merge', github.event.inputs.pr) || '' }}

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          # The forks' functional CI is `nix build` of their own flakes, and the
          # whole toolchain — language runtimes AND the nixpkgs tools — is built
          # from nix below. Flakes are needed for the former; nix-command for both.
          #
          # The substituters below are declared here rather than delegated via
          # `accept-flake-config = true`. That setting makes nix accept the
          # `nixConfig` of ANY flake it evaluates, and the RigelBuild/devenv
          # flake the build fetches carries exactly such a block — so a PR could add its own substituter
          # AND its own trusted public key, and CI would fetch and run binaries
          # signed by the attacker's key, with signature verification satisfied
          # by the key the same PR supplied. Naming the two caches the forks
          # legitimately use keeps that trust in a reviewed file: adding a third
          # is a change to this workflow, not to a vendored tree.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the language toolchains on PATH
        # The nix-pinned language toolchains (bun/node/moon/go) — microvm needs
        # only `go` on PATH, but the whole `langs` set is a closed group built in
        # one nix build. They come from nix, not `setup-*` actions: gate-tools.nix's
        # `langs` output resolves the identical derivations the dev shell does —
        # bun/node/moon from tools/toolchain/toolchain-tools.nix, go from the
        # go-overlay applied to the devenv.lock-pinned nixpkgs — so CI runs the
        # pinned versions byte-for-byte and the parity gate has a concrete store
        # path to check each against. `langs` is a closed set, so it needs no
        # `--arg attrs` (the head defaults it).
        #
        # Unlike the moon gate, this job carries no phase-two nixpkgs-tools step:
        # the microVM suite runs only `go test` plus its own out-of-band nix
        # realizes (the guest image and the VMM env, both IN the step below), so
        # the language toolchains are the whole bootstrap.
        run: |
          stores=$(nix eval --json -f tools/toolchain/gate-tools.nix langs \
            | jq -r '.[].store')
          # Fail closed locally rather than leaning on the absence of a
          # root-level flake.nix: with no installables `nix build` would build a
          # default package if one existed, so an empty `langs` must error here.
          [ -n "$stores" ] || {
            echo "::error::gate-tools.nix langs produced no store paths"
            exit 1
          }
          nix build --no-link $stores
          for store in $stores; do
            echo "$store/bin" >>"$GITHUB_PATH"
          done

      - name: Enable KVM and unprivileged user namespaces
        # Two ephemeral-runner relaxations the microVM boot leg needs, both the
        # §E-D2 throwaway-runner class (a GHA runner is a single-tenant throwaway,
        # so a looser device/kernel posture that the dev box would never take is
        # harmless here). sudo is the runner's passwordless sudo; the test
        # processes themselves run rootless as the invoking uid.
        #
        # 1. /dev/kvm openable. The tagged microVM suites open /dev/kvm; on a
        #    fresh ubuntu-latest runner the device is root:kvm 0660, so the
        #    invoking uid cannot open it. Write the udev group-perms rule the
        #    ecosystem standardizes on — the same rule the Determinate
        #    nix-installer-action installs — then reload+trigger so it applies to
        #    the live node. We install Nix via cachix/install-nix-action (above),
        #    not the Determinate action, so we write the rule ourselves. MODE
        #    "0666" (world-RW) is deliberately looser than the dev box's kvm-group
        #    0660: on this throwaway runner a world-RW /dev/kvm is harmless, so we
        #    skip the group-membership dance and just make it openable.
        #
        # 2. Unprivileged user namespaces allowed. ubuntu-latest is now Ubuntu
        #    24.04, which ships AppArmor's apparmor_restrict_unprivileged_userns=1
        #    — an unconfined non-root process can no longer create a user
        #    namespace. passt AND virtiofsd both self-sandbox by detaching into
        #    their own userns (passt's --sandbox has no opt-out; virtiofsd's
        #    --sandbox=namespace is what the record §T4 specifies), so under the
        #    restriction they die at startup with "Failed to detach isolating
        #    namespaces: Operation not permitted" and the guest never boots. Set
        #    the sysctl to 0 to lift the restriction for this boot. This is a
        #    kernel-hardening knob, not a capability grant: the daemons still run
        #    rootless as the invoking uid with no added privilege — the record's
        #    "only privilege is the kvm group, no CAP_NET_ADMIN, no rootful
        #    helper" constraint holds. The setting reverts on the runner's
        #    teardown (it is a throwaway VM); nothing persists.
        #
        # Assume-KVM required-leg posture (§E-D2): the microVM step below sets
        # COMPASS_REQUIRE_MICROVM=1, so a run where GitHub withholds /dev/kvm reds
        # rather than silently skipping — cleared by a re-run.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: microVM suites
        working-directory: go
        env:
          # Turns microvmtest.Require's no-KVM SKIP into a hard failure: the KVM
          # leg is mandatory here, so a skip would silently pass the suite without
          # exercising anything (the pgtest/COMPASS_REQUIRE_LIVE posture,
          # go/internal/microvmtest/microvmtest.go).
          COMPASS_REQUIRE_MICROVM: '1'
          CGO_ENABLED: '1'
        # Realize E3's guest-image attrs and put the E1 VMM binaries on PATH, then
        # run the tagged suite. Both nix builds substitute their heavy inputs from
        # the caches configured above (extra-substituters); the guest kernel is an
        # unmodified pinned nixpkgs kernel, substituted free from cache.nixos.org.
        #
        # working-directory is `go`, so the guest-image build uses an absolute
        # -f $GITHUB_WORKSPACE/guest-image/default.nix rather than a brittle
        # ../guest-image relative path.
        #
        # The VMM stack (cloud-hypervisor, virtiofsd, passt) is Linux-only and so
        # lives OUTSIDE devenv.nix's parsed `packages` literal — the parity gate
        # does NOT install it. It is realized out-of-band here from its own pinned
        # helper, the chromium-e2e pattern above: read each out-path's bin/ into
        # $GITHUB_PATH so the test processes resolve them (via exec.LookPath in
        # microvmtest.Require). A $GITHUB_PATH append only affects SUBSEQUENT
        # steps, so this must precede the `go test` below — hence a separate step
        # would work too, but keeping the realize+run together documents the pair.
        #
        # -v so the guard below can read per-package outcomes. The redirect (not a
        # pipe to tee) is deliberate: a pipeline's exit status is its LAST
        # command's, so `go test ... | tee` returns tee's 0 and a real failure is
        # silently discarded. Capture, replay the log, then exit on go test's own
        # status. `|| rc=$?` because the step runs under `bash -e`, which would
        # otherwise abort before the log is ever printed.
        run: |
          guest=$(nix build --no-link --print-out-paths \
            -f "$GITHUB_WORKSPACE/guest-image/default.nix" \
            compass-guest-kernel compass-guest-rootfs compass-guest-initrd)
          kernel=$(echo "$guest" | sed -n '1p')
          rootfs=$(echo "$guest" | sed -n '2p')
          initrd=$(echo "$guest" | sed -n '3p')
          {
            echo "COMPASS_TEST_GUEST_KERNEL=$kernel/bzImage"
            echo "COMPASS_TEST_GUEST_ROOTFS=$rootfs"
            echo "COMPASS_TEST_GUEST_INITRD=$initrd"
          } >>"$GITHUB_ENV"
          export COMPASS_TEST_GUEST_KERNEL="$kernel/bzImage"
          export COMPASS_TEST_GUEST_ROOTFS="$rootfs"
          export COMPASS_TEST_GUEST_INITRD="$initrd"

          for out in $(nix build --no-link --print-out-paths \
            -f "$GITHUB_WORKSPACE/tools/toolchain/microvm-vmm-env.nix" \
            cloud-hypervisor virtiofsd passt); do
            echo "$out/bin" >>"$GITHUB_PATH"
            PATH="$out/bin:$PATH"
          done
          export PATH

          rc=0
          go test -tags microvm -race -v -timeout 15m ./... >/tmp/microvm.log 2>&1 || rc=$?
          cat /tmp/microvm.log
          exit "$rc"

      - name: Assert the microVM suites ran rather than skipped
        working-directory: go
        # microvmtest.Require SKIPS (never fails) when /dev/kvm is not openable —
        # correct for a KVM-less box, and a silent no-op here. This step exists to
        # run those assertions KVM-backed, so a skip is a failure of its whole
        # purpose and must be loud (the pgtest guard's exact shape).
        #
        # Both halves are derived from source rather than hardcoded, because a
        # guard that drifts out of step with what it guards passes silently:
        #   - the skip text is read from microvmtest.go, so rewording it cannot
        #     leave this grep matching nothing and reporting success;
        #   - the package list is the set that actually calls microvmtest.Require,
        #     so the count means "the microVM packages ran". grep reads file text
        #     regardless of build tags, so it finds the tagged canary too.
        run: |
          skip=$(sed -n 's/.*t\.Skip("\(\/dev\/kvm is not openable[^"]*\)").*/\1/p' \
            internal/microvmtest/microvmtest.go)
          if [ -z "$skip" ]; then
            echo "::error::could not read the skip message out of internal/microvmtest/microvmtest.go — this guard has drifted from the harness and is no longer checking anything"
            exit 1
          fi
          if grep -qF "$skip" /tmp/microvm.log; then
            echo "::error::microvmtest harness skipped — /dev/kvm was not openable, so nothing was asserted"
            grep -nF "$skip" /tmp/microvm.log | head
            exit 1
          fi
          pkgs=$({ grep -rl 'microvmtest\.Require' --include='*.go' . || true; } \
            | sed 's|^\./||' | xargs -r -n1 dirname | sort -u)
          if [ -z "$pkgs" ]; then
            echo "::error::no package calls microvmtest.Require — the harness moved and this guard is vacuous"
            exit 1
          fi
          rc=0
          for pkg in $pkgs; do
            if ! grep -qE "^ok[[:space:]]+github\.com/RigelBuild/compass/go/$pkg[[:space:]]" /tmp/microvm.log; then
              echo "::error::microVM package '$pkg' did not report ok — it failed, skipped, or never ran"
              rc=1
            fi
          done
          echo "microvm: checked $(printf '%s\n' "$pkgs" | wc -l) KVM-backed packages"
          exit "$rc"

