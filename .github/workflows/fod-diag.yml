name: FOD Diag

on:
  pull_request:
    paths:
      - .github/workflows/fod-diag.yml

permissions:
  contents: read

jobs:
  diag:
    name: FOD Diag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 (v2.2.0)
        with:
          bun-version: 1.3.13

      - name: Reproduce the agent-image node_modules install and dump a manifest
        run: |
          set -euo pipefail
          bun --version
          echo "--- detected libc ---"
          ldd --version 2>&1 | head -1 || true
          getconf GNU_LIBC_VERSION 2>&1 || true
          bun install --frozen-lockfile --ignore-scripts --filter '@compass/agent'
          echo "=== TOP-LEVEL .bun PACKAGE SET ==="
          ls node_modules/.bun | sort | tee /tmp/gha-bun-pkgs.txt | wc -l
          echo "=== FULL MANIFEST (type size path), sorted ==="
          find node_modules packages/compass-agent/node_modules \( -type f -o -type l \) -printf '%y %s %P\n' 2>/dev/null | sort -k3 > /tmp/gha-fod-manifest.txt
          wc -l /tmp/gha-fod-manifest.txt
          echo "=== musl/gnu variant dirs present ==="
          ls node_modules/.bun | grep -iE 'musl|gnu|linuxmusl' || echo "none"

      - name: Upload manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gha-fod-manifest
          path: |
            /tmp/gha-bun-pkgs.txt
            /tmp/gha-fod-manifest.txt
