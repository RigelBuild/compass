# The compass unified release lane.
#
# ONE workflow carries the product's release duties on TWO triggers (never
# release-only). This file supersedes both the closed PR #711 draft and — once
# T4 lands — `.github/workflows/publish-agent-image.yml`, whose per-push image
# PUBLISH duty is RELOCATED here (the file retires; the duty does not).
#
# WHY A SEPARATE WORKFLOW, NOT A STEP IN THE CI GATE — the same deliberate
# exception to this repo's ONE-JOB doctrine that publish-agent-image.yml makes:
# least privilege (per-job grants, no token ever reaches a fork PR — there is NO
# `pull_request` trigger), its own serializing concurrency (the opposite of the
# gate's cancelling group), and staying off the hot path (the heavy nix closure
# never reds the required merge gate).
#
# Jobs in THIS task (T1+T2):
#   - release-pr    — runs release-please on every main push, authenticated by a
#                     scoped GitHub App token (NOT GITHUB_TOKEN) so the standing
#                     Release PR receives CI and the merge gate is real (§A5).
#   - publish-image — the RELOCATED per-push duty: publishes :git-<sha12> +
#                     :latest via agent-image/publish.sh, self-gated by an in-job
#                     changed-path check over the image closure set.
#
# The release-assets + release-image jobs (gated on
# needs.release-pr.outputs.releases_created) are T3 (RIG-2915) and are NOT here.
#
# See docs/designs/infra/release/compass-unified-release-lane/design.md (§A1, §A2, §A4, §A5)
# and docs/architecture/build-and-ci.md.

name: release

on:
  # NO paths filter: release-pr MUST see every main commit (a paths filter would
  # drop commits from the changelog and stall the Release PR). publish-image
  # self-gates in-job instead (see its first step).
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: no workflow-level grant. Every job declares exactly what it
# needs and nothing else.
permissions: {}

# The image closure path set, defined ONCE. A change to any of these globs can
# change the published image artifact, so it must trigger a republish. This is
# the SAME set publish-agent-image.yml:49-64 names — with that file's self-ref
# retargeted to release.yml — consumed by publish-image's in-job gate now and by
# T3's release-image resolver cross-check later, so it lives in one place.
env:
  IMAGE_CLOSURE_PATHS: |
    agent-image/**
    packages/compass-agent/**
    package.json
    bun.lock
    .github/workflows/release.yml
    tools/toolchain/versions/bun.nix

jobs:
  release-pr:
    name: release-pr
    runs-on: ubuntu-latest
    # Cut/refresh the standing Release PR and, on its merge commit, the vX.Y.Z
    # tag + GitHub Release. Nothing else.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A GITHUB_TOKEN-opened Release PR gets no pull_request CI (GitHub's
      # recursion guard), so branch protection could not gate it. Mint a scoped
      # (contents + pull-requests), installation-scoped, per-run App token
      # instead (§A5/DL-301). The App id + private key are provisioned by T6
      # (RIG-2995); this lane only references the secret names.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          # The App token, NOT GITHUB_TOKEN — this is what makes the Release PR
          # receive CI and lets release-please be the sole vX.Y.Z tag minter.
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-image:
    name: publish-image
    runs-on: ubuntu-latest
    # Least privilege: read the tree, write the GHCR package, nothing else.
    permissions:
      contents: read
      packages: write
    # Publishes SERIALIZE — an in-flight :latest move must never be
    # half-superseded by a newer run. `cancel-in-progress: false` is the OPPOSITE
    # of ci.yml's cancelling group. `queue: max` (the bare literal token — there
    # is no numeric form; up to 100 pending) rather than the default single
    # pending slot: a per-push burst must be able to queue up to 100 deep WITHOUT
    # a later entrant evicting a pending run, because T3's non-superseding
    # :vX.Y.Z release mint shares this exact group and a bare
    # `cancel-in-progress: false` alone would let a per-push entrant drop it
    # (§A4 no-drop invariant).
    concurrency:
      group: publish-agent-image
      cancel-in-progress: false
      queue: max
    # workflow_dispatch runs on any branch; guard so a dispatch from a feature
    # branch can never mint a `:git-<sha>` for unmerged code nor move `:latest`
    # off main. Main pushes satisfy this trivially.
    if: github.ref == 'refs/heads/main'
    # The image closure is the heavy nix build that sizes this timeout, the same
    # cost that motivates ci.yml's 90m.
    timeout-minutes: 90
    # `run: ./publish.sh` resolves relative to this default, and publish.sh's own
    # `github:RigelBuild/devenv` container build resolves only from agent-image/. The
    # skopeo login/verify steps do NOT depend on this cwd — they invoke skopeo by
    # name off PATH (bootstrapped below as an absolute store path).
    defaults:
      run:
        working-directory: agent-image
    steps:
      # Default depth — the publish script needs only HEAD (git rev-parse HEAD
      # for the :git-<sha> tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide whether this push touches the image closure
        id: gate
        # The workflow trigger carries NO `paths:` filter (release-pr needs every
        # commit), so this job decides for itself whether the push touched the
        # closure set. This is a push-event before/after tree diff, NOT ci.yml's
        # moon-affected query — a distinct technique. Run at the repo root; the
        # closure globs are repo-root-relative.
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # workflow_dispatch has no before/after range to diff, and §A4's
          # remediation (dispatch the per-push publish, then re-run the release)
          # depends on a dispatch ALWAYS publishing. Force-publish.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: force-publish (no push range to diff)"
            exit 0
          fi

          # First push to the branch has an all-zero before-sha with no diff
          # base. Publish rather than risk silently dropping a closure change
          # (the no-drop invariant errs toward publishing).
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "no diff base (first push to branch): force-publish"
            exit 0
          fi

          # A two-dot tree diff needs only the two endpoint commits; checkout has
          # HEAD at depth 1, so fetch the before endpoint the same way.
          git fetch --no-tags --depth=1 origin "$BEFORE_SHA" >/dev/null 2>&1 || true

          # If the before-sha is unreachable (a force-push overwrote the prior
          # tip, a GC'd object, or a fetch transient) the diff base is missing.
          # Publish rather than fail the job — the no-drop invariant errs toward
          # publishing, matching the workflow_dispatch and first-push fallbacks.
          if ! changed="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" 2>/dev/null)"; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "before-sha unreachable: force-publish (no-drop errs toward publishing)"
            exit 0
          fi

          should_publish=false
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            case "$pattern" in
              *'/**')
                # Directory glob: match any changed file under the prefix.
                prefix="${pattern%'/**'}/"
                while IFS= read -r f; do
                  [ -n "$f" ] || continue
                  case "$f" in
                    "$prefix"*) should_publish=true ;;
                  esac
                done <<< "$changed"
                ;;
              *)
                # Exact file path.
                while IFS= read -r f; do
                  [ "$f" = "$pattern" ] && should_publish=true
                done <<< "$changed"
                ;;
            esac
            [ "$should_publish" = true ] && break
          done <<< "$IMAGE_CLOSURE_PATHS"

          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "changed-path gate over the image closure set: should_publish=$should_publish"

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        if: steps.gate.outputs.should_publish == 'true'
        with:
          # nix-command + flakes for the RigelBuild forks' flakes. The two caches
          # are declared HERE, not delegated via `accept-flake-config` — that
          # setting makes nix trust the `nixConfig` of ANY flake it evaluates
          # (the RigelBuild/devenv flake carries such a block), so a PR could add its
          # own substituter AND trusted key and have CI run attacker-signed
          # binaries. Naming the caches in this reviewed file keeps that trust
          # reviewed.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the pinned bun toolchain on PATH
        if: steps.gate.outputs.should_publish == 'true'
        # bun comes from the nix-pinned toolchain, never setup-bun. Resolve it
        # from gate-tools.nix's langs so it is byte-identical to the dev shell's
        # bun. Only bun is bootstrapped here: publish needs the devenv-CLI
        # resolver, not the whole language set.
        working-directory: .
        run: |
          set -euo pipefail
          store=$(nix eval --json -f tools/toolchain/gate-tools.nix langs.bun | jq -r '.store')
          [ -n "$store" ] || {
            echo "::error::gate-tools.nix langs.bun produced no store path" >&2
            exit 1
          }
          nix build --no-link "$store"
          echo "$store/bin" >>"$GITHUB_PATH"

      - name: Put the fork's patched skopeo on PATH
        if: steps.gate.outputs.should_publish == 'true'
        # The publish lane invokes a plain `skopeo` (the RigelBuild/nix2container
        # fork's patched build, understanding the `nix:` transport). Resolve it
        # from the shared pinned helper, tools/toolchain/skopeo-nix2container-env.nix
        # — which builds the exact derivation the root dev shell installs, from
        # the nix2container + nixpkgs revisions ../devenv.lock pins (one source of
        # truth for both revs, no raw nix2container flake ref) — and prepend its
        # bin/ to PATH, so the login / publish / verify steps below invoke skopeo
        # by name. This is the same out-of-band `nix build` pattern ci.yml uses
        # for chromium-e2e-env.nix, and it avoids entering the root dev shell
        # (whose enterShell banner would pollute a captured store path). skopeo is
        # deliberately NOT in agent-image/devenv.nix: a package there would bake
        # its ~168 MB closure into every published image via the container
        # entrypoint's sourced shell env.
        working-directory: .
        run: |
          set -euo pipefail
          # `--print-out-paths` prints every output (skopeo ships a `-man` output
          # too); take the one carrying bin/skopeo, not a fixed line.
          skopeo_bin=""
          for store in $(nix build --no-link --print-out-paths \
            -f tools/toolchain/skopeo-nix2container-env.nix skopeo); do
            if [ -x "$store/bin/skopeo" ]; then
              skopeo_bin="$store/bin"
              break
            fi
          done
          if [ -z "$skopeo_bin" ]; then
            echo "::error::skopeo-nix2container-env.nix produced no output carrying bin/skopeo" >&2
            exit 1
          fi
          echo "$skopeo_bin" >> "$GITHUB_PATH"

      - name: Pin the registry auth file
        if: steps.gate.outputs.should_publish == 'true'
        # LOAD-BEARING. `skopeo login` and the publish script's `skopeo copy`
        # run as SEPARATE `nix run` processes and must resolve the SAME creds
        # file. The default location ($XDG_RUNTIME_DIR/containers/auth.json) is
        # environment-dependent on GitHub-hosted runners — a mismatch greens the
        # login step and then 401s the copy. Export an explicit path both honor.
        run: echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/ghcr-auth.json" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: steps.gate.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the actor through env rather than interpolating ${{ }} into the
          # shell — behavior-identical here (GitHub usernames carry no shell
          # metacharacters), but keeps context values off the run: command line.
          ACTOR: ${{ github.actor }}
        # The root compass dev shell's patched skopeo (bootstrapped onto PATH
        # above) understands the `nix:` transport the publish uses. It is a plain
        # command here — one skopeo backs the whole lane, resolved from the
        # lockfile-pinned nix2container input, and no raw nix2container flake ref
        # lives in this workflow.
        run: |
          skopeo \
            login ghcr.io -u "$ACTOR" --password-stdin \
            --authfile "$REGISTRY_AUTH_FILE" <<< "$GITHUB_TOKEN"

      - name: Build and publish the two-tag set
        if: steps.gate.outputs.should_publish == 'true'
        # No args = the default two-tag set (:git-<sha> then :latest). The script
        # honors $REGISTRY_AUTH_FILE, builds the spec once, and enforces
        # :git-<sha> immutability, exiting non-zero on violation.
        run: ./publish.sh

      - name: Verify the published tags resolve from GHCR
        if: steps.gate.outputs.should_publish == 'true'
        # Proves the artifact is resolvable from GHCR (not merely that copy
        # exited 0), that the platform contract holds, and that the two-copy pair
        # landed coherently. Every skopeo call pins --authfile.
        run: |
          set -euo pipefail
          sha12="$(git rev-parse --short=12 HEAD)"
          ref="docker://ghcr.io/rigelbuild/compass-agent"
          inspect_json="$RUNNER_TEMP/git-inspect.json"

          # Resolvable from GHCR at the immutable tag. skopeo is the root dev
          # shell's patched skopeo on PATH (bootstrapped above), understanding
          # the `nix:` transport.
          skopeo inspect --authfile "$REGISTRY_AUTH_FILE" "$ref:git-$sha12" > "$inspect_json"

          # Cheapest platform-contract-regression tripwire.
          arch="$(jq -r .Architecture "$inspect_json")"
          os="$(jq -r .Os "$inspect_json")"
          if [ "$arch" != "amd64" ] || [ "$os" != "linux" ]; then
            echo "platform contract violated: got $os/$arch, want linux/amd64" >&2
            exit 1
          fi

          # :latest and :git-<sha> must share a config digest — proves the
          # two-copy pair landed coherently.
          git_digest="$(skopeo inspect --raw --authfile "$REGISTRY_AUTH_FILE" "$ref:git-$sha12" | jq -r .config.digest)"
          latest_digest="$(skopeo inspect --raw --authfile "$REGISTRY_AUTH_FILE" "$ref:latest" | jq -r .config.digest)"
          if [ "$git_digest" != "$latest_digest" ]; then
            echo "tag pair incoherent: :git-$sha12=$git_digest != :latest=$latest_digest" >&2
            exit 1
          fi
          echo "verified: $ref:git-$sha12 resolves, linux/amd64, coherent with :latest"

  release-assets-macos:
    name: release-assets-macos
    runs-on: macos-14
    # Build the macOS .app/.dmg app bundle at the release sha on a macos-14
    # (arm64) runner and hand it to release-assets as a workflow artifact
    # (compass-distribution T3 / RIG-2754). It runs on macos-14 because the shell
    # links the SYSTEM WebKit framework and the bundle edge (codesign/hdiutil) is
    # mac-only (Global Constraint 5) — the dmg CANNOT be produced on the ubuntu
    # release-assets runner. The SINGLE SHA256SUMS stays owned by release-assets
    # (design §18): this job PRODUCES the dmg, release-assets FOLDS it in. Same
    # release-gating `if:` + main-ref guard + release-pr dependency as
    # release-assets.
    needs: release-pr
    if: github.ref == 'refs/heads/main' && needs.release-pr.outputs.releases_created == 'true'
    # Least privilege: read the tree, produce an artifact. NOT contents:write —
    # this job never touches the Release; release-assets attaches the folded set.
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      # Check out the release sha — the Release PR's merge commit release-please
      # tagged (same ref release-assets builds from).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-pr.outputs.sha }}

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          # nix-command + flakes; the toolchain (Go + bun) is built from nix
          # (Global Constraint 3), never `setup-go`. The two caches are declared
          # HERE, not delegated via `accept-flake-config` — that setting makes nix
          # trust the `nixConfig` of ANY flake it evaluates, so a PR could add its
          # own substituter AND trusted key. Naming the caches keeps that trust
          # reviewed.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the language toolchains on PATH
        # The pinned toolchain comes from nix, never `setup-go` (Global Constraint
        # 3): gate-tools.nix's `langs` output resolves the identical derivations
        # the dev shell does — go from the go-overlay applied to the
        # devenv.lock-pinned nixpkgs — so this build runs the pinned go
        # byte-for-byte. Copied verbatim from release-assets (phase one).
        run: |
          stores=$(nix eval --json -f tools/toolchain/gate-tools.nix langs \
            | jq -r '.[].store')
          # Fail closed locally rather than leaning on the absence of a
          # root-level flake.nix: with no installables `nix build` would build a
          # default package if one existed, so an empty `langs` must error here.
          [ -n "$stores" ] || {
            echo "::error::gate-tools.nix langs produced no store paths"
            exit 1
          }
          nix build --no-link $stores
          for store in $stores; do
            echo "$store/bin" >>"$GITHUB_PATH"
          done

      - name: Build and stage the macOS app bundle
        # The release version is the semver release-please cut, sourced from
        # version.txt (Global Constraint 1: ONE version string across all
        # binaries — the darwin shell and the three sidecars carry the SAME clean
        # semver ldflags stamp as the released daemons). The shell compiles with
        # cgo against the system WebKit framework (no build tag — T2 restructured
        # the tags so a bare `go build ./cmd/compass-app` compiles on darwin);
        # the three embedded sidecars are pure Go (CGO_ENABLED=0). The
        # macos-bundle tool then stages + ad-hoc signs the .app — shell, sidecars
        # beside it in Contents/MacOS, UI dist in Contents/Resources — and wraps
        # the .dmg under the release asset grammar. No compass-postgres:
        # embedded's postgres is a stock postgres:18 container (DL-260/DL-321).
        env:
          TAG_NAME: ${{ needs.release-pr.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="$(cat version.txt)"
          tag="$TAG_NAME"
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "TAG=$tag" >>"$GITHUB_ENV"

          CGO_ENABLED=1 go -C go build -trimpath \
            -ldflags "-X main.version=$version" \
            -o /tmp/compass-app ./cmd/compass-app

          for b in compass-stack compass-server compass-runner; do
            CGO_ENABLED=0 go -C go build -trimpath \
              -ldflags "-X main.version=$version" \
              -o "/tmp/$b" "./cmd/$b"
          done

          moon run compass-ui:build

          bun run tools/macos-bundle/index.ts \
            --binary /tmp/compass-app \
            --dist apps/ui/dist \
            --version "$version" \
            --sidecar /tmp/compass-stack \
            --sidecar /tmp/compass-server \
            --sidecar /tmp/compass-runner \
            --out "compass-app_${tag}_darwin-arm64.dmg"

      - name: Upload the macOS dmg for release-assets to fold in
        # release-assets (ubuntu) downloads this artifact and folds the dmg into
        # the single SHA256SUMS + the release-notes --asset list + the upload
        # array. upload-artifact and download-artifact are independent actions
        # with independent version numbers; this upload (v7) and the consumer's
        # download (v8) interoperate on the shared v4+ artifact backend.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compass-app-darwin-arm64-dmg
          path: compass-app_${{ env.TAG }}_darwin-arm64.dmg
          if-no-files-found: error

  release-assets:
    name: release-assets
    runs-on: ubuntu-latest
    # Build the four released binaries at the release sha and attach them — plus
    # SHA256SUMS and the nix-outputs manifest — to the GitHub Release
    # release-please already created for this tag. Runs ONLY when the merged
    # Release PR actually cut a release. The main-ref guard is kept on EVERY
    # release job (§A5(2)): a workflow_dispatch from a feature branch must never
    # mint release artifacts for unmerged code, even were release-please to emit
    # releases_created there.
    needs: [release-pr, release-assets-macos]
    if: github.ref == 'refs/heads/main' && needs.release-pr.outputs.releases_created == 'true'
    # Least privilege: write the Release, nothing else. NOT packages:write — the
    # release-notes generator reads the PUBLIC image digest anonymously, and this
    # lane never writes a registry (Global Constraint 7).
    permissions:
      contents: write
    # The nix toolchain resolve is the cost that sizes this timeout — the same
    # ceiling ci.yml and publish-image use.
    timeout-minutes: 90
    steps:
      # Check out the release sha — the Release PR's merge commit release-please
      # tagged. Default depth: the assets build from that tree, and the
      # release-notes digest pointer resolves from `git rev-parse HEAD`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-pr.outputs.sha }}

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          # nix-command + flakes for the RigelBuild forks' flakes. The two caches
          # are declared HERE, not delegated via `accept-flake-config` — that
          # setting makes nix trust the `nixConfig` of ANY flake it evaluates
          # (the RigelBuild/devenv flake carries such a block), so a PR could add its
          # own substituter AND trusted key and have CI run attacker-signed
          # binaries. Naming the caches in this reviewed file keeps that trust
          # reviewed.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the language toolchains on PATH
        # The pinned toolchain comes from nix, never `setup-go` (Global
        # Constraint 8): gate-tools.nix's `langs` output resolves the identical
        # derivations the dev shell does — go from the go-overlay applied to the
        # devenv.lock-pinned nixpkgs — so this build runs the pinned go
        # byte-for-byte. Copied verbatim from ci.yml:207-220 (phase one).
        run: |
          stores=$(nix eval --json -f tools/toolchain/gate-tools.nix langs \
            | jq -r '.[].store')
          # Fail closed locally rather than leaning on the absence of a
          # root-level flake.nix: with no installables `nix build` would build a
          # default package if one existed, so an empty `langs` must error here.
          [ -n "$stores" ] || {
            echo "::error::gate-tools.nix langs produced no store paths"
            exit 1
          }
          nix build --no-link $stores
          for store in $stores; do
            echo "$store/bin" >>"$GITHUB_PATH"
          done

      - name: Put the fork's patched skopeo on PATH
        # The release-notes generator queries GHCR for the image config digest
        # with a plain `skopeo` (the RigelBuild/nix2container fork's patched
        # build). The langs bootstrap above carries only go/bun/node/moon, so
        # skopeo must be provisioned here or the digest query — a core T2
        # deliverable (Fork 2(ii)) — silently records the image absent on every
        # release. Resolve it from the shared pinned helper
        # tools/toolchain/skopeo-nix2container-env.nix and prepend its bin/, the
        # same out-of-band `nix build` pattern publish-agent-image.yml:117-148
        # uses. The image is public (Matt-ruled), so reading the digest needs no
        # `skopeo login` / packages:read — this lane stays contents:write-only.
        working-directory: .
        run: |
          set -euo pipefail
          # `--print-out-paths` prints every output (skopeo ships a `-man` output
          # too); take the one carrying bin/skopeo, not a fixed line.
          skopeo_bin=""
          for store in $(nix build --no-link --print-out-paths \
            -f tools/toolchain/skopeo-nix2container-env.nix skopeo); do
            if [ -x "$store/bin/skopeo" ]; then
              skopeo_bin="$store/bin"
              break
            fi
          done
          if [ -z "$skopeo_bin" ]; then
            echo "::error::skopeo-nix2container-env.nix produced no output carrying bin/skopeo" >&2
            exit 1
          fi
          echo "$skopeo_bin" >> "$GITHUB_PATH"

      - name: Build the release binaries
        # The release version is the semver release-please cut, sourced from
        # version.txt (Global Constraint 1: ONE version string across all
        # binaries AND the image tag). Asset names carry the semver tag. #711's
        # build step, re-based from the `build-<sha12>` prerelease shape to the
        # semver `vX.Y.Z` tag. -trimpath + CGO_ENABLED=0: the three daemons/CLI
        # are pure Go (cgo is needed only by the pgtest suites, not any build
        # here), and the darwin-arm64 CLI cross-compiles cleanly from this ubuntu
        # runner.
        env:
          TAG_NAME: ${{ needs.release-pr.outputs.tag_name }}
        run: |
          set -euo pipefail
          sha12="$(git rev-parse --short=12 HEAD)"
          version="$(cat version.txt)"
          tag="$TAG_NAME"
          echo "SHA12=$sha12" >>"$GITHUB_ENV"
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "TAG=$tag" >>"$GITHUB_ENV"

          ldflags="-X main.version=$version"

          # Three linux-amd64 binaries (the deployable daemons + the CLI).
          for name in compass compass-server compass-runner; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go -C go build -trimpath -ldflags "$ldflags" \
              -o "../${name}_${tag}_linux-amd64" "./cmd/${name}"
          done

          # The CLI cross-built for darwin-arm64 (Matt's dev machines run the CLI
          # against remote stacks; the daemons deploy on Linux only — Fork 2(i)).
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go -C go build -trimpath -ldflags "$ldflags" \
            -o "../compass_${tag}_darwin-arm64" ./cmd/compass

      - name: Build and stage the Linux app bundle
        # The app tarball (gtk4 shell + the three embedded sidecars + UI dist + desktop
        # + LICENSE) joins the semver Release asset set (RIG-2752 / compass-distribution T1).
        # COMPASS_BUNDLE_VERSION pins the clean semver so the app binary carries
        # the same one version as the daemons (Global Constraint 1); moon's
        # compass-app-bundle:build deps-edge builds the UI dist first. Rename the
        # produced tarball to the Release asset grammar and stage it at repo root
        # beside the binaries the SHA256SUMS / upload steps consume.
        env:
          COMPASS_BUNDLE_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          moon run compass-app-bundle:build
          mv "app-bundle/compass-app-${COMPASS_BUNDLE_VERSION}-linux-amd64.tar.gz" \
             "compass-app_${TAG}_linux-amd64.tar.gz"

      - name: Download the macOS dmg from the release-assets-macos producer
        # The dmg is built on macos-14 (release-assets-macos) because the shell
        # links the SYSTEM WebKit framework and codesign/hdiutil are mac-only
        # (Global Constraint 5). Fetch it to repo root BEFORE the SHA256SUMS step
        # so it folds into the single checksum file + the notes + the upload set
        # alongside the linux assets (design §18). This download (v8) and the
        # producer's upload (v7) interoperate on the shared v4+ artifact backend
        # (the two actions version independently).
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compass-app-darwin-arm64-dmg
          path: .

      - name: Generate SHA256SUMS over the built assets
        run: |
          set -euo pipefail
          sha256sum \
            "compass_${TAG}_linux-amd64" \
            "compass-server_${TAG}_linux-amd64" \
            "compass-runner_${TAG}_linux-amd64" \
            "compass_${TAG}_darwin-arm64" \
            "compass-app_${TAG}_darwin-arm64.dmg" \
            "compass-app_${TAG}_linux-amd64.tar.gz" \
            > SHA256SUMS

      - name: Generate the release body + nix-outputs manifest
        # The T2 generator (a bun/TS tool with a pure, unit-tested core). It
        # queries GHCR for the image digest at :git-<sha12> (DEGRADING to a
        # recorded-absence line when the image lane has not published this sha)
        # and runs `nix path-info` over the toolchain `langs` set, writing the
        # two files the release upload consumes.
        run: |
          set -euo pipefail
          bun run tools/release-notes/index.ts \
            --sha "$SHA12" \
            --version "$VERSION" \
            --tag "$TAG" \
            --asset "compass_${TAG}_linux-amd64" \
            --asset "compass-server_${TAG}_linux-amd64" \
            --asset "compass-runner_${TAG}_linux-amd64" \
            --asset "compass_${TAG}_darwin-arm64" \
            --asset "compass-app_${TAG}_linux-amd64.tar.gz" \
            --asset "compass-app_${TAG}_darwin-arm64.dmg" \
            --asset "SHA256SUMS" \
            --body-out RELEASE_BODY.md \
            --manifest-out nix-outputs.json

      - name: Upload assets and append the appendix to the Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The Release already EXISTS: release-please cut it (tag + generated
        # changelog notes) on the merge commit. This lane never creates it — it
        # attaches the built assets with --clobber (idempotent on re-run) and
        # APPENDS the generator's binaries/image/nix-outputs appendix BELOW
        # release-please's generated notes, preserving the changelog rather than
        # overwriting it. Not `--prerelease`: this is a real release.
        run: |
          set -euo pipefail
          assets=(
            "compass_${TAG}_linux-amd64"
            "compass-server_${TAG}_linux-amd64"
            "compass-runner_${TAG}_linux-amd64"
            "compass_${TAG}_darwin-arm64"
            "compass-app_${TAG}_linux-amd64.tar.gz"
            "compass-app_${TAG}_darwin-arm64.dmg"
            SHA256SUMS
            # nix-outputs.json (below) is the generator's machine-readable
            # manifest — regenerable output attached for consumers, deliberately
            # not in SHA256SUMS, which checksums the downloadable binaries.
            nix-outputs.json
          )
          gh release upload "$TAG" --clobber "${assets[@]}"

          # Append the generator appendix below release-please's changelog,
          # preserving the changelog rather than replacing it. Idempotent on
          # re-run: strip any prior appendix (the sentinel comment onward, which
          # includes the separator that follows it) and any CR from GitHub's
          # CRLF-normalized body, then capture via `$(...)` so all trailing
          # newlines collapse, and reconstruct with a fixed separator. Repeated
          # "Re-run all jobs" runs produce byte-identical notes — not a stack of
          # duplicate appendices, nor a single appendix atop a growing blank-line
          # gap (the CR strip is what makes the fixpoint hold against the live
          # API, which returns the body CRLF-terminated). The release-image
          # remediation invites a re-run, so this path is real.
          notes="$RUNNER_TEMP/release-notes.md"
          changelog="$(gh release view "$TAG" --json body -q .body \
            | sed '/<!-- release-notes-appendix -->/,$d' \
            | sed 's/\r$//')"
          {
            printf '%s\n\n<!-- release-notes-appendix -->\n\n---\n\n' "$changelog"
            cat RELEASE_BODY.md
          } > "$notes"
          gh release edit "$TAG" --notes-file "$notes"

  release-image:
    name: release-image
    runs-on: ubuntu-latest
    # Digest-re-tag the already-published per-push `:git-<sha12>` image to the
    # semver `:vX.Y.Z`. NEVER a second build (the release sha's image content is
    # byte-identical to the last closure-affecting sha's — §A4), NEVER touches
    # `:latest` (owned exclusively by publish-image). Runs ONLY when the merged
    # Release PR actually cut a release.
    needs: release-pr
    # Least privilege: read the tree, write the GHCR package, nothing else
    # (Global Constraint 7).
    permissions:
      contents: read
      packages: write
    # The SAME group as publish-image: a non-superseding `:vX.Y.Z` release mint
    # must serialize behind an in-flight `:latest` move WITHOUT being cancelled
    # by a later per-push entrant claiming the single default pending slot.
    # `queue: max` (the bare literal token — no numeric form; up to 100 pending)
    # rather than the default single pending slot preserves the §A4 no-drop
    # invariant; bare `cancel-in-progress: false` alone would drop it.
    # Within a single release run this also queues behind that run's own
    # publish-image job (same group) — intended serialization latency, not a
    # hang; neither job `needs` the other.
    concurrency:
      group: publish-agent-image
      cancel-in-progress: false
      queue: max
    # workflow_dispatch runs on any branch; guard so a dispatch from a feature
    # branch can never mint a `:vX.Y.Z` for unmerged code. Main pushes satisfy
    # this trivially (§A5(2), mirrors publish-image).
    if: github.ref == 'refs/heads/main' && needs.release-pr.outputs.releases_created == 'true'
    timeout-minutes: 90
    steps:
      # Full history: the resolver walks first-parent ancestors of the release
      # sha (§A4/Plan T3), so a shallow checkout would truncate the walk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-pr.outputs.sha }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          # nix-command + flakes for the RigelBuild forks' flakes. The two caches
          # are declared HERE, not delegated via `accept-flake-config` — that
          # setting makes nix trust the `nixConfig` of ANY flake it evaluates
          # (the RigelBuild/devenv flake carries such a block), so a PR could add its
          # own substituter AND trusted key and have CI run attacker-signed
          # binaries. Naming the caches in this reviewed file keeps that trust
          # reviewed.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the fork's patched skopeo on PATH
        # The resolver probes and copies with a plain `skopeo` (the
        # RigelBuild/nix2container fork's patched build). Resolve it from the
        # shared pinned helper, tools/toolchain/skopeo-nix2container-env.nix, and
        # prepend its bin/ to PATH — the same out-of-band `nix build` pattern
        # publish-agent-image.yml:117-148 uses.
        working-directory: .
        run: |
          set -euo pipefail
          # `--print-out-paths` prints every output (skopeo ships a `-man` output
          # too); take the one carrying bin/skopeo, not a fixed line.
          skopeo_bin=""
          for store in $(nix build --no-link --print-out-paths \
            -f tools/toolchain/skopeo-nix2container-env.nix skopeo); do
            if [ -x "$store/bin/skopeo" ]; then
              skopeo_bin="$store/bin"
              break
            fi
          done
          if [ -z "$skopeo_bin" ]; then
            echo "::error::skopeo-nix2container-env.nix produced no output carrying bin/skopeo" >&2
            exit 1
          fi
          echo "$skopeo_bin" >> "$GITHUB_PATH"

      - name: Pin the registry auth file
        # LOAD-BEARING. `skopeo login` and the resolver's `skopeo copy` run as
        # SEPARATE processes and must resolve the SAME creds file. The default
        # location ($XDG_RUNTIME_DIR/containers/auth.json) is
        # environment-dependent on GitHub-hosted runners — a mismatch greens the
        # login step and then 401s the copy. Export an explicit path both honor.
        run: echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/ghcr-auth.json" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the actor through env rather than interpolating ${{ }} into the
          # shell — behavior-identical here (GitHub usernames carry no shell
          # metacharacters), but keeps context values off the run: command line.
          ACTOR: ${{ github.actor }}
        # This job WRITES the registry (`skopeo copy` push to :vX.Y.Z), so it
        # needs auth (packages:write authorizes it). The token is passed via env
        # and `--password-stdin` only — never on a command line or in a log.
        run: |
          skopeo \
            login ghcr.io -u "$ACTOR" --password-stdin \
            --authfile "$REGISTRY_AUTH_FILE" <<< "$GITHUB_TOKEN"

      - name: Digest-re-tag the newest ancestor image to the semver tag
        # The load-bearing §A4 resolver: registry-anchored, NOT path-based. A
        # `git log -- <paths>` resolver was rejected (§A4:159-164) because the
        # per-push lane keys its tag on the PUSH HEAD sha, not the last
        # closure-touching commit, so a path resolver could assert a tag that was
        # never published. Walk first-parent ancestors of the release sha
        # newest-first and take the FIRST whose :git-<sha12> resolves on GHCR:
        # that tag's tree provably contains every closure change at-or-before it,
        # so its image is byte-identical to the release sha's content. Copy that
        # digest manifest to :vX.Y.Z (a registry-side write, no build), then
        # verify coherence. Never touches :latest; never builds.
        env:
          TAG_NAME: ${{ needs.release-pr.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-pr.outputs.sha }}
        run: |
          set -euo pipefail
          ref="docker://ghcr.io/rigelbuild/compass-agent"
          tag="$TAG_NAME"
          release_sha="$RELEASE_SHA"

          # Bound the walk so a systemic publish outage fails fast with the
          # remediation pointer rather than probing unboundedly. 50 first-parent
          # ancestors comfortably spans any realistic gap between a release sha
          # and the last closure-affecting publish.
          max_walk=50

          resolved_sha12=""
          count=0
          while IFS= read -r ancestor; do
            [ -n "$ancestor" ] || continue
            count=$((count + 1))
            if [ "$count" -gt "$max_walk" ]; then
              break
            fi
            sha12="$(git rev-parse --short=12 "$ancestor")"
            # Distinguish a definitive not-found (walk on to the next ancestor)
            # from a transient/ambiguous error (GHCR 5xx, throttle, auth blip).
            # Swallowing the latter as "absent" would silently fall through to
            # an OLDER published ancestor and re-tag a STALE image under
            # :vX.Y.Z, breaking the §A4 newest-first byte-identity invariant
            # (the final config-digest verify cannot catch that — it proves the
            # copy landed, not that the right source was chosen). Hard-fail on
            # ambiguity rather than retry (no-retries repo law).
            if probe="$(skopeo inspect --authfile "$REGISTRY_AUTH_FILE" \
              "$ref:git-$sha12" 2>&1)"; then
              resolved_sha12="$sha12"
              echo "resolved source image at ancestor $sha12 (walk position $count)"
              break
            fi
            # A definitive absent manifest surfaces as "manifest unknown" or an
            # HTTP "404"; the broad "not found" glob is a deliberate belt — safe
            # here because this job runs after a successful login against a
            # PUBLIC image, so a 401/403 auth message is not in play, and
            # skopeo's transport failures phrase differently ("no such host",
            # "503", "i/o timeout") and fall to the hard-fail arm. Erring toward
            # continue-the-walk on this set (vs a stale re-tag) is the safe bias.
            case "$probe" in
              *"manifest unknown"* | *"not found"* | *"404"*) ;;
              *)
                echo "::error::ambiguous skopeo error probing :git-$sha12 (not a definitive 404); refusing to fall through to an older ancestor: $probe" >&2
                exit 1
                ;;
            esac
          done < <(git rev-list --first-parent "$release_sha")

          if [ -z "$resolved_sha12" ]; then
            echo "::error::no ancestor image :git-<sha12> resolved on GHCR within $max_walk first-parent ancestors of $release_sha. Remediation: workflow_dispatch the release workflow (publish-image) on the release sha to publish the per-push image, then re-run this release. NEVER rebuild here." >&2
            exit 1
          fi

          # Registry-side manifest write: copy the resolved source tag's
          # digest-resolved manifest to :vX.Y.Z. No nix build at all.
          skopeo copy --authfile "$REGISTRY_AUTH_FILE" \
            "$ref:git-$resolved_sha12" "$ref:$tag"

          # Verify :vX.Y.Z resolves AND shares the source tag's config digest —
          # the same coherence shape as publish-image's two-copy check
          # (release.yml:311-318). Hard-fail on mismatch.
          src_digest="$(skopeo inspect --raw --authfile "$REGISTRY_AUTH_FILE" "$ref:git-$resolved_sha12" | jq -r .config.digest)"
          tag_digest="$(skopeo inspect --raw --authfile "$REGISTRY_AUTH_FILE" "$ref:$tag" | jq -r .config.digest)"
          if [ "$src_digest" != "$tag_digest" ]; then
            echo "re-tag incoherent: :git-$resolved_sha12=$src_digest != :$tag=$tag_digest" >&2
            exit 1
          fi
          echo "verified: $ref:$tag re-tagged from :git-$resolved_sha12, config digests coherent"
