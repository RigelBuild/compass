            login ghcr.io -u "$ACTOR" --password-stdin \
            --authfile "$REGISTRY_AUTH_FILE" <<< "$GITHUB_TOKEN"

      - name: Build and publish the per-arch tag
        if: steps.gate.outputs.should_publish == 'true'
        # The script publishes only the immutable per-arch tag and keeps its
        # single-image digest guard unchanged.
        run: ./publish.sh --arch-suffix arm64

  publish-image-manifest:
    name: publish-image-manifest
    runs-on: ubuntu-latest
    needs: [publish-image-amd64, publish-image-arm64]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.publish-image-amd64.outputs.should_publish == 'true' &&
      needs.publish-image-arm64.outputs.should_publish == 'true'
    permissions:
      contents: read
      packages: write
    # The only writer of :git-<sha12> and :latest, so it alone serializes, with
    # release-image. `queue: max` keeps up to 100 pending runs so a per-push
    # burst never evicts a pending release mint (§A4 no-drop invariant).
    concurrency:
      group: publish-agent-image
      cancel-in-progress: false
      queue: max
    steps:
      # Full history: the :latest guard walks main's first-parent commits newer
      # than this run's sha.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # Caches are named here rather than via accept-flake-config, which
          # would trust any evaluated flake's own substituters and keys.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the pinned bun toolchain on PATH
        # The publisher has no runtime dependencies; resolve the same pinned bun
        # derivation used by the other image jobs without running bun install.
        working-directory: .
        run: |
          set -euo pipefail
          store=$(nix eval --json -f tools/toolchain/gate-tools.nix langs.bun | jq -r '.store')
          if [ -z "$store" ] || [ "$store" = null ]; then
            echo "::error::gate-tools.nix langs.bun produced no store path" >&2
            exit 1
          fi
          nix build --no-link "$store"
          echo "$store/bin" >>"$GITHUB_PATH"

      - name: Pin the registry auth file
        run: echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/ghcr-auth.json" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          skopeo login ghcr.io -u "$ACTOR" --password-stdin \
            --authfile "$REGISTRY_AUTH_FILE" <<< "$GITHUB_TOKEN"

      - name: Compose, guard, push, and verify the image index
        env:
          GH_SHA: ${{ github.sha }}
        run: bun tools/agent-image-index/index.ts

  release-assets-macos:
    name: release-assets-macos
    runs-on: macos-14
    # Build the macOS .app/.dmg app bundle at the release sha on a macos-14
    # (arm64) runner and hand it to release-assets as a workflow artifact
    # (compass-distribution T3 / RIG-2754). It runs on macos-14 because the shell
    # links the SYSTEM WebKit framework and the bundle edge (codesign/hdiutil) is
    # mac-only (Global Constraint 5) — the dmg CANNOT be produced on the ubuntu
    # release-assets runner. The SINGLE SHA256SUMS stays owned by release-assets
    # (design §18): this job PRODUCES the dmg, release-assets FOLDS it in. Same
    # release-gating `if:` + main-ref guard + release-pr dependency as
    # release-assets.
    needs: release-pr
    if: github.ref == 'refs/heads/main' && needs.release-pr.outputs.releases_created == 'true'
    # Least privilege: read the tree, produce an artifact. NOT contents:write —
    # this job never touches the Release; release-assets attaches the folded set.
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      # Check out the release sha — the Release PR's merge commit release-please
      # tagged (same ref release-assets builds from).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-pr.outputs.sha }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # nix-command + flakes; the toolchain (Go + bun) is built from nix
          # (Global Constraint 3), never `setup-go`. The two caches are declared
          # HERE, not delegated via `accept-flake-config` — that setting makes nix
          # trust the `nixConfig` of ANY flake it evaluates, so a PR could add its
          # own substituter AND trusted key. Naming the caches keeps that trust
          # reviewed.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the language toolchains on PATH
        # The pinned toolchain comes from nix, never `setup-go` (Global Constraint
        # 3): gate-tools.nix's `langs` output resolves the identical derivations
        # the dev shell does — go from the go-overlay applied to the
        # devenv.lock-pinned nixpkgs — so this build runs the pinned go
        # byte-for-byte. Copied verbatim from release-assets (phase one).
        run: |
          stores=$(nix eval --json -f tools/toolchain/gate-tools.nix langs \
            | jq -r '.[].store')
          # Fail closed locally rather than leaning on the absence of a
          # root-level flake.nix: with no installables `nix build` would build a
          # default package if one existed, so an empty `langs` must error here.
          [ -n "$stores" ] || {
            echo "::error::gate-tools.nix langs produced no store paths"
            exit 1
          }
          nix build --no-link $stores
          for store in $stores; do
            echo "$store/bin" >>"$GITHUB_PATH"
          done

      - name: Build and stage the macOS app bundle
        # The release version is the semver release-please cut, sourced from
        # version.txt (Global Constraint 1: ONE version string across all
        # binaries — the darwin shell and the four sidecars carry the SAME clean
        # semver ldflags stamp as the released daemons). The shell compiles with
        # cgo against the system WebKit framework (no build tag — T2 restructured
        # the tags so a bare `go build ./cmd/compass-app` compiles on darwin);
        # the four embedded sidecars are pure Go (CGO_ENABLED=0). The
        # macos-bundle tool then stages + ad-hoc signs the .app — shell, sidecars
        # beside it in Contents/MacOS, UI dist in Contents/Resources — and wraps
        # the .dmg under the release asset grammar. No compass-postgres:
        # embedded's postgres is a stock postgres:18 container (DL-260/DL-321).
        env:
          TAG_NAME: ${{ needs.release-pr.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="$(cat version.txt)"
          tag="$TAG_NAME"
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "TAG=$tag" >>"$GITHUB_ENV"

          CGO_ENABLED=1 go -C go build -trimpath \
            -ldflags "-X main.version=$version" \
            -o /tmp/compass-app ./cmd/compass-app

          for b in compass-stack compass-server compass-runner compass-clear-token; do
            CGO_ENABLED=0 go -C go build -trimpath \
              -ldflags "-X main.version=$version" \
              -o "/tmp/$b" "./cmd/$b"
          done
          cp "$(nix build --no-link --print-out-paths \
            -f tools/toolchain/secretspec-env.nix secretspecRelease)/bin/secretspec" /tmp/secretspec

          moon run compass-ui:build

          bun run tools/macos-bundle/index.ts \
            --binary /tmp/compass-app \
            --dist apps/ui/dist \
            --version "$version" \
            --sidecar /tmp/compass-stack \
            --sidecar /tmp/compass-server \
            --sidecar /tmp/compass-runner \
            --sidecar /tmp/compass-clear-token \
            --sidecar /tmp/secretspec \
            --out "compass-app_${tag}_darwin-arm64.dmg"

      - name: Upload the macOS dmg for release-assets to fold in
        # release-assets (ubuntu) downloads this artifact and folds the dmg into
        # the single SHA256SUMS + the release-notes --asset list + the upload
        # array. upload-artifact and download-artifact are independent actions
        # with independent version numbers; this upload (v7) and the consumer's
        # download (v8) interoperate on the shared v4+ artifact backend.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compass-app-darwin-arm64-dmg
          path: compass-app_${{ env.TAG }}_darwin-arm64.dmg
          if-no-files-found: error

  release-assets:
    name: release-assets
    runs-on: ubuntu-latest
    # Build the four released binaries at the release sha and attach them — plus
    # SHA256SUMS and the nix-outputs manifest — to the GitHub Release
    # release-please already created for this tag. Runs ONLY when the merged
    # Release PR actually cut a release. The main-ref guard is kept on EVERY
    # release job (§A5(2)): a workflow_dispatch from a feature branch must never
    # mint release artifacts for unmerged code, even were release-please to emit
    # releases_created there.
    # release-image is a needs edge so its resolved image_digest output reaches
    # the generator below. Both jobs share the same `if:` (main ref + a real
    # release cut), so this edge never skips release-assets on a release run. It
    # DOES serialize release-assets behind release-image, which itself queues in
    # the publish-agent-image concurrency group behind an in-flight
    # publish-image-manifest — accepted added latency for a single authoritative digest.
    needs: [release-pr, release-assets-macos, release-image]
    if: github.ref == 'refs/heads/main' && needs.release-pr.outputs.releases_created == 'true'
    # Least privilege: write the Release, nothing else. NOT packages:write — the
    # release-notes generator reads the PUBLIC image digest anonymously, and this
    # lane never writes a registry (Global Constraint 7).
    permissions:
      contents: write
    # The nix toolchain resolve is the cost that sizes this timeout — the same
    # ceiling ci.yml and both agent-image arch builds use.
    timeout-minutes: 90
    steps:
      # Check out the release sha — the Release PR's merge commit release-please
      # tagged. Default depth: the assets build from that tree, and the
      # release-notes digest pointer resolves from `git rev-parse HEAD`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-pr.outputs.sha }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # nix-command + flakes for the RigelBuild forks' flakes. The two caches
          # are declared HERE, not delegated via `accept-flake-config` — that
          # setting makes nix trust the `nixConfig` of ANY flake it evaluates
          # (the RigelBuild/devenv flake carries such a block), so a PR could add its
          # own substituter AND trusted key and have CI run attacker-signed
          # binaries. Naming the caches in this reviewed file keeps that trust
          # reviewed.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the language toolchains on PATH
        # The pinned toolchain comes from nix, never `setup-go` (Global
        # Constraint 8): gate-tools.nix's `langs` output resolves the identical
        # derivations the dev shell does — go from the go-overlay applied to the
        # devenv.lock-pinned nixpkgs — so this build runs the pinned go
        # byte-for-byte. Copied verbatim from ci.yml:207-220 (phase one).
        run: |
          stores=$(nix eval --json -f tools/toolchain/gate-tools.nix langs \
            | jq -r '.[].store')
          # Fail closed locally rather than leaning on the absence of a
          # root-level flake.nix: with no installables `nix build` would build a
          # default package if one existed, so an empty `langs` must error here.
          [ -n "$stores" ] || {
            echo "::error::gate-tools.nix langs produced no store paths"
            exit 1
          }
          nix build --no-link $stores
          for store in $stores; do
            echo "$store/bin" >>"$GITHUB_PATH"
          done

      - name: Put the fork's patched skopeo on PATH
        # The release-notes generator queries GHCR for the image index digest
        # with a plain `skopeo` (the RigelBuild/nix2container fork's patched
        # build). The langs bootstrap above carries only go/bun/node/moon, so
        # skopeo must be provisioned here or the digest query — a core T2
        # deliverable (Fork 2(ii)) — silently records the image absent on every
        # release. Resolve it from the shared pinned helper
        # tools/toolchain/skopeo-nix2container-env.nix and prepend its bin/, the
        # same out-of-band `nix build` pattern publish-agent-image.yml:117-148
        # uses. The image is public (Matt-ruled), so reading the digest needs no
        # `skopeo login` / packages:read — this lane stays contents:write-only.
        working-directory: .
        run: |
          set -euo pipefail
          # `--print-out-paths` prints every output (skopeo ships a `-man` output
          # too); take the one carrying bin/skopeo, not a fixed line.
          skopeo_bin=""
          for store in $(nix build --no-link --print-out-paths \
            -f tools/toolchain/skopeo-nix2container-env.nix skopeo); do
            if [ -x "$store/bin/skopeo" ]; then
              skopeo_bin="$store/bin"
              break
            fi
          done
          if [ -z "$skopeo_bin" ]; then
            echo "::error::skopeo-nix2container-env.nix produced no output carrying bin/skopeo" >&2
            exit 1
          fi
          echo "$skopeo_bin" >> "$GITHUB_PATH"

      - name: Build the release binaries
        # The release version is the semver release-please cut, sourced from
        # version.txt (Global Constraint 1: ONE version string across all
        # binaries AND the image tag). Asset names carry the semver tag. #711's
        # build step, re-based from the `build-<sha12>` prerelease shape to the
        # semver `vX.Y.Z` tag. -trimpath + CGO_ENABLED=0: the three daemons/CLI
        # are pure Go (cgo is needed only by the pgtest suites, not any build
        # here), and the darwin-arm64 CLI cross-compiles cleanly from this ubuntu
        # runner.
        env:
          TAG_NAME: ${{ needs.release-pr.outputs.tag_name }}
        run: |
          set -euo pipefail
          sha12="$(git rev-parse --short=12 HEAD)"
          version="$(cat version.txt)"
          tag="$TAG_NAME"
          echo "SHA12=$sha12" >>"$GITHUB_ENV"
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "TAG=$tag" >>"$GITHUB_ENV"

          ldflags="-X main.version=$version"

          # Three linux-amd64 binaries (the deployable daemons + the CLI).
          for name in compass compass-server compass-runner; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go -C go build -trimpath -ldflags "$ldflags" \
              -o "../${name}_${tag}_linux-amd64" "./cmd/${name}"
          done

          # The CLI cross-built for darwin-arm64 (Matt's dev machines run the CLI
          # against remote stacks; the daemons deploy on Linux only — Fork 2(i)).
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go -C go build -trimpath -ldflags "$ldflags" \
            -o "../compass_${tag}_darwin-arm64" ./cmd/compass

      - name: Build and stage the Linux app bundle
        # The app tarball (gtk4 shell + the four embedded sidecars + UI dist + desktop
        # + LICENSE) joins the semver Release asset set (RIG-2752 / compass-distribution T1).
        # COMPASS_BUNDLE_VERSION pins the clean semver so the app binary carries
        # the same one version as the daemons (Global Constraint 1); moon's
        # compass-app-bundle:build deps-edge builds the UI dist first. Rename the
        # produced tarball to the Release asset grammar and stage it at repo root
        # beside the binaries the SHA256SUMS / upload steps consume.
        env:
          COMPASS_BUNDLE_VERSION: ${{ env.VERSION }}
        run: |
          set -euo pipefail
          moon run compass-app-bundle:build
          mv "app-bundle/compass-app-${COMPASS_BUNDLE_VERSION}-linux-amd64.tar.gz" \
             "compass-app_${TAG}_linux-amd64.tar.gz"

      - name: Download the macOS dmg from the release-assets-macos producer
        # The dmg is built on macos-14 (release-assets-macos) because the shell
        # links the SYSTEM WebKit framework and codesign/hdiutil are mac-only
        # (Global Constraint 5). Fetch it to repo root BEFORE the SHA256SUMS step
        # so it folds into the single checksum file + the notes + the upload set
        # alongside the linux assets (design §18). This download (v8) and the
        # producer's upload (v7) interoperate on the shared v4+ artifact backend
        # (the two actions version independently).
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compass-app-darwin-arm64-dmg
          path: .

      - name: Generate SHA256SUMS over the built assets
        run: |
          set -euo pipefail
          sha256sum \
            "compass_${TAG}_linux-amd64" \
            "compass-server_${TAG}_linux-amd64" \
            "compass-runner_${TAG}_linux-amd64" \
            "compass_${TAG}_darwin-arm64" \
            "compass-app_${TAG}_darwin-arm64.dmg" \
            "compass-app_${TAG}_linux-amd64.tar.gz" \
            > SHA256SUMS

      - name: Generate the release body + nix-outputs manifest
        # The T2 generator (a bun/TS tool with a pure, unit-tested core). It
        # queries GHCR for the image digest at :git-<sha12> (DEGRADING to a
        # recorded-absence line when the image lane has not published this sha)
        # and runs `nix path-info` over the toolchain `langs` set, writing the
        # two files the release upload consumes.
        # IMAGE_DIGEST is the digest release-image already resolved and verified.
        # It is authoritative: the generator builds the image identity from it and
        # skips its own GHCR probe, which would query `:git-<release-sha>` — a tag
        # the paths-filtered image lane never published for a release commit that
        # did not touch the image closure. Routed through env (not inlined ${{ }})
        # to keep the context value off the run: command line.
        env:
          IMAGE_DIGEST: ${{ needs.release-image.outputs.image_digest }}
        run: |
          set -euo pipefail
          bun run tools/release-notes/index.ts \
            --sha "$SHA12" \
            --version "$VERSION" \
            --tag "$TAG" \
            --image-digest "$IMAGE_DIGEST" \
            --asset "compass_${TAG}_linux-amd64" \
            --asset "compass-server_${TAG}_linux-amd64" \
            --asset "compass-runner_${TAG}_linux-amd64" \
            --asset "compass_${TAG}_darwin-arm64" \
            --asset "compass-app_${TAG}_linux-amd64.tar.gz" \
            --asset "compass-app_${TAG}_darwin-arm64.dmg" \
            --asset "SHA256SUMS" \
            --body-out RELEASE_BODY.md \
            --manifest-out nix-outputs.json

      - name: Upload assets and append the appendix to the Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The Release already EXISTS as an unpublished DRAFT: release-please cut
        # it (tag + generated changelog notes) on the merge commit but left it
        # unpublished. This lane never creates it — it attaches the built assets
        # with --clobber (idempotent on re-run), APPENDS the generator's
        # binaries/image/nix-outputs appendix BELOW release-please's generated
        # notes, preserving the changelog rather than overwriting it, and only
        # then publishes. Not `--prerelease`: this is a real release.
        #
        # RECOVERY, if any step here fails: the Release stays an unpublished
        # DRAFT, which is the safe direction — a draft's assets are not locked
        # and its tag is still reusable. Re-run FAILED jobs: that preserves
        # release-pr's releases_created=true, so this job runs again and
        # publishes. "Re-run all jobs" instead SILENTLY skips this job: the
        # first successful create already relabelled the merged Release PR
        # `autorelease: pending` -> `autorelease: tagged`, and release-please
        # only considers PRs still labelled pending, so a fresh release-pr
        # reports releases_created=false and the gate below is never met.
        # Deleting the draft to start over therefore also needs the tag deleted
        # and that label put back.
        run: |
          set -euo pipefail
          assets=(
            "compass_${TAG}_linux-amd64"
            "compass-server_${TAG}_linux-amd64"
            "compass-runner_${TAG}_linux-amd64"
            "compass_${TAG}_darwin-arm64"
            "compass-app_${TAG}_linux-amd64.tar.gz"
            "compass-app_${TAG}_darwin-arm64.dmg"
            SHA256SUMS
            # nix-outputs.json (below) is the generator's machine-readable
            # manifest — regenerable output attached for consumers, deliberately
            # not in SHA256SUMS, which checksums the downloadable binaries.
            nix-outputs.json
          )
          gh release upload "$TAG" --clobber "${assets[@]}"

          # Append the generator appendix below release-please's changelog,
          # preserving the changelog rather than replacing it. Idempotent on
          # re-run: strip any prior appendix (the sentinel comment onward, which
          # includes the separator that follows it) and any CR from GitHub's
          # CRLF-normalized body, then capture via `$(...)` so all trailing
          # newlines collapse, and reconstruct with a fixed separator. Repeated
          # "Re-run failed jobs" runs produce byte-identical notes — not a stack of
          # duplicate appendices, nor a single appendix atop a growing blank-line
          # gap (the CR strip is what makes the fixpoint hold against the live
          # API, which returns the body CRLF-terminated). The release-image
          # remediation invites a re-run, so this path is real.
          notes="$RUNNER_TEMP/release-notes.md"
          changelog="$(gh release view "$TAG" --json body -q .body \
            | sed '/<!-- release-notes-appendix -->/,$d' \
            | sed 's/\r$//')"
          {
            printf '%s\n\n<!-- release-notes-appendix -->\n\n---\n\n' "$changelog"
            cat RELEASE_BODY.md
          } > "$notes"
          # Publishing the draft is the LAST release-mutating action, folded
          # into the same edit that writes the notes. It must stay after the
          # upload above: publication locks the assets and the tag for good.
          gh release edit "$TAG" --draft=false --notes-file "$notes"

  release-image:
    name: release-image
    runs-on: ubuntu-latest
    # Digest-re-tag the already-published per-push `:git-<sha12>` image to the
    # semver `:vX.Y.Z`. NEVER a second build (the release sha's image content is
    # byte-identical to the last closure-affecting sha's — §A4), NEVER touches
    # `:latest` (owned exclusively by publish-image-manifest). Runs ONLY when the merged
    # Release PR actually cut a release.
    needs: release-pr
    # Least privilege: read the tree, write the GHCR package, nothing else
    # (Global Constraint 7).
    permissions:
      contents: read
      packages: write
    # The SAME group as publish-image-manifest: a non-superseding `:vX.Y.Z` release mint
    # must serialize behind an in-flight `:latest` move WITHOUT being cancelled
    # by a later per-push entrant claiming the single default pending slot.
    # `queue: max` (the bare literal token — no numeric form; up to 100 pending)
    # rather than the default single pending slot preserves the §A4 no-drop
    # invariant; bare `cancel-in-progress: false` alone would drop it.
    # Within a single release run this also queues behind its own
    # publish-image-manifest job (same group), with no needs edge.
    concurrency:
      group: publish-agent-image
      cancel-in-progress: false
      queue: max
    # workflow_dispatch runs on any branch; guard so a dispatch from a feature
    # branch can never mint a `:vX.Y.Z` for unmerged code. Main pushes satisfy
    # this trivially (§A5(2), mirrors publish-image-manifest).
    if: github.ref == 'refs/heads/main' && needs.release-pr.outputs.releases_created == 'true'
    timeout-minutes: 90
    outputs:
      image_digest: ${{ steps.retag.outputs.image_digest }}
      resolved_sha12: ${{ steps.retag.outputs.resolved_sha12 }}
    steps:
      # Full history: the resolver walks first-parent ancestors of the release
      # sha (§A4/Plan T3), so a shallow checkout would truncate the walk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-pr.outputs.sha }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # nix-command + flakes for the RigelBuild forks' flakes. The two caches
          # are declared HERE, not delegated via `accept-flake-config` — that
          # setting makes nix trust the `nixConfig` of ANY flake it evaluates
          # (the RigelBuild/devenv flake carries such a block), so a PR could add its
          # own substituter AND trusted key and have CI run attacker-signed
          # binaries. Naming the caches in this reviewed file keeps that trust
          # reviewed.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the fork's patched skopeo on PATH
        # The resolver probes and copies with a plain `skopeo` (the
        # RigelBuild/nix2container fork's patched build). Resolve it from the
        # shared pinned helper, tools/toolchain/skopeo-nix2container-env.nix, and
        # prepend its bin/ to PATH — the same out-of-band `nix build` pattern
        # publish-agent-image.yml:117-148 uses.
        working-directory: .
        run: |
          set -euo pipefail
          # `--print-out-paths` prints every output (skopeo ships a `-man` output
          # too); take the one carrying bin/skopeo, not a fixed line.
          skopeo_bin=""
          for store in $(nix build --no-link --print-out-paths \
            -f tools/toolchain/skopeo-nix2container-env.nix skopeo); do
            if [ -x "$store/bin/skopeo" ]; then
              skopeo_bin="$store/bin"
              break
            fi
          done
          if [ -z "$skopeo_bin" ]; then
            echo "::error::skopeo-nix2container-env.nix produced no output carrying bin/skopeo" >&2
            exit 1
          fi
          echo "$skopeo_bin" >> "$GITHUB_PATH"

      - name: Pin the registry auth file
        # LOAD-BEARING. `skopeo login` and the resolver's `skopeo copy` run as
        # SEPARATE processes and must resolve the SAME creds file. The default
        # location ($XDG_RUNTIME_DIR/containers/auth.json) is
        # environment-dependent on GitHub-hosted runners — a mismatch greens the
        # login step and then 401s the copy. Export an explicit path both honor.
        run: echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/ghcr-auth.json" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the actor through env rather than interpolating ${{ }} into the
          # shell — behavior-identical here (GitHub usernames carry no shell
          # metacharacters), but keeps context values off the run: command line.
          ACTOR: ${{ github.actor }}
        # This job WRITES the registry (`skopeo copy` push to :vX.Y.Z), so it
        # needs auth (packages:write authorizes it). The token is passed via env
        # and `--password-stdin` only — never on a command line or in a log.
        run: |
          skopeo \
            login ghcr.io -u "$ACTOR" --password-stdin \
            --authfile "$REGISTRY_AUTH_FILE" <<< "$GITHUB_TOKEN"

      - name: Digest-re-tag the newest ancestor image to the semver tag
        id: retag
        # The load-bearing §A4 resolver: registry-anchored, NOT path-based. A
        # `git log -- <paths>` resolver was rejected (§A4:159-164) because the
        # per-push lane keys its tag on the PUSH HEAD sha, not the last
        # closure-touching commit, so a path resolver could assert a tag that was
        # never published. Walk first-parent ancestors of the release sha
        # newest-first and take the FIRST whose :git-<sha12> resolves on GHCR:
        # that tag's tree provably contains every closure change at-or-before it,
        # so its image is byte-identical to the release sha's content. Copy that
        # digest manifest to :vX.Y.Z (a registry-side write, no build), then
        # verify coherence. Never touches :latest; never builds.
        env:
          TAG_NAME: ${{ needs.release-pr.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-pr.outputs.sha }}
        run: |
          set -euo pipefail
          ref="docker://ghcr.io/rigelbuild/compass-agent"
          tag="$TAG_NAME"
          release_sha="$RELEASE_SHA"

          # Bound the walk so a systemic publish outage fails fast with the
          # remediation pointer rather than probing unboundedly. 50 first-parent
          # ancestors comfortably spans any realistic gap between a release sha
          # and the last closure-affecting publish.
          max_walk=50

          resolved_sha12=""
          count=0
          while IFS= read -r ancestor; do
            [ -n "$ancestor" ] || continue
            count=$((count + 1))
            if [ "$count" -gt "$max_walk" ]; then
              break
            fi
            sha12="$(git rev-parse --short=12 "$ancestor")"
            # Distinguish a definitive not-found (walk on to the next ancestor)
            # from a transient/ambiguous error (GHCR 5xx, throttle, auth blip).
            # Swallowing the latter as "absent" would silently fall through to
            # an OLDER published ancestor and re-tag a STALE image under
            # :vX.Y.Z, breaking the §A4 newest-first byte-identity invariant
            # (the final config-digest verify cannot catch that — it proves the
            # copy landed, not that the right source was chosen). Hard-fail on
            # ambiguity rather than retry (no-retries repo law).
            if probe="$(skopeo inspect --authfile "$REGISTRY_AUTH_FILE" \
              "$ref:git-$sha12" 2>&1)"; then
              resolved_sha12="$sha12"
              echo "resolved source image at ancestor $sha12 (walk position $count)"
              break
            fi
            # A definitive absent manifest surfaces as "manifest unknown" or an
            # HTTP "404"; the broad "not found" glob is a deliberate belt — safe
            # here because this job runs after a successful login against a
            # PUBLIC image, so a 401/403 auth message is not in play, and
            # skopeo's transport failures phrase differently ("no such host",
            # "503", "i/o timeout") and fall to the hard-fail arm. Erring toward
            # continue-the-walk on this set (vs a stale re-tag) is the safe bias.
            case "$probe" in
              *"manifest unknown"* | *"not found"* | *"404"*) ;;
              *)
                echo "::error::ambiguous skopeo error probing :git-$sha12 (not a definitive 404); refusing to fall through to an older ancestor: $probe" >&2
                exit 1
                ;;
            esac
          done < <(git rev-list --first-parent "$release_sha")

          if [ -z "$resolved_sha12" ]; then
            echo "::error::no ancestor image :git-<sha12> resolved on GHCR within $max_walk first-parent ancestors of $release_sha. Remediation: workflow_dispatch the release workflow on the release sha to publish its image, then re-run this release. NEVER rebuild here." >&2
            exit 1
          fi

          # Registry-side write: copy the resolved index and every member to
          # :vX.Y.Z byte-for-byte, so the release tag names the same list digest.
          skopeo copy --multi-arch all --preserve-digests --authfile "$REGISTRY_AUTH_FILE" \
            "$ref:git-$resolved_sha12" "$ref:$tag"

          # Verify :vX.Y.Z is the same index: equal list digests over the raw bytes.
          src_digest="sha256:$(skopeo inspect --raw --authfile "$REGISTRY_AUTH_FILE" "$ref:git-$resolved_sha12" | sha256sum | cut -d' ' -f1)"
          tag_digest="sha256:$(skopeo inspect --raw --authfile "$REGISTRY_AUTH_FILE" "$ref:$tag" | sha256sum | cut -d' ' -f1)"
          if [ "$src_digest" != "$tag_digest" ]; then
            echo "re-tag incoherent: :git-$resolved_sha12=$src_digest != :$tag=$tag_digest" >&2
            exit 1
          fi
          echo "verified: $ref:$tag re-tagged from :git-$resolved_sha12, list digests coherent"

          # Publish the resolved identity for release-assets (see the job-level
          # outputs: block). Reuse the digest the coherence check above already
          # verified — never a second probe. release-assets treats image_digest
          # as authoritative and skips its own GHCR query.
          echo "image_digest=$src_digest" >> "$GITHUB_OUTPUT"
          echo "resolved_sha12=$resolved_sha12" >> "$GITHUB_OUTPUT"

  publish-runner-image:
    name: publish-runner-image
    runs-on: ubuntu-latest
    # Least privilege: read the tree, write the GHCR package, nothing else.
    permissions:
      contents: read
      packages: write
    # A SEPARATE group from the agent image: this publishes a different package,
    # so serializing the two against each other would only add latency. Within
    # this package, publishes must still serialize — two runs pushing the same
    # tag concurrently make which bytes the tag names a race.
    concurrency:
      group: publish-runner-image
      cancel-in-progress: false
      queue: max
    # A dispatch from a feature branch must never publish an image for unmerged
    # code. Main pushes satisfy this trivially.
    if: github.ref == 'refs/heads/main'
    # The guest rootfs is a ~2 GiB erofs built from source; that nix build sizes
    # this timeout, matching the agent image's.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide whether this push touches the runner-image closure
        id: gate
        # This gate uses the runner closure set because the trigger has no paths filter.
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # workflow_dispatch has no push range to diff. Force-publish so the
          # dispatch remediation path (publish then re-run) always publishes.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: force-publish (no push range to diff)"
            exit 0
          fi

          # First push to the branch has an all-zero before-sha and no diff base.
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "no diff base (first push to branch): force-publish"
            exit 0
          fi

          # A two-dot tree diff needs only the two endpoint commits; checkout has
          # HEAD at depth 1, so fetch the before endpoint the same way.
          git fetch --no-tags --depth=1 origin "$BEFORE_SHA" >/dev/null 2>&1 || true

          # An unreachable before-sha (force-push, GC'd object, fetch transient)
          # leaves no diff base. Publish rather than fail — the no-drop invariant.
          # --no-renames: a rename prints only its destination, which would hide
          # a file moved OUT of the closure. -z output keeps NULs, which command
          # substitution drops, so the names go to a file.
          changed="$RUNNER_TEMP/runner-image-changed"
          if ! git diff -z --no-renames --name-only "$BEFORE_SHA" "$HEAD_SHA" >"$changed" 2>/dev/null; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "before-sha unreachable: force-publish (no-drop errs toward publishing)"
            exit 0
          fi

          should_publish=false
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            case "$pattern" in
              *'/**')
                prefix="${pattern%'/**'}/"
                while IFS= read -r -d '' f; do
                  [ -n "$f" ] || continue
                  case "$f" in
                    "$prefix"*) should_publish=true ;;
                  esac
                done <"$changed"
                ;;
              *)
                while IFS= read -r -d '' f; do
                  [ "$f" = "$pattern" ] && should_publish=true
                done <"$changed"
                ;;
            esac
            [ "$should_publish" = true ] && break
          done <<< "$RUNNER_IMAGE_CLOSURE_PATHS"

          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "changed-path gate over the runner-image closure set: should_publish=$should_publish"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        if: steps.gate.outputs.should_publish == 'true'
        with:
          # The two caches are declared HERE rather than delegated via
          # `accept-flake-config`, which would make nix trust the nixConfig of
          # any flake it evaluates — a PR could then add its own substituter and
          # trusted key and have CI run attacker-signed binaries.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the pinned bun toolchain on PATH
        if: steps.gate.outputs.should_publish == 'true'
        # Resolve bun from gate-tools.nix so it is byte-identical to the dev
        # shell's — the same derivation, not merely the same version. `jq -r`
        # renders a missing `.store` as the literal string `null`, a value
        # rather than an absence, so the guard tests for it explicitly.
        run: |
          set -euo pipefail
          store=$(nix eval --json -f tools/toolchain/gate-tools.nix langs.bun | jq -r '.store')
          if [ -z "$store" ] || [ "$store" = null ]; then
            echo "::error::gate-tools.nix langs.bun produced no store path" >&2
            exit 1
          fi
          nix build --no-link "$store"
          echo "$store/bin" >>"$GITHUB_PATH"

      - name: Put the pinned skopeo on PATH
        if: steps.gate.outputs.should_publish == 'true'
        # publish.ts tags the verified digest with skopeo. The same pinned skopeo
        # release-image uses; take the output carrying bin/skopeo, since the
        # derivation also ships a `-man` output.
        run: |
          set -euo pipefail
          skopeo_bin=""
          for store in $(nix build --no-link --print-out-paths \
            -f tools/toolchain/skopeo-nix2container-env.nix skopeo); do
            if [ -x "$store/bin/skopeo" ]; then
              skopeo_bin="$store/bin"
              break
            fi
          done
          if [ -z "$skopeo_bin" ]; then
            echo "::error::skopeo-nix2container-env.nix produced no output carrying bin/skopeo" >&2
            exit 1
          fi
          echo "$skopeo_bin" >> "$GITHUB_PATH"

      - name: Start a rootless buildkitd
        if: steps.gate.outputs.should_publish == 'true'
        # Rootless BuildKit is the ruled mechanism for a prebuilt-application
        # image: never `docker build`, never a host docker socket (a socket
        # hands a build step the daemon's blast radius). rootlesskit needs
        # newuidmap, which on this ubuntu-latest runner comes from the uidmap
        # package already on the default PATH; buildkitd needs runc on PATH.
        run: |
          set -euo pipefail
          buildkit=$(nix build --no-link --print-out-paths nixpkgs#buildkit)
          rootlesskit=$(nix build --no-link --print-out-paths nixpkgs#rootlesskit)
          runc=$(nix build --no-link --print-out-paths nixpkgs#runc)
          echo "$buildkit/bin" >>"$GITHUB_PATH"
          export PATH="$buildkit/bin:$rootlesskit/bin:$runc/bin:$PATH"
          # ubuntu-24.04 denies unprivileged userns to unprofiled binaries; allow
          # it for this exact store path only, not host-wide via the sysctl.
          profile="/etc/apparmor.d/rootlesskit-nix"
          sudo tee "$profile" >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          $rootlesskit/bin/rootlesskit flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$profile"
          addr="unix://$RUNNER_TEMP/buildkit.sock"
          log="$RUNNER_TEMP/buildkitd.log"
          # Redirect the daemon's output to a file: discarding it turns a startup
          # failure into a bare timeout with no cause to read.
          "$rootlesskit/bin/rootlesskit" "$buildkit/bin/buildkitd" \
            --addr "$addr" >"$log" 2>&1 &
          # `buildctl debug workers` is a real readiness probe, not a socket-file
          # existence check: it round-trips to the daemon and exits 0 only once a
          # worker is up (measured against buildkit 0.31.1). Bounded poll, no
          # unbounded wait and no retry around a non-startup failure.
          ready=false
          for _ in $(seq 1 60); do
            if buildctl --addr "$addr" debug workers >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::buildkitd did not accept connections within 60s" >&2
            cat "$log" >&2 || true
            exit 1
          fi
          echo "BUILDKIT_HOST=$addr" >>"$GITHUB_ENV"

      - name: Log in to GHCR
        if: steps.gate.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        # BuildKit reads registry creds from a docker config file, and
        # publish.ts passes the same file to skopeo as --authfile. Writing it
        # with a 0600 umask in a private dir keeps the token off argv and out of
        # any process listing.
        run: |
          set -euo pipefail
          auth_dir="$RUNNER_TEMP/docker"
          mkdir -p "$auth_dir"
          chmod 700 "$auth_dir"
          umask 077
          # base64(actor:token) is credential-equivalent, but Actions log-masking
          # matches only the RAW token — a transformed form is NOT auto-redacted.
          # Mask the blob before it can reach a log. `base64` reads stdin so the
          # token still never touches argv.
          auth="$(printf '%s:%s' "$ACTOR" "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" \
            > "$auth_dir/config.json"
          echo "DOCKER_CONFIG=$auth_dir" >>"$GITHUB_ENV"

      - name: Build the image locally
        if: steps.gate.outputs.should_publish == 'true'
        # The local OCI layout is what the publish step scans for leaked secrets
        # BEFORE any push, and its digest is what the push is asserted against.
        run: bun tools/runner-image/build.ts --output oci

      - name: Publish by digest and assert reproducibility
        if: steps.gate.outputs.should_publish == 'true'
        # Re-runs the build with the push exporter (buildctl has no `push` verb)
        # to push by digest only, fails unless the registry's digest equals the
        # local one, and only then tags it `:git-<sha12>`. The deployable
        # `repo@sha256:…` lands in the step summary: GHCR has no server-side tag
        # immutability, so nothing deployed resolves via a tag.
        run: |
          set -euo pipefail
          # `--short=12` returns the SHORTEST UNIQUE length that is >= 12, so a
          # collision yields 13+ chars and buildTag's strict ^[0-9a-f]{12}$ then
          # hard-fails the publish. A deterministic 12-char truncation keeps the
          # contract exact.
          sha12="$(git rev-parse HEAD | cut -c1-12)"
          ref="$(bun tools/runner-image/publish.ts \
            --repo ghcr.io/rigelbuild/compass-runner --sha "$sha12")"
          echo "published $ref"
          echo "runner image: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

  release-runner-image:
    name: release-runner-image
    runs-on: ubuntu-latest
    # Digest-re-tag the newest published closure image at or before the release sha
    # to `:vX.Y.Z`. Never builds and never touches `:latest` (publish-runner-image owns it).
    needs: release-pr
    permissions:
      contents: read
      packages: write
    # The runner package's own group: this must queue behind an in-flight
    # per-push publish and never be dropped, so no cancel and a deep queue.
    concurrency:
      group: publish-runner-image
      cancel-in-progress: false
      queue: max
    # A dispatch from a feature branch must never mint a release tag.
    if: github.ref == 'refs/heads/main' && needs.release-pr.outputs.releases_created == 'true'
    # Same as release-image: the pinned skopeo may realise from source on a cache miss.
    timeout-minutes: 90
    steps:
      # Full history: the resolver walks first-parent ancestors of the release sha.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-pr.outputs.sha }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # Caches named here, not via `accept-flake-config`, so a PR cannot add
          # its own substituter and trusted key.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the pinned skopeo on PATH
        # The same pinned skopeo release-image uses; take the output carrying
        # bin/skopeo, since the derivation also ships a `-man` output.
        run: |
          set -euo pipefail
          skopeo_bin=""
          for store in $(nix build --no-link --print-out-paths \
            -f tools/toolchain/skopeo-nix2container-env.nix skopeo); do
            if [ -x "$store/bin/skopeo" ]; then
              skopeo_bin="$store/bin"
              break
            fi
          done
          if [ -z "$skopeo_bin" ]; then
            echo "::error::skopeo-nix2container-env.nix produced no output carrying bin/skopeo" >&2
            exit 1
          fi
          echo "$skopeo_bin" >> "$GITHUB_PATH"

      - name: Put the pinned bun toolchain on PATH
        # Resolve bun from gate-tools.nix so it matches the dev shell's exactly.
        # `jq -r` renders a missing `.store` as the string `null`, so test for it.
        run: |
          set -euo pipefail
          store=$(nix eval --json -f tools/toolchain/gate-tools.nix langs.bun | jq -r '.store')
          if [ -z "$store" ] || [ "$store" = null ]; then
            echo "::error::gate-tools.nix langs.bun produced no store path" >&2
            exit 1
          fi
          nix build --no-link "$store"
          echo "$store/bin" >>"$GITHUB_PATH"

      - name: Pin the registry auth file
        # `skopeo login` and the resolver's skopeo calls are separate processes;
        # an explicit path keeps them on the same creds file.
        run: echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/ghcr-auth.json" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        # The runner package is private, so even the probes need auth. The
        # token goes through env and stdin only, never argv.
        run: |
          skopeo \
            login ghcr.io -u "$ACTOR" --password-stdin \
            --authfile "$REGISTRY_AUTH_FILE" <<< "$GITHUB_TOKEN"

      - name: Digest-re-tag the newest ancestor image to the semver tag
        # Resolves the source ancestor, fails if a skipped ancestor changed the
        # runner closure (RUNNER_IMAGE_CLOSURE_PATHS, workflow env), then copies
        # by digest, verifies the tag, and records it in the step summary.
        env:
          TAG_NAME: ${{ needs.release-pr.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-pr.outputs.sha }}
        run: |
          bun tools/runner-image/retag.ts \
            --repo ghcr.io/rigelbuild/compass-runner \
            --tag "$TAG_NAME" --release-sha "$RELEASE_SHA"

  publish-guest-image:
    name: publish-guest-image
    runs-on: ubuntu-latest
    # Least privilege: read the tree, write the GHCR package, nothing else.
    permissions:
      contents: read
      packages: write
    # Its own group: a different package from the agent and runner images, so
    # serializing against those would only add latency. Within this package,
    # publishes must serialize — two runs pushing one tag race over which bytes
    # it names.
    concurrency:
      group: publish-guest-image
      cancel-in-progress: false
      queue: max
    # A dispatch from a feature branch must never publish assets for unmerged
    # code. Main pushes satisfy this trivially.
    if: github.ref == 'refs/heads/main'
    # The rootfs is a ~2 GiB erofs built from source; that nix build sizes this.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide whether this push touches the guest-image closure
        id: gate
        # The sibling publish jobs' push-event tree diff, over
        # GUEST_IMAGE_CLOSURE_PATHS. Every fallback errs toward publishing, so
        # a missing diff base never silently drops a closure change.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch: force-publish (no push range to diff)"
            exit 0
          fi

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "no diff base (first push to branch): force-publish"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BEFORE_SHA" >/dev/null 2>&1 || true

          if ! changed="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" 2>/dev/null)"; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "before-sha unreachable: force-publish (no-drop errs toward publishing)"
            exit 0
          fi

          should_publish=false
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            case "$pattern" in
              *'/**')
                prefix="${pattern%'/**'}/"
                while IFS= read -r f; do
                  [ -n "$f" ] || continue
                  case "$f" in
                    "$prefix"*) should_publish=true ;;
                  esac
                done <<< "$changed"
                ;;
              *)
                while IFS= read -r f; do
                  [ "$f" = "$pattern" ] && should_publish=true
                done <<< "$changed"
                ;;
            esac
            [ "$should_publish" = true ] && break
          done <<< "$GUEST_IMAGE_CLOSURE_PATHS"

          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "changed-path gate over the guest-image closure set: should_publish=$should_publish"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        if: steps.gate.outputs.should_publish == 'true'
        with:
          # Declared here rather than via `accept-flake-config`, which would
          # make nix trust the nixConfig of any flake it evaluates.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://devenv.cachix.org https://cachix.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM=

      - name: Put the pinned bun and moon on PATH
        if: steps.gate.outputs.should_publish == 'true'
        # Both come from the gate-tools pin, so the lane runs byte-identical
        # binaries here and on a dev box. moon is required, not incidental: the
        # lane realises its assets through the gate's own build task.
        run: |
          set -euo pipefail
          for lang in bun moon; do
            # `jq -r` renders a missing `.store` as the string `null`, a value
            # rather than an absence, so test for it explicitly.
            store=$(nix eval --json -f tools/toolchain/gate-tools.nix "langs.$lang" | jq -r '.store')
            if [ -z "$store" ] || [ "$store" = null ]; then
              echo "::error::gate-tools.nix langs.$lang produced no store path" >&2
              exit 1
            fi
            nix build --no-link "$store"
            echo "$store/bin" >>"$GITHUB_PATH"
          done

      - name: Put the fork's patched skopeo on PATH
        if: steps.gate.outputs.should_publish == 'true'
        # The publish lane probes and copies with a plain `skopeo` (the
        # RigelBuild/nix2container fork's patched build). Resolve it from the
        # shared pinned helper so this privileged job cannot run a mutable
        # upstream build, the same pattern the sibling publish jobs use.
        run: |
          set -euo pipefail
          # `--print-out-paths` prints every output (skopeo ships a `-man` output
          # too); take the one carrying bin/skopeo, not a fixed line.
          skopeo_bin=""
          for store in $(nix build --no-link --print-out-paths \
            -f tools/toolchain/skopeo-nix2container-env.nix skopeo); do
            if [ -x "$store/bin/skopeo" ]; then
              skopeo_bin="$store/bin"
              break
            fi
          done
          if [ -z "$skopeo_bin" ]; then
            echo "::error::skopeo-nix2container-env.nix produced no output carrying bin/skopeo" >&2
            exit 1
          fi
          echo "$skopeo_bin" >> "$GITHUB_PATH"

      - name: Pin the registry auth file
        if: steps.gate.outputs.should_publish == 'true'
        # LOAD-BEARING. The login and the lane's own skopeo calls are SEPARATE
        # processes and must resolve the SAME creds file; the default location
        # is environment-dependent on hosted runners, and a mismatch greens the
        # login then 401s the push.
        run: echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/ghcr-auth.json" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: steps.gate.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the actor through env rather than interpolating ${{ }} into the
          # shell, keeping context values off the run: command line.
          ACTOR: ${{ github.actor }}
        # The token is passed via env and `--password-stdin` only — never on a
        # command line or in a log.
        run: |
          skopeo \
            login ghcr.io -u "$ACTOR" --password-stdin \
            --authfile "$REGISTRY_AUTH_FILE" <<< "$GITHUB_TOKEN"

      - name: Publish the guest artifact by digest
        if: steps.gate.outputs.should_publish == 'true'
        # The lane realises the three assets, assembles the layout, scans its
        # annotations before any push, and asserts the registry resolved the
        # manifest it built. The deployable `repo@sha256:…` lands in the summary:
        # GHCR has no server-side tag immutability, so nothing resolves by tag.
        run: |
          set -euo pipefail
          # `--short=12` returns the shortest UNIQUE length >= 12, so a collision
          # would yield 13+ chars and fail the lane's strict 12-hex check. A
          # deterministic truncation keeps the contract exact.
          sha12="$(git rev-parse HEAD | cut -c1-12)"
          ref="$(bun tools/guest-image/publish.ts \
            --repo ghcr.io/rigelbuild/compass-guest-image --sha "$sha12")"
          echo "published $ref"
          echo "guest image: \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
