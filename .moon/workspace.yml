# yaml-language-server: $schema=https://moonrepo.dev/schemas/workspace.json
#
# moon workspace. One project per package, plus the workspace root. Tasks are
# *system* tasks — they exec the toolchain that the devenv shell puts on PATH
# (bun/node/go/moon plus buf/biome/the Go battery, all owned by devenv/nix)
# rather than moon managing its own toolchain. That keeps the nix pin files
# under tools/toolchain/versions/*.nix the single version source and moon's
# graph/caching layer toolchain-agnostic.

projects:
  # Workspace root project: owns the single bun dependency install (one root
  # bun.lock + hoisted node_modules) plus the whole-repo lint/format sweeps.
  # bun-tagged projects' `install` is a no-op that depends on `root:install`, so
  # `moon ci` installs once instead of N per-project installs racing on the
  # shared root.
  root: '.'
  # The compass.v1 contract schema and its single buf codegen pipeline.
  compass-proto: 'proto'
  # The generated TypeScript client — the sole door to the daemon.
  compass-client: 'packages/compass-client'
  # The first-party agent, built on the OMP SDK.
  compass-agent: 'packages/compass-agent'
  # The SolidJS web UI.
  compass-ui: 'apps/ui'
  # The public engineering docsite: Astro Starlight rendering the reviewed
  # docs/ tree to a public Cloudflare Pages site (SEA-1763).
  compass-eng-docs: 'apps/eng-docs'
  # The backend Go module: server + comms + the generated compass.v1 Go stubs.
  compass-go: 'go'
  # The compass-agent runtime image: a standalone nix devenv whose build
  # realises the exact artifact the publish lane ships. Registered here so the
  # image build is in the gate — affected-detection runs it only on PRs that
  # touch the image closure (see agent-image/moon.yml).
  compass-agent-image: 'agent-image'
  # The Compass native-app release bundle: a heavy nix build (realises the
  # WebKitGTK cc/pkg-config closure) that stages the versioned tarball. Same
  # affected-detection posture as compass-agent-image — registered here so the
  # bundle build rides the gate per-PR when a packaging input changes, and the
  # unconditional main + nightly full sweep (see app-bundle/moon.yml).
  compass-app-bundle: 'app-bundle'
  # The toolchain version-parity gate: asserts CI's PATH holds the dev shell's
  # toolchain, and carries the unit tests for its own comparison logic.
  toolchain-parity: 'tools/toolchain'
  # The generator-stamp gate: asserts the checked-in gen trees' `@generated by`
  # headers agree with each other and with the nixpkgs protoc-gen-es on PATH
  # (SEA-1405). Separate from compass-proto because its subject is the plugin
  # rather than the schema.
  stamp-gate: 'tools/stamp-gate'
  # The design-ledger gate: validates the Compass design-decision ledger
  # (docs/designs/product/DECISIONS.md), the per-record `Status:` headers, and
  # dangling supersession/Record pointers (SEA-1187). Migrated from the sealed
  # repo with the corpus it governs (SEA-1794).
  design-ledger-gate: 'tools/design-ledger-gate'
  # The cx-token consumption gate: scans apps/ui/src CSS for raw hex, --rigel-*
  # primitives, and literal duration/easing values banned outside tokens.css
  # (D2/D9 consumption rule; SEA-1812). Mirrors design-ledger-gate; the mark
  # file's --rigel-purple is the one narrow allowlist. WARN until the adoption
  # step-5 flip, then ERROR.
  cx-token-gate: 'tools/cx-token-gate'
  # The agent-image env gate (RIG-1444): builds the compass-agent image and
  # fails on wrong-image signals a green `container build` misses — a leaked
  # DEVENV_ env key (the fork's imageEnv filter regressing), a build-host home
  # path baked into the env, or a platform-contract drift. Complements
  # compass-agent-image, which proves the image realises; this proves it is
  # correct. Runs on the same image-closure affected-detection.
  agent-image-env-gate: 'tools/agent-image-env-gate'
  # Self-hosted Renovate (RIG-2432): the repo config + bot config + lockstep
  # postUpgradeTask scripts + the config guard suite. Ported from orion's
  # ci/renovate (SEA-847). Registered here so config.test.ts runs under the
  # `test` task in the moon-driven CI sweep — unregistered, the guard suite is
  # silently inert (moon discovers projects only from this map) and the config
  # drift it fences ships uncaught.
  renovate: 'tools/renovate'
  # The Renovate preflight probe (ported from orion's tools/renovate-preflight):
  # checks the minted App token can see the repo before `bunx renovate` runs,
  # failing fast with a named diagnosis instead of Renovate's opaque
  # platform-unknown-error. Registered so its own typecheck + unit test gate.
  renovate-preflight: 'tools/renovate-preflight'
  # The one-shot engineering-docs sanitization migration (SEA-1766, T4). Encodes
  # the four-class rewrite policy; no standing run task, deleted after T5.
  docs-migrate: 'tools/docs-migrate'
  # Vendored upstream fork subtrees (forks/<name>, SEA-1512). Each carries its
  # own nix-driven build as functional CI — so a fork-only change is gated by
  # the fork's own suite — while its tree stays exempt from the style gates
  # (biome + markdownlint exclusions). moon discovers projects from this
  # explicit map, so these entries are what make the forks moon projects at all.
  # The `-fork` id suffix marks them vendored rather than first-party.
  #
  # VENDORING A NEW FORK: add its entry here in the SAME change that adds the
  # tree. A forks/<name>/moon.yml with no entry below is silently inert — moon
  # never discovers it, so the fork ships a functional-CI registration that
  # gates nothing while reading as covered, which is worse than no gate. No
  # single PR's CI catches this: the tree and this map can arrive on separate
  # branches, each green alone, and the union is still unregistered. Confirm
  # with `moon query projects` after merging.
  # Not nix-source: upstream oh-my-pi ships no flake, so its
  # functional-CI task is upstream's own bun check (see forks/oh-my-pi/moon.yml,
  # which also states what that gate does and does not cover).
  oh-my-pi-fork: 'forks/oh-my-pi'

vcs:
  client: 'git'
  provider: 'github'
  defaultBranch: 'main'
